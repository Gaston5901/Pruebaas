<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>🌹 Rosa floreciendo</title>
  <meta name="description" content="Un solo div se transforma en una hermosa rosa 3D floreciendo.">
  <link rel="preconnect" href="https://fonts.googleapis.com/">
  <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@800;900&display=swap" rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: "Inter", sans-serif;
    }

    body {
      background: #00c8ff;
      background: radial-gradient(
        ellipse at 50% 75%,
        #00ffffda 0%,
        #00ffff9f 0%,
        #564dff 100%
      );
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .spotlight {
      position: fixed;
      top: 35%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 85vw;
      height: 85vh;
      background: radial-gradient(
        circle,
        rgba(255, 30, 80, 0.06) 0%,
        transparent 70%
      );
      filter: blur(50px);
      pointer-events: none;
      z-index: 1;
    }

    .trigger-overlay {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.85);
      backdrop-filter: blur(15px);
      -webkit-backdrop-filter: blur(15px);
      z-index: 200;
      opacity: 1;
      transition:
        opacity 0.5s cubic-bezier(0.25, 1, 0.5, 1),
        visibility 0.5s;
      visibility: visible;
    }

    .trigger-overlay.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .glass-card {
      position: relative;
      width: min(85vw, 340px);
      background: rgba(22, 10, 15, 0.55);
      border: 1px solid rgba(255, 40, 100, 0.2);
      border-radius: 24px;
      padding: 35px 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      box-shadow:
        0 25px 60px rgba(0, 0, 0, 0.6),
        0 0 40px rgba(255, 30, 80, 0.1);
      transform: scale(1);
      transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
      overflow: hidden;
    }

    .trigger-overlay.fade-out .glass-card {
      transform: scale(0.85);
    }

    .card-glow {
      position: absolute;
      width: 150px;
      height: 150px;
      border-radius: 50%;
      background: radial-gradient(
        circle,
        rgba(255, 30, 80, 0.15) 0%,
        transparent 70%
      );
      top: -40px;
      left: -40px;
      filter: blur(15px);
      pointer-events: none;
    }

    .rose-icon {
      font-size: 54px;
      margin-bottom: 12px;
      filter: drop-shadow(0 4px 12px rgba(255, 30, 80, 0.4));
      animation: pulseIcon 2s ease-in-out infinite;
    }

    @keyframes pulseIcon {
      0%,
      100% {
        transform: scale(1);
      }

      50% {
        transform: scale(1.08);
      }
    }

    .glass-card .title {
      color: #fff;
      font-family: "Playfair Display", serif;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 1px;
      margin-bottom: 22px;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.1);
    }

    .loading-bar-container {
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.06);
      border-radius: 3px;
      overflow: hidden;
      margin-bottom: 10px;
    }

    .loading-bar {
      width: 0%;
      height: 100%;
      background: linear-gradient(to right, #ff2e5e, #ff0044);
      border-radius: 3px;
      transition: width 0.1s linear;
    }

    .status-text {
      font-size: 12px;
      color: #e600ff;
      font-family: "Fira Code", monospace;
      margin-bottom: 26px;
    }

    .start-button {
      position: relative;
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, #ff2e5e 0%, #ff0044 100%);
      border: none;
      border-radius: 12px;
      color: #fff;
      font-family: "Inter", sans-serif;
      font-weight: 700;
      font-size: 14px;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      overflow: hidden;
      transition:
        transform 0.2s,
        box-shadow 0.2s,
        opacity 0.3s;
      box-shadow: 0 5px 20px rgba(255, 0, 68, 0.3);
    }

    .start-button:disabled {
      background: rgba(255, 255, 255, 0.08);
      color: rgba(255, 255, 255, 0.3);
      cursor: not-allowed;
      box-shadow: none;
      transform: none !important;
    }

    .start-button:not(:disabled):hover {
      transform: translateY(-2px);
      box-shadow:
        0 8px 25px rgba(255, 0, 68, 0.5),
        0 0 15px rgba(255, 50, 90, 0.3);
    }

    .start-button:active {
      transform: translateY(1px);
    }

    .btn-shine {
      position: absolute;
      top: 0;
      left: -100%;
      width: 50%;
      height: 100%;
      background: linear-gradient(
        to right,
        transparent,
        rgba(255, 255, 255, 0.2),
        transparent
      );
      transform: skewX(-25deg);
    }

    .start-button:not(:disabled):hover .btn-shine {
      animation: shine 1.2s ease-in-out infinite;
    }

    @keyframes shine {
      100% {
        left: 150%;
      }
    }

    .ambient-light {
      position: fixed;
      width: 500px;
      height: 500px;
      border-radius: 50%;
      background: radial-gradient(
        circle,
        rgba(255, 30, 60, 0.1) 0%,
        rgba(255, 20, 50, 0.04) 40%,
        transparent 65%
      );
      top: 32%;
      left: 50%;
      transform: translate(-50%, -50%);
      z-index: 5;
      pointer-events: none;
      opacity: 0;
      transition: opacity 1.5s ease;
    }

    .ambient-light.visible {
      opacity: 1;
    }

    .scene {
      perspective: 1200px;
      perspective-origin: 50% 35%;
      width: 100%;
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding-bottom: 0;
      z-index: 20;
    }

    .rose-wrapper {
      transform-style: preserve-3d;
      position: relative;
      width: 300px;
      height: 480px;
      transform: rotateX(-22deg) rotateY(0deg);
      will-change: transform;
      margin: 0 auto;
      left: 0;
      right: 0;
    }

    .stem-group {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 10px;
      height: 250px;
      transform-style: preserve-3d;
    }

    .stem {
      position: absolute;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 0%;
      background: linear-gradient(
        to top,
        #40ff00 0%,
        #006205 30%,
        #00ff51 70%,
        #00ff4c 100%
      );
      border-radius: 5px;
      transition: height 0.6s cubic-bezier(0.22, 1, 0.36, 1);
      overflow: hidden;
      will-change: height;
    }

    .stem.grow {
      height: 100%;
    }

    .stem-highlight {
      position: absolute;
      top: 0;
      left: 1px;
      width: 2.5px;
      height: 100%;
      background: linear-gradient(
        to bottom,
        transparent,
        rgba(150, 255, 180, 0.15),
        transparent
      );
    }

    .thorn {
      position: absolute;
      width: 11px;
      height: 6px;
      opacity: 0;
      transition: opacity 0.25s ease 0.15s;
      z-index: 2;
    }

    .thorn::before {
      content: "";
      position: absolute;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #00fe00, #16a700);
      clip-path: polygon(0% 85%, 100% 50%, 30% 0%);
    }

    .thorn-1 {
      right: -9px;
      bottom: 65%;
      transform: scaleX(-1);
    }

    .thorn-2 {
      left: -9px;
      bottom: 42%;
    }

    .stem.grow ~ .thorn {
      opacity: 0.75;
    }

    .leaf {
      position: absolute;
      width: 52px;
      height: 25px;
      opacity: 0;
      transition:
        opacity 0.25s ease,
        transform 0.4s cubic-bezier(0.34, 1.45, 0.64, 1);
      z-index: 2;
      will-change: transform, opacity;
    }

    .leaf::before {
      content: "";
      position: absolute;
      width: 100%;
      height: 100%;
      background: linear-gradient(160deg, #00ff55 0%, #00ab36 40%, #00ff40 100%);
      border-radius: 2px 65% 2px 65%;
    }

    .leaf-vein {
      position: absolute;
      width: 60%;
      height: 1px;
      background: rgba(0, 255, 72, 0.808);
      top: 48%;
      left: 20%;
      z-index: 1;
    }

    .leaf-left {
      left: -52px;
      bottom: 56%;
      transform-origin: right center;
      transform: rotate(35deg) scale(0);
    }

    .leaf-left::before {
      border-radius: 65% 2px 65% 2px;
    }

    .leaf-right {
      left: 10px;
      bottom: 38%;
      transform-origin: left center;
      transform: rotate(-35deg) scale(0);
    }

    .leaf-right::before {
      border-radius: 2px 65% 2px 65%;
    }

    .leaf.visible {
      opacity: 1;
    }

    .leaf-left.visible {
      transform: rotate(15deg) scale(1);
    }

    .leaf-right.visible {
      transform: rotate(-15deg) scale(1);
    }

    .calyx {
      position: absolute;
      bottom: 242px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      transform-style: preserve-3d;
      z-index: 1;
    }

    .sepal {
      position: absolute;
      bottom: -4px;
      left: 50%;
      width: 14px;
      height: 32px;
      transform-origin: 50% 100%;
      background: linear-gradient(to top, #00ff40 0%, #00ff55 40%, #00ff4c 100%);
      border-radius: 50% 50% 10% 10% / 80% 80% 20% 20%;
      clip-path: polygon(10% 100%, 0% 30%, 50% 0%, 100% 30%, 90% 100%);
      opacity: 0;
      transform: translateX(-50%) rotateY(var(--sepal-angle, 0deg)) rotateX(60deg)
        scale(0.5);
      transition:
        transform 0.45s cubic-bezier(0.25, 1, 0.5, 1) var(--sepal-delay, 0s),
        opacity 0.2s ease var(--sepal-delay, 0s);
      will-change: transform, opacity;
    }

    .calyx.visible .sepal {
      opacity: 0.95;
      transform: translateX(-50%) rotateY(var(--sepal-angle, 0deg))
        rotateX(var(--sepal-curl, 22deg)) scale(1);
    }

    .rose-head {
      position: absolute;
      bottom: 245px;
      left: 50%;
      transform: translateX(-50%);
      width: 0;
      height: 0;
      transform-style: preserve-3d;
      z-index: 10;
    }

    .rose-glow {
      position: absolute;
      width: 400px;
      height: 400px;
      border-radius: 50%;
      background: radial-gradient(
        circle,
        rgba(160, 5, 30, 0.18) 0%,
        rgba(100, 0, 20, 0.05) 45%,
        transparent 65%
      );
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      opacity: 0;
      transition: opacity 1.8s ease;
      z-index: -1;
      pointer-events: none;
    }

    .rose-glow-inner {
      position: absolute;
      width: 200px;
      height: 200px;
      border-radius: 50%;
      background: radial-gradient(
        circle,
        rgba(180, 40, 60, 0.15) 0%,
        transparent 65%
      );
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      opacity: 0;
      transition: opacity 1s ease 0.4s;
      z-index: -1;
      pointer-events: none;
    }

    .rose-head.blooming .rose-glow {
      opacity: 1;
    }

    .rose-head.blooming .rose-glow-inner {
      opacity: 1;
    }

    .petal {
      position: absolute;
      bottom: 0;
      left: 50%;
      transform-origin: 50% 100%;
      opacity: 0.002;
      will-change: transform, opacity;
      border-radius: 50% 50% 35% 35% / 45% 45% 55% 55%;
      transform: translateX(-50%) rotateY(var(--angle, 0deg)) translateZ(0px)
        rotateX(90deg) scale(0.1);
      transition:
        transform var(--bloom-dur, 0.6s) ease-in-out var(--delay, 0s),
        opacity 0.35s ease var(--delay, 0s);
    }

    .rose-head.blooming .petal {
      opacity: 1;
      transform: translateX(-50%) rotateY(var(--angle, 0deg))
        translateZ(var(--tz, 0px)) rotateX(var(--curl, 30deg))
        scale(var(--scale, 1));
    }

    .petal-bud {
      background: linear-gradient(
        to bottom,
        #ff4f9a 0%,
        #ff2f7d 40%,
        #e81768 75%,
        #b9094d 100%
      );
    }

    .petal-core {
      background: linear-gradient(
        to bottom,
        #ff68aa 0%,
        #ff3f8d 40%,
        #ed1f70 75%,
        #c20b54 100%
      );
    }

    .petal-inner {
      background: linear-gradient(
        to bottom,
        #ff7fba 0%,
        #ff4d99 40%,
        #f02b7d 75%,
        #ca105c 100%
      );
    }

    .petal-mid-inner {
      background: linear-gradient(
        to bottom,
        #ff91c5 0%,
        #ff5ba5 40%,
        #f33889 75%,
        #d31867 100%
      );
    }

    .petal-mid {
      background: linear-gradient(
        to bottom,
        #ffa3d0 0%,
        #ff6bb0 40%,
        #f84896 75%,
        #d92170 100%
      );
    }

    .petal-outer {
      background: linear-gradient(
        to bottom,
        #ffb5d9 0%,
        #ff7abd 40%,
        #fa579f 75%,
        #df2d78 100%
      );
    }

    .petal-blush {
      background: linear-gradient(
        to bottom,
        #ffc7e3 0%,
        #ff8ac5 40%,
        #ff65aa 75%,
        #e83b83 100%
      );
    }

    .end-text {
      position: fixed;
      bottom: 8%;
      left: 50%;
      font-family: 'Montserrat', sans-serif;
      font-weight: 999;
      transform: translateX(-50%);
      text-align: center;
      opacity: 0;
      transition: opacity 0.8s ease;
      z-index: 60;
    }

    .end-text.visible {
      opacity: 1;
    }

    .tagline {
      font-family: "Playfair Display", serif;
      font-style: italic;
      font-size: clamp(18px, 5.5vw, 30px);
      color: rgb(255, 0, 238);
      letter-spacing: 4px;
      text-shadow:
        0 0 25px rgb(255, 0, 238),
        0 0 60px rgba(255, 0, 234, 0.15);
      margin-bottom: 8px;
    }

    .rose-emoji {
      font-size: 32px;
      display: block;
      animation: floatEmoji 3s ease-in-out infinite;
    }

    @keyframes floatEmoji {
      0%,
      100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-8px);
      }
    }

    @media (max-width: 480px) {
      .rose-wrapper {
        transform: scale(0.82);
      }

      .tagline {
        letter-spacing: 2px;
      }
    }

    @media (max-height: 600px) {
      .rose-wrapper {
        transform: scale(0.68);
      }

      .end-text {
        bottom: 3%;
      }
    }

    .petal {
      --bloom-dur: 0.6s !important;
      --delay: calc(var(--delay, 0s) * 0.15) !important;
    }

    .sepal {
      --sepal-delay: calc(var(--sepal-delay, 0s) * 0.15) !important;
    }

    .rose-head {
      transform-style: preserve-3d;
      animation: roseOnlySpin 18s linear infinite;
      animation-play-state: paused;
    }

    .rose-head.blooming {
      animation-play-state: running;
    }

    @keyframes roseOnlySpin {
      from {
        transform: translateX(-50%) rotateY(0deg);
      }
      to {
        transform: translateX(-50%) rotateY(360deg);
      }
    }

    .glass-card {
      background: linear-gradient(
        160deg,
        rgba(30, 8, 18, 0.72) 0%,
        rgba(15, 4, 10, 0.85) 100%
      );
      border: 1px solid rgba(255, 60, 120, 0.25);
      box-shadow:
        0 25px 60px rgba(0, 0, 0, 0.7),
        0 0 60px rgba(255, 30, 80, 0.18),
        inset 0 0 30px rgba(255, 30, 80, 0.05);
    }

    .card-glow-2 {
      top: auto;
      left: auto;
      bottom: -50px;
      right: -50px;
      background: radial-gradient(
        circle,
        rgba(255, 0, 200, 0.18) 0%,
        transparent 70%
      );
    }

    .rose-gif-wrapper {
      position: relative;
      width: 110px;
      height: 110px;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      animation: floatGif 3.5s ease-in-out infinite;
    }

    .rose-gif {
      width: 100%;
      height: 100%;
      object-fit: contain;
      border-radius: 16px;
      filter: drop-shadow(0 0 14px rgba(255, 40, 100, 0.55))
        drop-shadow(0 0 30px rgba(255, 0, 200, 0.35));
      z-index: 2;
      position: relative;
      mix-blend-mode: screen;
    }

    .rose-gif-glow {
      position: absolute;
      inset: -20%;
      border-radius: 50%;
      background: radial-gradient(
        circle,
        rgba(255, 40, 120, 0.35) 0%,
        rgba(255, 0, 200, 0.15) 40%,
        transparent 70%
      );
      filter: blur(18px);
      z-index: 1;
      animation: pulseGlow 2.5s ease-in-out infinite;
    }

    @keyframes floatGif {
      0%,
      100% {
        transform: translateY(0) scale(1);
      }
      50% {
        transform: translateY(-8px) scale(1.04);
      }
    }

    @keyframes pulseGlow {
      0%,
      100% {
        opacity: 0.7;
        transform: scale(0.95);
      }
      50% {
        opacity: 1;
        transform: scale(1.1);
      }
    }

    .glass-card .title {
      background: linear-gradient(90deg, #ff9ec7, #ff2e7e, #ff00ea, #ff9ec7);
      background-size: 200% auto;
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      color: transparent;
      font-family: 'Montserrat', 'Playfair Display', serif;
      font-weight: 900;
      letter-spacing: 3px;
      font-size: 28px;
      animation: shineTitle 4s linear infinite;
    }

    @keyframes shineTitle {
      to {
        background-position: 200% center;
      }
    }

    .loading-bar-container {
      height: 8px;
      background: rgba(255, 255, 255, 0.07);
      box-shadow: inset 0 0 8px rgba(0, 0, 0, 0.5);
    }

    .loading-bar {
      background: linear-gradient(90deg, #ff2e5e, #ff00ea, #ff2e5e);
      background-size: 200% auto;
      animation: shineBar 2s linear infinite;
      box-shadow: 0 0 12px rgba(255, 0, 200, 0.7);
    }

    @keyframes shineBar {
      to {
        background-position: 200% center;
      }
    }

    .start-button {
      background: linear-gradient(135deg, #ff2e5e 0%, #ff00c8 100%);
      box-shadow:
        0 5px 25px rgba(255, 0, 150, 0.45),
        0 0 25px rgba(255, 40, 120, 0.25);
    }

    .start-button:not(:disabled):hover {
      box-shadow:
        0 8px 30px rgba(255, 0, 150, 0.65),
        0 0 35px rgba(255, 40, 120, 0.45);
    }

    @media (max-width: 768px) {
      .scene {
        perspective: 900px;
        perspective-origin: 50% 40%;
        overflow: hidden;
      }

      .rose-wrapper {
        transform: rotateX(-22deg) rotateY(0deg) scale(0.85);
        transform-origin: center center;
      }

      .ambient-light {
        width: 320px;
        height: 320px;
      }
    }

    @media (max-width: 480px) {
      .scene {
        perspective: 800px;
        perspective-origin: 50% 42%;
      }

      .rose-wrapper {
        transform: rotateX(-22deg) rotateY(0deg) scale(0.72);
        transform-origin: center center;
        height: 480px;
      }

      .rose-glow {
        width: 300px;
        height: 300px;
      }

      .rose-glow-inner {
        width: 150px;
        height: 150px;
      }

      .end-text {
        bottom: 6%;
      }

      .tagline {
        font-size: clamp(16px, 5vw, 24px);
        letter-spacing: 2px;
      }

      .rose-emoji {
        font-size: 26px;
      }

      .glass-card {
        padding: 28px 20px;
      }

      .glass-card .title {
        font-size: 22px;
        letter-spacing: 2px;
      }

      .rose-gif-wrapper {
        width: 90px;
        height: 90px;
      }

      .start-button {
        padding: 14px;
        font-size: 13px;
      }
    }

    @media (max-width: 360px) {
      .rose-wrapper {
        transform: rotateX(-22deg) rotateY(0deg) scale(0.62);
        transform-origin: center center;
      }

      .glass-card .title {
        font-size: 20px;
      }

      .rose-gif-wrapper {
        width: 75px;
        height: 75px;
      }

      .tagline {
        font-size: 15px;
        letter-spacing: 1.5px;
      }
    }

    @media (max-height: 500px) and (orientation: landscape) {
      .rose-wrapper {
        transform: rotateX(-22deg) rotateY(0deg) scale(0.55);
        transform-origin: center center;
      }

      .end-text {
        bottom: 2%;
      }

      .tagline {
        font-size: 14px;
        margin-bottom: 2px;
      }

      .rose-emoji {
        font-size: 20px;
      }

      .glass-card {
        padding: 20px 18px;
        width: min(80vw, 300px);
      }

      .rose-gif-wrapper {
        width: 60px;
        height: 60px;
        margin-bottom: 8px;
      }

      .glass-card .title {
        font-size: 18px;
        margin-bottom: 14px;
      }
    }

    .rose-wrapper {
      transform-origin: center center;
      left: 0;
      right: 0;
      margin: 0 auto;
    }

    html, body {
      -webkit-text-size-adjust: 100%;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }

  </audio>

  <script>
    (function() {
      const overlay = document.getElementById('triggerOverlay');
      const startButton = document.getElementById('startButton');
      const loadingBar = document.getElementById('loadingBar');
      const statusText = document.getElementById('statusText');
      const roseWrapper = document.getElementById('roseWrapper');
      const stem = document.getElementById('stem');
      const leafLeft = document.getElementById('leafLeft');
      const leafRight = document.getElementById('leafRight');
      const calyx = document.getElementById('calyx');
      const roseHead = document.getElementById('roseHead');
      const endText = document.getElementById('endText');
      const ambientLight = document.getElementById('ambientLight');
      const backgroundMusic = document.getElementById('backgroundMusic');

      stem.classList.remove('grow');
      leafLeft.classList.remove('visible');
      leafRight.classList.remove('visible');
      calyx.classList.remove('visible');
      roseHead.classList.remove('blooming');
      roseWrapper.classList.remove('rotating');
      endText.classList.remove('visible');
      ambientLight.classList.remove('visible');

      let isAnimating = false;

      function startBloom() {
        if (isAnimating) return;
        isAnimating = true;

        backgroundMusic.play().catch(function(error) {
          console.log('Error al reproducir música:', error);
        });

        startButton.disabled = true;
        startButton.querySelector('.btn-text').textContent = 'Floreciendo...';
        statusText.textContent = 'Cargando pétalos...';

        let progress = 0;
        const loadInterval = setInterval(() => {
          progress += 25;
          loadingBar.style.width = Math.min(progress, 100) + '%';
          if (progress >= 100) {
            clearInterval(loadInterval);
            statusText.textContent = '¡Lista para florecer!';
          }
        }, 50);

        setTimeout(() => {
          overlay.classList.add('fade-out');
          ambientLight.classList.add('visible');

          setTimeout(() => {
            stem.classList.add('grow');
            leafLeft.classList.add('visible');
            leafRight.classList.add('visible');

            setTimeout(() => {
              calyx.classList.add('visible');
            }, 150);

            setTimeout(() => {
              roseHead.classList.add('blooming');
            }, 300);

            setTimeout(() => {
              roseWrapper.classList.add('rotating');
            }, 500);

            setTimeout(() => {
              endText.classList.add('visible');
            }, 900);

          }, 200);
        }, 250);
      }

      startButton.addEventListener('click', startBloom);
    })();
    document.addEventListener('contextmenu', e => e.preventDefault());
  document.addEventListener('dragstart', e => e.preventDefault())
  </script>
