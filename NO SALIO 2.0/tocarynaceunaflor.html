<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flores para Ti</title>
    <!-- Créditos del concepto original: Ksenia Kondrashova -->
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Caveat:wght@600&family=Poppins:wght@300;500&display=swap');

      html, body {
        overflow: hidden;
        padding: 0;
        margin: 0;
        width: 100%;
        height: 100vh;
        background: linear-gradient(135deg, #0d0814 0%, #1a0b2e 50%, #280a33 100%);
        font-family: 'Poppins', sans-serif;
      }

      .container {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100vh;
        display: flex;
        flex-direction: column-reverse;
        align-items: start;
        z-index: 2;
      }

      .clean-btn {
        z-index: 10;
        font-size: 14px;
        color: rgba(255, 255, 255, 0.8);
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(5px);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 20px;
        user-select: none;
        padding: 8px 18px;
        margin: 0 0 20px 20px;
        cursor: pointer;
        transition: all 0.3s ease;
      }

      .clean-btn:hover {
        background: rgba(255, 255, 255, 0.25);
        color: #fff;
        transform: scale(1.05);
      }

      canvas {
        position: absolute;
        top: 0;
        left: 0;
        display: block;
      }

      .header-title {
        position: fixed;
        top: 8%;
        left: 50%;
        transform: translateX(-50%);
        color: rgba(255, 255, 255, 0.9);
        text-align: center;
        font-size: 1.2rem;
        font-weight: 300;
        letter-spacing: 1px;
        text-shadow: 0 0 10px rgba(255, 105, 180, 0.5);
        user-select: none;
        pointer-events: none;
        z-index: 5;
      }

      .dedication {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        color: #fff;
        text-align: center;
        font-family: 'Caveat', cursive;
        font-size: 3.5rem;
        text-shadow: 0 0 15px rgba(255, 105, 180, 0.8), 0 0 25px rgba(147, 112, 219, 0.6);
        user-select: none;
        pointer-events: none;
        z-index: 5;
        white-space: nowrap;
        animation: pulse 3s infinite ease-in-out;
      }

      @keyframes pulse {
        0%, 100% { transform: translate(-50%, -50%) scale(1); opacity: 0.95; }
        50% { transform: translate(-50%, -50%) scale(1.03); opacity: 1; }
      }

      @media (max-width: 640px) {
        .dedication { font-size: 2.3rem; }
        .header-title { font-size: 0.9rem; top: 5%; }
      }
    </style>
  </head>
  <body>
    <div class="header-title">Toca en cualquier lugar para hacer florecer el jardín</div>
    <div class="dedication">Te amo ojos bonitos</div>

    <div class="container">
      <canvas id="canvas"></canvas>
      <div class="clean-btn">Limpiar jardín</div>
    </div>

    <script type="x-shader/x-fragment" id="fragmentShader">
        #define PI 3.14159265359

        uniform float u_ratio;
        uniform vec2 u_cursor;
        uniform float u_stop_time;
        uniform float u_clean;
        uniform vec2 u_stop_randomizer;

        uniform sampler2D u_texture;
        varying vec2 vUv;

        vec3 mod289(vec3 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
        vec2 mod289(vec2 x) { return x - floor(x * (1.0 / 289.0)) * 289.0; }
        vec3 permute(vec3 x) { return mod289(((x*34.0)+1.0)*x); }
        float snoise(vec2 v) {
            const vec4 C = vec4(0.211324865405187, 0.366025403784439, -0.577350269189626, 0.024390243902439);
            vec2 i = floor(v + dot(v, C.yy));
            vec2 x0 = v - i + dot(i, C.xx);
            vec2 i1 = (x0.x > x0.y) ? vec2(1.0, 0.0) : vec2(0.0, 1.0);
            vec4 x12 = x0.xyxy + C.xxzz;
            x12.xy -= i1;
            i = mod289(i);
            vec3 p = permute(permute(i.y + vec3(0.0, i1.y, 1.0)) + i.x + vec3(0.0, i1.x, 1.0));
            vec3 m = max(0.5 - vec3(dot(x0, x0), dot(x12.xy, x12.xy), dot(x12.zw, x12.zw)), 0.0);
            m = m*m; m = m*m;
            vec3 x = 2.0 * fract(p * C.www) - 1.0;
            vec3 h = abs(x) - 0.5;
            vec3 ox = floor(x + 0.5);
            vec3 a0 = x - ox;
            m *= 1.79284291400159 - 0.85373472095314 * (a0*a0 + h*h);
            vec3 g;
            g.x = a0.x * x0.x + h.x * x0.y;
            g.yz = a0.yz * x12.xz + h.yz * x12.yw;
            return 130.0 * dot(m, g);
        }

        float get_flower_shape(vec2 _p, float _pet_n, float _angle, float _outline, float _type) {
            _angle *= 3.;
            _p = vec2(_p.x * cos(_angle) - _p.y * sin(_angle), _p.x * sin(_angle) + _p.y * cos(_angle));
            float a = atan(_p.y, _p.x);

            float flower_sectoral_shape = 0.0;
            if (_type < 0.33) {
                // Flor tipo Tulipán / Copa
                flower_sectoral_shape = pow(abs(sin(a * _pet_n)), 0.4) + 0.25;
            } else if (_type < 0.66) {
                // Flor tipo Margarita / Multipétalo
                flower_sectoral_shape = pow(abs(sin(a * (_pet_n + 2.0))), 0.2) + 0.15;
            } else {
                // Flor Estrellada
                flower_sectoral_shape = abs(cos(a * _pet_n * 1.5)) * 0.7 + 0.3;
            }

            vec2 flower_size_range = vec2(.03, .09);
            float size = flower_size_range[0] + u_stop_randomizer[0] * flower_size_range[1];

            float flower_radial_shape = pow(length(_p) / size, 2.);
            flower_radial_shape -= .1 * sin(8. * a);
            flower_radial_shape = max(.1, flower_radial_shape);
            flower_radial_shape += smoothstep(0., 0.03, -_p.y + .2 * abs(_p.x));

            float grow_time = step(.25, u_stop_time) * pow(u_stop_time, .3);
            float flower_shape = 1. - smoothstep(0., flower_sectoral_shape, _outline * flower_radial_shape / grow_time);
            flower_shape *= (1. - step(1., grow_time));

            return flower_shape;
        }

        float get_stem_shape(vec2 _p, vec2 _uv, float _w, float _angle) {
            _w = max(.004, _w);
            float x_offset = _p.y * sin(_angle);
            x_offset *= pow(3. * _uv.y, 2.);
            _p.x -= x_offset;

            float noise_power = .5;
            float cursor_horizontal_noise = noise_power * snoise(2. * _uv * u_stop_randomizer[0]);
            cursor_horizontal_noise *= pow(dot(_p.y, _p.y), .6);
            cursor_horizontal_noise *= pow(dot(_uv.y, _uv.y), .3);
            _p.x += cursor_horizontal_noise;

            float left = smoothstep(-_w, 0., _p.x);
            float right = 1. - smoothstep(0., _w, _p.x);
            float stem_shape = left * right;

            float grow_time = 1. - smoothstep(0., .2, u_stop_time);
            float stem_top_mask = smoothstep(0., pow(grow_time, .5), .03 -_p.y);
            stem_shape *= stem_top_mask;
            stem_shape *= (1. - step(.17, u_stop_time));

            return stem_shape;
        }

        void main() {
            vec3 base = texture2D(u_texture, vUv).xyz;
            vec2 uv = vUv;
            uv.x *= u_ratio;
            vec2 cursor = vUv - u_cursor.xy;
            cursor.x *= u_ratio;

            // Selección de colores variados
            float flower_type = u_stop_randomizer[1];
            vec3 stem_color = vec3(.1 + u_stop_randomizer[0] * .4, .6 + u_stop_randomizer[1] * .3, .2);
            
            vec3 flower_color;
            if (flower_type < 0.33) {
                flower_color = vec3(0.9, 0.2 + 0.4 * u_stop_randomizer[0], 0.5); // Rosados / Carmesí
            } else if (flower_type < 0.66) {
                flower_color = vec3(0.95, 0.75, 0.2 + 0.3 * u_stop_randomizer[0]); // Amarrillo / Dorado
            } else {
                flower_color = vec3(0.6 + 0.3 * u_stop_randomizer[0], 0.3, 0.95); // Púrpura / Violeta
            }

            float angle = .5 * (u_stop_randomizer[0] - .5);

            float stem_shape = get_stem_shape(cursor, uv, .003, angle);
            stem_shape += get_stem_shape(cursor + vec2(0., .2 + .5 * u_stop_randomizer[0]), uv, .003, angle);
            float stem_mask = 1. - get_stem_shape(cursor, uv, .004, angle);
            stem_mask -= get_stem_shape(cursor + vec2(0., .2 + .5 * u_stop_randomizer[0]), uv, .004, angle);

            float petals_back_number = 1. + floor(u_stop_randomizer[0] * 3.);
            float angle_offset = -(2. * step(0., angle) - 1.) * .1 * u_stop_time;
            float flower_back_shape = get_flower_shape(cursor, petals_back_number, angle + angle_offset, 1.5, flower_type);
            float flower_back_mask = 1. - get_flower_shape(cursor, petals_back_number, angle + angle_offset, 1.6, flower_type);

            float petals_front_number = 2. + floor(u_stop_randomizer[1] * 3.);
            float flower_front_shape = get_flower_shape(cursor, petals_front_number, angle, 1., flower_type);
            float flower_front_mask = 1. - get_flower_shape(cursor, petals_front_number, angle, .95, flower_type);

            vec3 color = base;
            color *= stem_mask;
            color *= flower_back_mask;
            color *= flower_front_mask;

            color += (stem_shape * stem_color);
            color += (flower_back_shape * (flower_color + vec3(0., .4 * u_stop_time, 0.)));
            color += (flower_front_shape * flower_color);

            color.r *= 1. - (.5 * flower_back_shape * flower_front_shape);
            color.b *= 1. - (flower_back_shape * flower_front_shape);

            color *= u_clean;

            gl_FragColor = vec4(color, 1.);
        }
    </script>

    <script type="x-shader/x-vertex" id="vertexShader">
        varying vec2 vUv;
        void main() {
            vUv = uv;
            gl_Position = vec4(position, 1.);
        }
    </script>

    <script type="module">
      import * as THREE from "https://cdn.skypack.dev/three@0.133.1/build/three.module";

      const canvasEl = document.querySelector("#canvas");
      const cleanBtn = document.querySelector(".clean-btn");

      const pointer = {
          x: .5,
          y: .5,
          clicked: true,
      };

      window.setTimeout(() => {
          pointer.x = .5;
          pointer.y = .4;
          pointer.clicked = true;
      }, 500);

      let basicMaterial, shaderMaterial;
      let renderer = new THREE.WebGLRenderer({
          canvas: canvasEl,
          alpha: true,
      });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      let sceneShader = new THREE.Scene();
      let sceneBasic = new THREE.Scene();
      let camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0, 10);
      let clock = new THREE.Clock();

      let renderTargets = [
          new THREE.WebGLRenderTarget(window.innerWidth, window.innerHeight),
          new THREE.WebGLRenderTarget(window.innerWidth, window.innerHeight)
      ];

      createPlane();
      updateSize();

      window.addEventListener("resize", () => {
          updateSize();
          cleanCanvas();
      });

      render();

      let isTouchScreen = false;

      window.addEventListener("click", e => {
        if (!isTouchScreen && e.target !== cleanBtn) {
          pointer.x = e.clientX / window.innerWidth;
          pointer.y = e.clientY / window.innerHeight;
          pointer.clicked = true;       
        }
      });
      
      window.addEventListener("touchstart", e => {
        if (e.target !== cleanBtn) {
          isTouchScreen = true;
          pointer.x = e.targetTouches[0].clientX / window.innerWidth;
          pointer.y = e.targetTouches[0].clientY / window.innerHeight;
          pointer.clicked = true;
        }
      });

      cleanBtn.addEventListener("click", cleanCanvas);

      function cleanCanvas() {
          pointer.vanishCanvas = true;
          setTimeout(() => {
              pointer.vanishCanvas = false;
          }, 50);
      }

      function createPlane() {
          shaderMaterial = new THREE.ShaderMaterial({
              uniforms: {
                  u_stop_time: {type: "f", value: 0.},
                  u_stop_randomizer: {type: "v2", value: new THREE.Vector2(Math.random(), Math.random())},
                  u_cursor: {type: "v2", value: new THREE.Vector2(pointer.x, pointer.y)},
                  u_ratio: {type: "f", value: window.innerWidth / window.innerHeight},
                  u_texture: {type: "t", value: null},
                  u_clean: {type: "f", value: 1.},
              },
              vertexShader: document.getElementById("vertexShader").textContent,
              fragmentShader: document.getElementById("fragmentShader").textContent
          });
          basicMaterial = new THREE.MeshBasicMaterial();
          const planeGeometry = new THREE.PlaneGeometry(2, 2);
          const planeBasic = new THREE.Mesh(planeGeometry, basicMaterial);
          const planeShader = new THREE.Mesh(planeGeometry, shaderMaterial);
          sceneBasic.add(planeBasic);
          sceneShader.add(planeShader);
      }

      function render() {
          shaderMaterial.uniforms.u_clean.value = pointer.vanishCanvas ? 0 : 1;
          shaderMaterial.uniforms.u_texture.value = renderTargets[0].texture;

          if (pointer.clicked) {
              shaderMaterial.uniforms.u_cursor.value = new THREE.Vector2(pointer.x, 1 - pointer.y);
              shaderMaterial.uniforms.u_stop_randomizer.value = new THREE.Vector2(Math.random(), Math.random());
              shaderMaterial.uniforms.u_stop_time.value = 0.;
              pointer.clicked = false;
          }
          shaderMaterial.uniforms.u_stop_time.value += clock.getDelta();

          renderer.setRenderTarget(renderTargets[1]);
          renderer.render(sceneShader, camera);
          basicMaterial.map = renderTargets[1].texture;
          renderer.setRenderTarget(null);
          renderer.render(sceneBasic, camera);

          let tmp = renderTargets[0];
          renderTargets[0] = renderTargets[1];
          renderTargets[1] = tmp;

          requestAnimationFrame(render);
      }

      function updateSize() {
          shaderMaterial.uniforms.u_ratio.value = window.innerWidth / window.innerHeight;
          renderer.setSize(window.innerWidth, window.innerHeight);
      }
    </script>
  </body>
</html>
