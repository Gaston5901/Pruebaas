  <style>
:root{
  --bg1: #fff0f6;
  --bg2: #fbeaff;
  --card: rgba(255,255,255,0.85);
  --card2: rgba(255,255,255,0.95);
  --stroke: #f8bbd0;
  --text: #7c3a6a;
  --muted: #b48bbd;
  --accent1: #f48fb1;
  --accent2: #b39ddb;
  --accent3: #ffe082;
  --gold: #ffd700;
}

*{ box-sizing:border-box; }
html,body{ height:100%; }
body{
  margin:0;
  color:var(--text);
  font-family: 'Quicksand', 'Nunito', 'Segoe UI', Arial, sans-serif;
  background:
    radial-gradient(900px 500px at 15% 10%, #ffe0ef 30%, transparent 60%),
    radial-gradient(900px 500px at 85% 20%, #e1bee7 25%, transparent 60%),
    radial-gradient(900px 600px at 50% 95%, #fffde7 20%, transparent 60%),
    linear-gradient(180deg, var(--bg1), var(--bg2));
  overflow-x:hidden;
  min-height: 100vh;
}

.wrap{
  max-width: 1100px;
  margin: 0 auto;
  padding: clamp(18px, 3vw, 34px);
}

/* ==========================================
   HEADER Y CONTENEDORES
   ========================================== */
header{
  display: flex;
  flex-direction: column;
  gap: 14px;
  margin-bottom: 22px;
}

/* Fila Superior: Título + Badge */
.header-top{
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  width: 100%;
}

/* Fila Inferior: Botones de íconos distribuidos */
.header-actions{
  display: flex;
  align-items: center;
  justify-content: flex-end; /* Alineados a la derecha en compu */
  gap: 10px;
  width: 100%;
}

.title{
  line-height:1.05;
  margin:0;
  font-size: clamp(2.1rem, 4vw, 3.2rem);
  letter-spacing:-0.02em;
  font-family: 'Quicksand', 'Nunito', 'Segoe UI', Arial, sans-serif;
  color: var(--accent1);
  text-shadow: 0 2px 12px #ffe0ef80;
}

.subtitle{
  margin: 10px 0 0;
  color: var(--muted);
  font-size: clamp(1rem, 1.7vw, 1.15rem);
  max-width: 56ch;
}

.pill{
  display:inline-flex;
  align-items:center;
  gap:8px;
  padding: 10px 18px;
  background: linear-gradient(90deg, #ffe0ef 60%, #fffde7 100%);
  border: 1.5px solid var(--accent1);
  border-radius: 999px;
  color: var(--accent1);
  font-size: 1.05rem;
  font-weight: 600;
  box-shadow: 0 4px 18px #f8bbd055;
  user-select:none;
  white-space:nowrap;
  letter-spacing: 0.01em;
}

/* ==========================================
   GRID Y TARJETAS
   ========================================== */
.grid{
  display:grid;
  grid-template-columns: repeat(12, 1fr);
  gap: 14px;
  margin-top: 18px;
}

.card{
  grid-column: span 12;
  text-decoration:none;
  color:inherit;
  position:relative;
  overflow:hidden;
  border-radius: 22px;
  background: linear-gradient(180deg, var(--card), var(--card2));
  border: 2px solid var(--accent1);
  box-shadow: 0 8px 32px #f8bbd055, 0 2px 8px #fffde7cc;
  padding: 18px 18px 16px;
  transition: transform .18s ease, border-color .18s ease, background .18s ease;
  backdrop-filter: blur(2px);
  content-visibility: auto;
  contain-intrinsic-size: 220px;
}

.card:hover{
  transform: translateY(-4px) scale(1.025);
  border-color: var(--gold);
  background: linear-gradient(180deg, #fffde7 60%, #ffe0ef 100%);
  box-shadow: 0 12px 36px #ffd70044, 0 2px 8px #fffde7cc;
}

.card::before{
  content:"";
  position:absolute;
  inset:-40px;
  background:
    radial-gradient(220px 140px at 10% 10%, #f8bbd0 30%, transparent 65%),
    radial-gradient(240px 150px at 90% 20%, #b39ddb 22%, transparent 70%),
    radial-gradient(200px 160px at 30% 120%, #ffe082 18%, transparent 70%);
  opacity:.5;
  pointer-events:none;
}

.card > *{ position:relative; }

.card h2{
  margin: 0 0 8px;
  font-size: 1.22rem;
  letter-spacing:-0.01em;
  color: var(--accent1);
  font-family: 'Quicksand', 'Nunito', 'Segoe UI', Arial, sans-serif;
  font-weight: 700;
  text-shadow: 0 1px 8px #ffe0ef55;
}

.card-number{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width: 28px;
  height: 28px;
  margin-right: 8px;
  border-radius: 999px;
  background: linear-gradient(90deg, #f48fb1 0%, #ffe082 100%);
  color: #7c3a6a;
  font-size: .9rem;
  font-weight: 800;
  box-shadow: 0 2px 8px #f8bbd055;
  border: 1.5px solid #f8bbd0;
  flex: 0 0 auto;
}

.meta{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap: 10px;
  color: var(--muted);
  font-size: .97rem;
}

.tag{
  display:inline-flex;
  gap:8px;
  align-items:center;
  padding: 6px 12px;
  border-radius: 999px;
  border: 1.5px solid var(--accent2);
  background: #f3e5f5;
  color: #7c3a6a;
  font-size: .89rem;
  font-weight: 500;
  letter-spacing: 0.01em;
}

.arrow{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  width: 36px;
  height: 36px;
  border-radius: 999px;
  border: 1.5px solid var(--accent3);
  background: #fffde7;
  color: #fbc02d;
  flex: 0 0 auto;
  font-size: 1.2rem;
  box-shadow: 0 2px 8px #ffe08244;
}

/* Variante de la carta para raspar */
.card[data-num="25"]{
  background: linear-gradient(150deg, #7a0f22, #4c0714 52%, #26030a);
  border-color: #d4af37;
  box-shadow: 0 8px 32px rgba(48, 3, 10, .35), 0 2px 8px rgba(212,175,55,.35);
}

.card[data-num="25"]::before{
  background:
    repeating-linear-gradient(135deg, transparent 0 28px, rgba(212,175,55,.16) 29px 31px),
    radial-gradient(220px 140px at 10% 10%, #b51d3b 20%, transparent 68%),
    radial-gradient(240px 150px at 90% 20%, #8c1024 22%, transparent 70%);
  opacity: .7;
}

.card[data-num="25"] h2{
  color: #f7d486;
  text-shadow: 0 1px 8px rgba(255,200,90,.35);
}

.card[data-num="25"] .card-number{
  background: linear-gradient(135deg, #f7d486, #d4af37);
  color: #4c0714;
  border-color: #ffe7a3;
  box-shadow: 0 2px 8px rgba(212,175,55,.35);
}

.card[data-num="25"] .tag{
  background: rgba(255,253,243,.95);
  border-color: #d4af37;
  color: #6b1525;
}

.card[data-num="25"] .arrow{
  background: #fffdf3;
  border-color: #d4af37;
  color: #8c1024;
  box-shadow: 0 2px 8px rgba(212,175,55,.35);
}

.card[data-num="25"]:hover{
  border-color: #ffe7a3;
  background: linear-gradient(150deg, #8c1024, #5a0513 52%, #30030a);
  box-shadow: 0 12px 36px rgba(48,3,10,.5), 0 2px 8px rgba(212,175,55,.45);
}

/* Variante de la Rosa: rojo oscuro estilo cúpula de vidrio */
.card[data-num="26"]{
  background:
    radial-gradient(240px 140px at 20% 6%, rgba(255, 120, 120, .22), transparent 65%),
    linear-gradient(150deg, #4d0713, #2a030b 52%, #120106);
  border-color: #ff8a80;
  animation: rosa-glow 4s ease-in-out infinite;
}

.card[data-num="26"]::before{
  background:
    radial-gradient(4px 4px at 18% 24%, rgba(255,190,190,.85), transparent 60%),
    radial-gradient(3px 3px at 74% 14%, rgba(255,190,190,.7), transparent 60%),
    radial-gradient(3px 3px at 62% 46%, rgba(255,190,190,.6), transparent 60%),
    radial-gradient(4px 4px at 30% 62%, rgba(255,190,190,.8), transparent 60%),
    radial-gradient(3px 3px at 88% 60%, rgba(255,190,190,.7), transparent 60%),
    radial-gradient(4px 4px at 46% 82%, rgba(255,190,190,.6), transparent 60%),
    radial-gradient(300px 190px at 50% 92%, rgba(229,57,53,.45), transparent 66%);
  opacity: .75;
}

/* Reflejo de vidrio que cruza la card */
.card[data-num="26"]::after{
  content: "";
  position: absolute;
  top: -40%;
  width: 45%;
  height: 180%;
  left: -60%;
  background: linear-gradient(115deg, transparent 30%, rgba(255,255,255,.14) 45%, rgba(255,255,255,.28) 50%, rgba(255,255,255,.14) 55%, transparent 70%);
  transform: skewX(-20deg);
  animation: vidrio-shine 5.5s ease-in-out infinite;
  pointer-events: none;
}

@keyframes rosa-glow {
  0%, 100% {
    box-shadow: 0 8px 32px rgba(30, 1, 8, .4), 0 2px 8px rgba(255,120,120,.35), inset 0 0 24px rgba(255,90,90,.08);
  }
  50% {
    box-shadow: 0 8px 40px rgba(60, 1, 15, .55), 0 2px 14px rgba(255,120,120,.65), inset 0 0 34px rgba(255,90,90,.18);
  }
}

@keyframes vidrio-shine {
  0% { left: -60%; }
  45% { left: 135%; }
  100% { left: 135%; }
}

.card[data-num="26"] h2{
  color: #ffb4c9;
  text-shadow: 0 1px 8px rgba(255,120,120,.4);
}

.card[data-num="26"] .card-number{
  background: linear-gradient(135deg, #ff8a80, #e53935);
  color: #2a030b;
  border-color: #ffb4c9;
  box-shadow: 0 2px 8px rgba(255,120,120,.4);
  animation: numero-late 3s ease-in-out infinite;
}

@keyframes numero-late {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.12); }
}

.card[data-num="26"] .tag{
  background: linear-gradient(90deg, #fff0f0, #ffe3eb);
  border-color: #ff8a80;
  color: #7a1f1f;
}

.card[data-num="26"] .arrow{
  background: #fff0f0;
  border-color: #ff8a80;
  color: #c62828;
  box-shadow: 0 2px 8px rgba(255,120,120,.4);
}

.card[data-num="26"]:hover{
  border-color: #ffb4c9;
  background:
    radial-gradient(260px 150px at 20% 6%, rgba(255, 120, 120, .3), transparent 65%),
    linear-gradient(150deg, #5c0917, #33030e 52%, #180207);
  box-shadow: 0 12px 44px rgba(60, 1, 15, .6), 0 2px 12px rgba(255, 120, 120, .6), inset 0 0 34px rgba(255, 90, 90, .14);
}

.card[data-num="26"]:hover .card-number{
  background: linear-gradient(135deg, #ffb4c9, #e53935);
}

/* Variante del Disparo de Corazones: morado nocturno */
.card[data-num="27"]{
  background:
    radial-gradient(240px 140px at 18% 8%, rgba(255, 82, 168, .22), transparent 65%),
    radial-gradient(240px 150px at 85% 18%, rgba(90, 24, 60, .45), transparent 68%),
    linear-gradient(150deg, #3a0a24, #1c0410 52%, #0a0208);
  border-color: #ff5ab8;
  overflow: hidden;
  box-shadow: 0 8px 32px rgba(60, 4, 30, .5), 0 2px 8px rgba(255, 82, 168, .35), inset 0 0 26px rgba(255, 82, 168, .08);
  animation: corazon-card-borde 4s ease-in-out infinite;
}

@keyframes corazon-card-borde {
  0%, 100% { box-shadow: 0 8px 32px rgba(60, 4, 30, .5), 0 2px 8px rgba(255, 82, 168, .35), inset 0 0 26px rgba(255, 82, 168, .08); }
  50% { box-shadow: 0 10px 40px rgba(80, 6, 40, .65), 0 2px 14px rgba(255, 82, 168, .7), inset 0 0 40px rgba(255, 82, 168, .16); }
}

.card[data-num="27"]::before{
  background:
    radial-gradient(4px 4px at 22% 20%, rgba(255,120,200,.85), transparent 60%),
    radial-gradient(3px 3px at 68% 12%, rgba(255,120,200,.7), transparent 60%),
    radial-gradient(3px 3px at 80% 38%, rgba(255,120,200,.65), transparent 60%),
    radial-gradient(3px 3px at 30% 52%, rgba(255,120,200,.75), transparent 60%),
    radial-gradient(4px 4px at 60% 62%, rgba(255,120,200,.8), transparent 60%),
    radial-gradient(3px 3px at 42% 78%, rgba(255,150,201,.65), transparent 60%),
    radial-gradient(300px 190px at 50% 100%, rgba(150,40,90,.6), transparent 70%);
  opacity: .8;
}

/* Resplandor flotante en la card */
.card[data-num="27"]::after{
  content: "";
  position: absolute;
  width: 10px;
  height: 10px;
  right: 22px;
  bottom: 18px;
  border-radius: 999px;
  background: rgba(255, 170, 218, .8);
  box-shadow: 0 0 14px 4px rgba(255, 82, 168, .6), 0 0 30px 10px rgba(255, 82, 168, .3);
  animation: petalo-flotar 3.5s ease-in-out infinite;
  pointer-events: none;
}

@keyframes petalo-flotar {
  0%, 100% { transform: translateY(0) rotateZ(-15deg) scale(1); opacity: .5; }
  50% { transform: translateY(-18px) rotateZ(15deg) scale(1.15); opacity: .95; }
}

.card[data-num="27"] h2{
  color: #ff8ad0;
  text-shadow: 0 0 14px rgba(255,82,168,.75), 0 1px 2px rgba(10,2,8,.8);
  font-size: 1.3rem;
}

.card[data-num="27"] .card-number{
  background: linear-gradient(135deg, #ffb7dd, #ff5ab8 55%, #e91e63);
  color: #2c0018;
  border-color: #ffb7dd;
  box-shadow: 0 2px 10px rgba(255,82,168,.65), inset 0 1px 4px rgba(255,255,255,.4);
}

.card[data-num="27"] .tag{
  background: linear-gradient(90deg, rgba(58, 10, 36, .95), rgba(90, 20, 56, .95));
  border-color: #ff5ab8;
  color: #ffc9e8;
  box-shadow: 0 2px 10px rgba(90, 10, 50, .5);
}

.card[data-num="27"] .arrow{
  background: linear-gradient(135deg, #3a0a24, #1c0410);
  border-color: #ff5ab8;
  color: #ff9bd6;
  box-shadow: 0 2px 10px rgba(255,82,168,.5), inset 0 0 10px rgba(255,82,168,.18);
  font-size: 1.3rem;
}

.card[data-num="27"]:hover{
  border-color: #ffb7dd;
  background:
    radial-gradient(260px 150px at 18% 8%, rgba(255, 82, 168, .32), transparent 65%),
    radial-gradient(260px 160px at 85% 18%, rgba(120, 30, 78, .45), transparent 68%),

  animation: none;
  box-shadow: 0 14px 44px rgba(80, 6, 40, .75), 0 2px 14px rgba(255, 82, 168, .75), inset 0 0 46px rgba(255, 82, 168, .18);
}

.card[data-num="27"]:hover .card-number{
  background: linear-gradient(135deg, #ffd0ea, #ff75c8 55%, #f2308a);
}

.card[data-num="27"]:hover .arrow{
  background: linear-gradient(135deg, #4c0e2e, #3a0a24);

}

footer{

.badge-desbloqueo{

}

/* ==========================================
   BOTONES DE ICONOS PALPITANTES
   ========================================== */
.torta-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 42px;
  height: 42px;
  font-size: 1.4rem;
  text-decoration: none;
  background: linear-gradient(135deg, #ffe082 0%, #f48fb1 100%);
  border: 2px solid #fff;
  border-radius: 50%;
  box-shadow: 0 4px 15px rgba(244, 143, 177, 0.45);
  user-select: none;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
  animation: palpitar 1.8s infinite ease-in-out;
}

@keyframes palpitar {
  0%, 100% {
    transform: scale(1);
    box-shadow: 0 4px 15px rgba(244, 143, 177, 0.45);
  }
  14% {
    transform: scale(1.18);
    box-shadow: 0 6px 22px rgba(255, 215, 0, 0.75);
  }
  28% {
    transform: scale(1);
    box-shadow: 0 4px 15px rgba(244, 143, 177, 0.45);
  }
  42% {
    transform: scale(1.12);
    box-shadow: 0 6px 20px rgba(255, 215, 0, 0.65);
  }
  70% {
    transform: scale(1);
    box-shadow: 0 4px 15px rgba(244, 143, 177, 0.45);
  }
}

.torta-btn:hover {
  border-color: #ffe082;
  filter: brightness(1.1);
}

.torta-btn:active {
  transform: scale(0.92) !important;
}

/* ==========================================
   MEDIA QUERIES / RESPONSIVE
   ========================================== */
@media (min-width: 740px){
  .card{ grid-column: span 6; padding: 22px; }
}

@media (min-width: 1020px){
  .card{ grid-column: span 4; }
}

/* Optimización móvil con Efecto Stacking */
@media (max-width: 600px) {
  body {
    background: linear-gradient(180deg, var(--bg1), var(--bg2));
  }

  /* Ajustes del Header en Celular */
  header {
    gap: 12px;
  }

  .header-top {
    align-items: flex-start;
  }

  .title {
    font-size: clamp(1.8rem, 6vw, 2.4rem);
    line-height: 1.15;
  }

  .pill {
    padding: 6px 14px;
    font-size: 0.9rem;
  }

  .header-actions {
    justify-content: center;
    gap: 12px;
  }

  .torta-btn {
    width: 38px;
    height: 38px;
    font-size: 1.25rem;
  }

  /* Contenedor Grid en móvil */
  .grid {
    display: flex;
    flex-direction: column;
    gap: 24px;
    padding-bottom: 60vh;
  }

  .card {
    box-shadow: 0 -4px 16px rgba(124, 58, 106, 0.08);
    backdrop-filter: none;
    position: sticky;
    top: 20px;
  }

  .card::before { 
    opacity: .25; 
  }
  
  .card:hover { 
    transform: none; 
  }
  
  .pill, .arrow { 
    box-shadow: none; 
  }
  
  .card.bloqueada {
    filter: none !important;
    opacity: 0.6 !important;
  }
}

/* Reduce motion */
@media (prefers-reduced-motion: reduce){
  *{
    animation: none !important;
    transition: none !important;
  }
}

    <script>
      // Objeto con el estado de desbloqueo de cada tarjeta (por id)
      // Cambia a true la que quieras desbloquear
      // Bloquear ambas cards al cargar
var tarjetasDesbloqueo = {
  'card-1': false,
  'card-2': false,
  'card-3': false,
  'card-4': false
};

      // Función para desbloquear una tarjeta por id
      function desbloquearTarjeta(id) {
        var card = document.getElementById(id);
        if (!card) return;
        card.style.opacity = '';
        card.style.pointerEvents = '';
        card.style.filter = '';
        card.querySelector('.bloqueo-msg').style.display = 'none';
        card.querySelector('.arrow').textContent = '→';
        card.querySelector('h2 span').textContent = '';
        // Si quieres cambiar el href dinámicamente, puedes hacerlo aquí
        // card.href = 'ruta/deseada.html';
      }

      // Función para poner un contador en una tarjeta bloqueada
      function ponerContadorEnCard(id, fechaDesbloqueo) {
  var card = document.getElementById(id);
  if (!card) return;
  var msg = card.querySelector('.bloqueo-msg');
  if (!msg) return;
  // Si la tarjeta ya está desbloqueada, volver a bloquearla
  card.style.opacity = '0.5';
  card.style.pointerEvents = 'none';
  card.style.filter = 'grayscale(0.7)';
  msg.style.display = 'flex';
  card.querySelector('.arrow').textContent = '🔒';
  card.querySelector('h2 span').textContent = '';
  if (typeof tarjetasDesbloqueo === 'object') {
    tarjetasDesbloqueo[id] = false;
  }
  // Crear o reutilizar el div del contador
  let contadorDiv = msg.querySelector('.contador-desbloqueo');
  if (!contadorDiv) {
    contadorDiv = document.createElement('div');
    contadorDiv.className = 'contador-desbloqueo';
    // Mejor ubicación y color llamativo
    contadorDiv.style.cssText = `
      position: absolute;
      bottom: 18px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 1.13em;
      font-weight: 700;
      color: #fff;
      background: linear-gradient(90deg, #f48fb1 60%, #ffe082 100%);
      padding: 10px 22px;
      border-radius: 999px;
      box-shadow: 0 4px 18px #f8bbd055, 0 2px 8px #fffde7cc;
      border: 2px solid #f8bbd0;
      z-index: 2;
      letter-spacing: 0.01em;
      text-shadow: 0 2px 8px #b48bbd88;
      display: flex;
      align-items: center;
      justify-content: center;
      min-width: 180px;
    `;
    msg.appendChild(contadorDiv);
  }
  function actualizarContador() {
    var ahora = new Date();
    var falta = fechaDesbloqueo - ahora;
    if (falta <= 0) {
      contadorDiv.remove(); // Eliminar el contador visual
      card.style.opacity = '';
      card.style.pointerEvents = '';
      card.style.filter = '';
      msg.style.display = 'none';
      card.querySelector('.arrow').textContent = '→';
      card.querySelector('h2 span').textContent = '';
      if (typeof tarjetasDesbloqueo === 'object') {
        tarjetasDesbloqueo[id] = true;
      }
      var fechaKey = 'desbloqueoFecha:' + id;
      var fechaActual = fechaDesbloqueo.getTime();
      var fechaGuardada = parseInt(localStorage.getItem(fechaKey) || '0', 10);
      if (fechaGuardada !== fechaActual) {
        localStorage.setItem(fechaKey, String(fechaActual));
        localStorage.removeItem('avisoDesbloqueo:' + id);
        localStorage.removeItem('avisoDesbloqueo:ultimo');
        marcarDesbloqueoConAviso(id);
      }
      return;
    }
    var dias = Math.floor(falta / (1000*60*60*24));
    var horas = Math.floor((falta / (1000*60*60)) % 24);
    var mins = Math.floor((falta / (1000*60)) % 60);
    var segs = Math.floor((falta / 1000) % 60);
    let partes = [];
    if (dias > 0) partes.push(dias + 'd');
    if (horas > 0 || dias > 0) partes.push(horas + 'h');
    if (mins > 0 || horas > 0 || dias > 0) partes.push(mins + 'm');
    partes.push(segs + 's');
    contadorDiv.textContent = 'Disponible en: ' + partes.join(' ');
    setTimeout(actualizarContador, 1000);
  }
  actualizarContador();
}

      function obtenerNombreCard(id) {
        var card = document.getElementById(id);
        if (!card) return 'Una sorpresa';
        var h2 = card.querySelector('h2');
        return h2 ? h2.textContent.replace(/\s+/g, ' ').trim() : 'Una sorpresa';
      }

      function ponerBadgeEnCard(id, texto) {
        var card = document.getElementById(id);
        if (!card) return;
        var existente = card.querySelector('.badge-desbloqueo');
        if (existente) {
          existente.textContent = texto;
          return;
        }
        var badge = document.createElement('div');
        badge.className = 'badge-desbloqueo';
        badge.textContent = texto;
        card.appendChild(badge);
      }

      function quitarBadgeDeCard(id) {
        var card = document.getElementById(id);
        if (!card) return;
        var existente = card.querySelector('.badge-desbloqueo');
        if (existente) existente.remove();
      }

      function limpiarAvisosExcepto(idActual) {
        Object.keys(tarjetasDesbloqueo).forEach(function(id) {
          if (id === idActual) return;
          localStorage.removeItem('avisoDesbloqueo:' + id);
          quitarBadgeDeCard(id);
        });
      }

      function marcarDesbloqueoConAviso(id) {
        limpiarAvisosExcepto(id);
        var key = 'avisoDesbloqueo:' + id;
        var raw = localStorage.getItem(key);
        var data = raw ? JSON.parse(raw) : null;
        if (!data || data.mostrado !== true) {
          var nombre = obtenerNombreCard(id);
          ponerBadgeEnCard(id, '¡Nuevo! 💖');
          localStorage.setItem(key, JSON.stringify({
            mostrado: true,
            restantes: 2,
            nombre: nombre
          }));
          localStorage.setItem('avisoDesbloqueo:ultimo', id);
        }
      }

      function manejarAvisoPendiente() {
        var ultimoId = localStorage.getItem('avisoDesbloqueo:ultimo');
        if (!ultimoId) {
          Object.keys(tarjetasDesbloqueo).forEach(function(id) {
            quitarBadgeDeCard(id);
          });
          return;
        }

        limpiarAvisosExcepto(ultimoId);

        var key = 'avisoDesbloqueo:' + ultimoId;
        var raw = localStorage.getItem(key);
        if (!raw) {
          quitarBadgeDeCard(ultimoId);
          return;
        }
        var data = JSON.parse(raw);
        if (!data || data.restantes <= 0) {
          localStorage.removeItem(key);
          quitarBadgeDeCard(ultimoId);
          return;
        }

        ponerBadgeEnCard(ultimoId, 'Nuevo 💖');
        data.restantes = data.restantes - 1;
        if (data.restantes <= 0) {
          localStorage.removeItem(key);
          localStorage.removeItem('avisoDesbloqueo:ultimo');
          quitarBadgeDeCard(ultimoId);
        } else {
          localStorage.setItem(key, JSON.stringify(data));
        }
      }

      // Llama a esta función para poner un contador en la card que quieras:
      // ponerContadorEnCard('id-de-la-card', fechaObjetivoDate)
      // Ejemplo para poner 2 horas desde ahora en la card con id "card-3":
      // --- CONTADORES DE DESBLOQUEO ---
      // Para activar un contador en una card, descomenta la línea correspondiente y pon la fecha exacta:
      // ponerContadorEnCard('card-1', new Date(Date.now() + 2*60*1000)); // ← Ejemplo: 2 minutos desde ahora para card-1
      ponerContadorEnCard('card-1', new Date('2026-01-24T04:00:00'));
      ponerContadorEnCard('card-2', new Date('2026-01-25T02:35:00'));
      ponerContadorEnCard('card-3', new Date('2026-02-03T02:30:00'));
      // ↑ card-2: id de otra tarjeta
      // ↑ '2025-01-14T04:00:00': desbloqueo el 14 de enero de 2025 a las 4:00 AM
      // --- FIN CONTADORES ---

      // Recorre el objeto y desbloquea las que correspondan
      Object.keys(tarjetasDesbloqueo).forEach(function(id) {
        if (tarjetasDesbloqueo[id]) {
          desbloquearTarjeta(id);
        } else {
          // Ejemplo: desbloquear el card-1 el 22 de enero de 2027 a las 15:00
          // ponerContadorEnCard('card-1', new Date('2026-01-22T014:00:00'));
        }
      });

      manejarAvisoPendiente();

      // --- NUMERACIÓN DE CARDS (editable con data-num) ---
      document.querySelectorAll('.card').forEach(function(card) {
        var numero = card.getAttribute('data-num');
        var badge = card.querySelector('.card-number');
        if (badge) {
          badge.textContent = numero ? numero : '';
        }
      });
    </script>
