<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Para Iriss 💜</title>
  
  <!-- Tipografía: Great Vibes para el título + Quicksand & Nunito -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Nunito:wght@600;700;800&family=Quicksand:wght@600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-1: #0b1021;
      --bg-2: #171c3a;
      --bg-3: #2a1945;
      --card-bg: rgba(20, 25, 52, 0.84);
      --gold: #ffd166;
      --gold-bright: #fff0b3;
      --coral: #ff6b8b;
      --cyan: #4cc9f0;
      --violet: #9d4edd;
      --text: #f8f9ff;
      --muted: #b8c1ec;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: 'Quicksand', 'Nunito', sans-serif;
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      overflow-x: hidden;
      overflow-y: auto;
      padding: 46px 0;
      background:
        radial-gradient(620px 480px at 15% 15%, rgba(76, 201, 240, 0.2), transparent 65%),
        radial-gradient(650px 520px at 85% 20%, rgba(255, 107, 139, 0.2), transparent 65%),
        radial-gradient(700px 550px at 50% 90%, rgba(255, 209, 102, 0.14), transparent 65%),
        linear-gradient(150deg, var(--bg-1) 0%, var(--bg-2) 55%, var(--bg-3) 100%);
      position: relative;
    }

    /* Fondo con brillitos flotantes */
    .bg-sparkles {
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        radial-gradient(circle, rgba(255, 255, 255, 0.85) 1.4px, transparent 2px),
        radial-gradient(circle, rgba(255, 209, 102, 0.75) 1.2px, transparent 1.8px),
        radial-gradient(circle, rgba(76, 201, 240, 0.7) 1.2px, transparent 1.8px);
      background-size: 80px 80px, 120px 120px, 100px 100px;
      animation: floatBg 42s linear infinite, twinkleBg 4s ease-in-out infinite alternate;
    }

    @keyframes floatBg {
      0% { background-position: 0 0, 30px 45px, 15px 20px; }
      100% { background-position: 0 500px, 30px 545px, 15px 520px; }
    }

    @keyframes twinkleBg {
      from { opacity: 0.4; }
      to { opacity: 0.9; }
    }

    /* Contenedor principal */
    .card-container {
      position: relative;
      z-index: 2;
      background: var(--card-bg);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      border: 1.5px solid rgba(255, 209, 102, 0.45);
      border-radius: 34px;
      padding: clamp(46px, 6vw, 54px) clamp(38px, 6vw, 48px) clamp(34px, 5vw, 42px);
      max-width: 500px;
      width: 92%;
      box-shadow:
        0 0 0 6px rgba(76, 201, 240, 0.08),
        0 26px 65px rgba(4, 7, 18, 0.65),
        inset 0 1px 1px rgba(255, 255, 255, 0.18);
    }

    /* ==========================================
       LUCES ARRIBA Y A LOS COSTADOS
       ========================================== */
    .lights-top {
      position: absolute;
      top: 4px;
      left: 36px;
      right: 36px;
      height: 24px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      pointer-events: none;
      z-index: 5;
    }

    .lights-side {
      position: absolute;
      top: 48px;
      bottom: 48px;
      width: 22px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      pointer-events: none;
      z-index: 5;
    }

    .lights-left { left: 4px; }
    .lights-right { right: 4px; }

    .bulb {
      position: relative;
      width: 10px;
      height: 14px;
      border-radius: 50% 50% 50% 50% / 35% 35% 65% 65%;
      animation: bulbBlink 1.7s infinite alternate ease-in-out;
    }

    .bulb::before {
      content: "";
      position: absolute;
      top: -3px;
      left: 2.5px;
      width: 5px;
      height: 4px;
      background: #1b223c;
      border-radius: 2px 2px 0 0;
    }

    .lights-side .bulb {
      transform: rotate(90deg);
      animation-name: bulbBlinkSide;
    }

    .bulb.coral  { background: #ff6b8b; box-shadow: 0 2px 10px #ff6b8b, 0 0 18px rgba(255, 107, 139, 0.7); animation-delay: 0s; }
    .bulb.gold   { background: #ffd166; box-shadow: 0 2px 10px #ffd166, 0 0 18px rgba(255, 209, 102, 0.7); animation-delay: 0.35s; }
    .bulb.cyan   { background: #4cc9f0; box-shadow: 0 2px 10px #4cc9f0, 0 0 18px rgba(76, 201, 240, 0.7); animation-delay: 0.7s; }
    .bulb.violet { background: #c77dff; box-shadow: 0 2px 10px #c77dff, 0 0 18px rgba(199, 125, 255, 0.7); animation-delay: 1.05s; }
    .bulb.mint   { background: #52ffb8; box-shadow: 0 2px 10px #52ffb8, 0 0 18px rgba(82, 255, 184, 0.7); animation-delay: 1.4s; }

    @keyframes bulbBlink {
      0%   { opacity: 0.45; transform: scale(0.92); filter: brightness(0.85); }
      100% { opacity: 1;    transform: scale(1.08); filter: brightness(1.25); }
    }

    @keyframes bulbBlinkSide {
      0%   { opacity: 0.45; transform: rotate(90deg) scale(0.92); filter: brightness(0.85); }
      100% { opacity: 1;    transform: rotate(90deg) scale(1.08); filter: brightness(1.25); }
    }

    /* ==========================================
       FOTOS REDONDEADAS CON DECORACIÓN DORADA
       ========================================== */
    .avatar-wrapper {
      position: absolute;
      width: clamp(68px, 16vw, 88px);
      height: clamp(68px, 16vw, 88px);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 10;
      transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .avatar-wrapper:hover {
      transform: scale(1.1) rotate(3deg);
    }

    .avatar-top-left     { top: -32px; left: -22px; }
    .avatar-top-right    { top: -32px; right: -22px; }
    .avatar-bottom-left  { bottom: -32px; left: -22px; }
    .avatar-bottom-right { bottom: -32px; right: -22px; }

    .gold-frame-svg {
      position: absolute;
      inset: -4px;
      width: calc(100% + 8px);
      height: calc(100% + 8px);
      pointer-events: none;
      z-index: 3;
      filter: drop-shadow(0 2px 8px rgba(255, 209, 102, 0.45));
    }

    .gold-crown-gem {
      position: absolute;
      top: -6px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 4;
      font-size: clamp(0.85rem, 2.5vw, 1.05rem);
      line-height: 1;
      color: var(--gold-bright);
      text-shadow: 0 0 10px rgba(255, 209, 102, 0.9);
      pointer-events: none;
    }

    .avatar-circle {
      position: relative;
      width: 76%;
      height: 76%;
      border-radius: 50%;
      border: 2.5px solid var(--gold);
      box-shadow: 0 6px 18px rgba(0, 0, 0, 0.5);
      overflow: hidden;
      background: linear-gradient(135deg, #24315e, #48286b);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 2;
    }

    .avatar-circle img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    /* ==========================================
       TÍTULO CON CALIGRAFÍA EN "Para" E "Iriss"
       ========================================== */
    .title-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin: 0 0 12px 0;
    }

    h1 {
      margin: 0;
      display: inline-flex;
      align-items: baseline;
      gap: 10px;
      line-height: 1.15;
      font-family: 'Great Vibes', cursive;
      font-weight: 400;
    }

    .title-para {
      font-size: clamp(2.1rem, 6.5vw, 2.75rem);
      letter-spacing: 0.8px;
      padding-right: 2px;
      background: linear-gradient(90deg, #ffd166 0%, #fff3c4 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 2px 10px rgba(255, 209, 102, 0.35));
    }

    .title-iriss {
      font-size: clamp(2.65rem, 8.2vw, 3.45rem);
      letter-spacing: 1px;
      padding: 0 4px;
      background: linear-gradient(90deg, #ffffff 0%, #ffd166 50%, #ff9ebb 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 3px 14px rgba(255, 209, 102, 0.35));
    }

    .title-heart {
      font-size: clamp(1.45rem, 4.5vw, 1.85rem);
      filter: drop-shadow(0 0 10px rgba(199, 125, 255, 0.7));
      animation: heartBeat 2s ease-in-out infinite;
    }

    @keyframes heartBeat {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.13); }
    }

    /* ==========================================
       INFINITO COMPACTO + 100% DORADO
       ========================================== */
    .infinity-row {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      margin: 0 auto 18px;
      background: rgba(255, 255, 255, 0.05);
      padding: 7px 14px;
      border-radius: 999px;
      border: 1px solid rgba(255, 209, 102, 0.35);
      box-shadow: inset 0 0 14px rgba(255, 209, 102, 0.06);
    }

    .infinity-box {
      position: relative;
      width: clamp(78px, 21vw, 94px);
      height: 34px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .infinity-svg {
      width: 100%;
      height: 100%;
      overflow: visible;
      filter: drop-shadow(0 0 8px rgba(255, 209, 102, 0.45));
    }

    .infinity-track {
      fill: none;
      stroke: rgba(255, 255, 255, 0.14);
      stroke-width: 7;
      stroke-linecap: round;
    }

    .infinity-progress {
      fill: none;
      stroke: url(#infinityGoldGrad);
      stroke-width: 7;
      stroke-linecap: round;
      stroke-dasharray: 260;
      stroke-dashoffset: 260;
      transition: stroke-dashoffset 0.8s ease;
    }

    .infinity-glow-dot {
      fill: #fff8d6;
      filter: drop-shadow(0 0 5px #ffd166) drop-shadow(0 0 9px #ffffff);
    }

    .progress-percent-wrap {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .progress-percent {
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: 0.3px;
      background: linear-gradient(180deg, #fff8d6 0%, #ffd166 55%, #e5a524 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 8px rgba(255, 209, 102, 0.65));
      white-space: nowrap;
      animation: percentGlow 2.2s ease-in-out infinite alternate;
    }

    .percent-sparkle {
      position: absolute;
      top: -6px;
      right: -5px;
      font-size: 0.72rem;
      line-height: 1;
      color: #fff8d6;
      text-shadow: 0 0 8px #ffd166, 0 0 14px #fff3c4;
      pointer-events: none;
      animation: sparkleTwinkle 1.5s ease-in-out infinite alternate;
    }

    @keyframes percentGlow {
      0%   { filter: drop-shadow(0 0 5px rgba(255, 209, 102, 0.45)); }
      100% { filter: drop-shadow(0 0 12px rgba(255, 226, 112, 0.95)); }
    }

    @keyframes sparkleTwinkle {
      0%   { opacity: 0.35; transform: scale(0.75) rotate(-12deg); }
      100% { opacity: 1;    transform: scale(1.18) rotate(15deg); }
    }

    /* CONTADOR HORIZONTAL */
    .countdown {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      width: 100%;
    }

    .box {
      background: linear-gradient(180deg, rgba(255, 255, 255, 0.1), rgba(255, 255, 255, 0.03));
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-bottom: 3px solid var(--cyan);
      border-radius: 18px;
      padding: 11px 2px;
    }

    .num {
      font-size: clamp(1.1rem, 4vw, 1.55rem);
      font-weight: 800;
      color: var(--gold);
      line-height: 1;
    }

    .label {
      font-size: clamp(0.58rem, 2vw, 0.68rem);
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-top: 5px;
      font-weight: 700;
    }

    /* ==========================================
       MENSAJE MEJORADO: LLEGÓ EL DÍA
       ========================================== */
    .llegada {
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 4px;
      margin-bottom: 18px;
      padding: 16px 18px;
      border-radius: 22px;
      background: linear-gradient(135deg, rgba(255, 107, 139, 0.2), rgba(255, 209, 102, 0.16), rgba(76, 201, 240, 0.16));
      border: 1.5px solid rgba(255, 209, 102, 0.65);
      box-shadow: 0 10px 28px rgba(0, 0, 0, 0.35), inset 0 0 20px rgba(255, 209, 102, 0.12);
    }

    .llegada.show {
      display: flex;
      animation: llegadaEntrada 0.55s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .llegada .big {
      font-size: clamp(1.35rem, 5vw, 1.75rem);
      font-weight: 800;
      letter-spacing: 0.4px;
      background: linear-gradient(90deg, #ffd166, #ff6b8b, #ffd166);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .llegada .sub {
      font-size: 0.88rem;
      font-weight: 700;
      color: var(--text);
      opacity: 0.92;
    }

    @keyframes llegadaEntrada {
      0% { transform: translateY(10px) scale(0.94); opacity: 0; }
      100% { transform: translateY(0) scale(1); opacity: 1; }
    }

    /* ==========================================
       BOTÓN DE REGALO CON ESTILO Y COLOR
       ========================================== */
    .entrar-wrap {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
    }

    .entrar-ya {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      padding: 14px 30px;
      border-radius: 999px;
      background: linear-gradient(135deg, #ff5d8f 0%, #ff8fa3 45%, #ffd166 100%);
      color: #141026;
      font-weight: 800;
      font-size: clamp(0.92rem, 3.2vw, 1.05rem);
      letter-spacing: 0.3px;
      text-decoration: none;
      border: 2px solid rgba(255, 255, 255, 0.75);
      box-shadow:
        0 10px 26px rgba(255, 93, 143, 0.42),
        0 0 0 4px rgba(255, 209, 102, 0.16);
      transition: transform 0.25s ease, box-shadow 0.25s ease, filter 0.25s ease;
    }

    .entrar-ya:hover {
      transform: translateY(-3px) scale(1.03);
      filter: brightness(1.06);
      box-shadow:
        0 14px 32px rgba(255, 209, 102, 0.5),
        0 0 0 6px rgba(255, 93, 143, 0.22);
    }

    .entrar-ya:active {
      transform: translateY(0) scale(0.98);
    }

    /* ==========================================
       CONTENEDOR PARA TU IMAGEN torta.png (SIN FONDO)
       ========================================== */
    .torta-img-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      background: transparent;
      border: none;
      padding: 2px 0 0;
    }

    .torta-img {
      width: clamp(115px, 34vw, 150px);
      height: auto;
      display: block;
      object-fit: contain;
      background: transparent;
      filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.45));
      transition: transform 0.3s ease;
    }

    .torta-img:hover {
      transform: scale(1.05);
    }

    .volver-inicio {
      position: fixed;
      top: 14px;
      left: 14px;
      z-index: 9999;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(20, 25, 52, 0.88);
      border: 1.5px solid rgba(255, 209, 102, 0.45);
      color: var(--text);
      text-decoration: none;
      font-weight: 800;
      box-shadow: 0 8px 22px rgba(0, 0, 0, 0.45);
      transition: transform 0.2s ease, background 0.2s ease;
    }
    .volver-inicio:hover { transform: translateY(-2px); background: rgba(42, 25, 69, 0.96); }
  </style>
</head>
<body>
  <!-- Decoración dorada circular alrededor de cada foto -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">

  <a class="volver-inicio" href="../index.html" aria-label="Volver al inicio">←</a>

  <!-- Fondo con partículas -->
  <div class="bg-sparkles"></div>

  <!-- Tarjeta central -->
  <div class="card-container">

    <!-- LUCES ARRIBA -->
    <div class="lights-top" aria-hidden="true">
      <span class="bulb coral"></span>
      <span class="bulb gold"></span>
      <span class="bulb cyan"></span>
      <span class="bulb violet"></span>
      <span class="bulb mint"></span>
      <span class="bulb coral"></span>
      <span class="bulb gold"></span>
      <span class="bulb cyan"></span>
      <span class="bulb violet"></span>
      <span class="bulb mint"></span>
    </div>

    <!-- LUCES COSTADO IZQUIERDO -->
    <div class="lights-side lights-left" aria-hidden="true">
      <span class="bulb gold"></span>
      <span class="bulb cyan"></span>
      <span class="bulb coral"></span>
      <span class="bulb violet"></span>
      <span class="bulb mint"></span>
    </div>

    <!-- LUCES COSTADO DERECHO -->
    <div class="lights-side lights-right" aria-hidden="true">
      <span class="bulb mint"></span>
      <span class="bulb violet"></span>
      <span class="bulb coral"></span>
      <span class="bulb cyan"></span>
      <span class="bulb gold"></span>
    </div>

    <!-- FOTO 1 (ARRIBA IZQUIERDA) -->
    <div class="avatar-wrapper avatar-top-left">
      <span class="gold-crown-gem" aria-hidden="true">✦</span>
      <svg class="gold-frame-svg" viewBox="0 0 100 100" aria-hidden="true">
        <use href="#gold-frame-decor"></use>
      </svg>
      <div class="avatar-circle">
        <img src="foto1.jpeg" alt="Foto 1" onerror="this.onerror=null; this.parentNode.innerHTML='🌸';">
      </div>
    </div>

    <!-- FOTO 2 (ARRIBA DERECHA) -->
    <div class="avatar-wrapper avatar-top-right">
      <span class="gold-crown-gem" aria-hidden="true">✦</span>
      <svg class="gold-frame-svg" viewBox="0 0 100 100" aria-hidden="true">
        <use href="#gold-frame-decor"></use>
      </svg>
      <div class="avatar-circle">
        <img src="foto2.png" alt="Foto 2" onerror="this.onerror=null; this.parentNode.innerHTML='✨';">
      </div>
    </div>

    <!-- TÍTULO CON CALIGRAFÍA EN "Para" E "Iriss" -->
    <div class="title-wrap">
      <h1>
        <span class="title-para">Para</span>
        <span class="title-iriss">Iriss</span>
      </h1>
      <span class="title-heart" aria-hidden="true">💜</span>
    </div>

    <!-- INFINITO COMPACTO + 100% DORADO -->
    <div class="infinity-row">
      <div class="infinity-box">
        <svg class="infinity-svg" viewBox="0 0 140 60" aria-hidden="true">
          <path class="infinity-track"
                d="M 70,30 C 52,6 16,6 16,30 C 16,54 52,54 70,30 C 88,6 124,6 124,30 C 124,54 88,54 70,30 Z" />
          <path class="infinity-progress" id="infinity-fill"
                d="M 70,30 C 52,6 16,6 16,30 C 16,54 52,54 70,30 C 88,6 124,6 124,30 C 124,54 88,54 70,30 Z" />
          <circle class="infinity-glow-dot" r="3.4">
            <animateMotion dur="4.2s" repeatCount="indefinite"
              path="M 70,30 C 52,6 16,6 16,30 C 16,54 52,54 70,30 C 88,6 124,6 124,30 C 124,54 88,54 70,30 Z" />
          </circle>
        </svg>
      </div>

      <span class="progress-percent-wrap">
        <span class="progress-percent" id="progress-text">0%</span>
        <span class="percent-sparkle" aria-hidden="true">✦</span>
      </span>
    </div>

    <!-- CONTADOR -->
    <div class="countdown" id="countdown">
      <div class="box">
        <div class="num" id="d">--</div>
        <div class="label">Días</div>
      </div>
      <div class="box">
        <div class="num" id="h">--</div>
        <div class="label">Horas</div>
      </div>
      <div class="box">
        <div class="num" id="m">--</div>
        <div class="label">Min</div>
      </div>
      <div class="box">
        <div class="num" id="s">--</div>
        <div class="label">Seg</div>
      </div>
    </div>

    <!-- MENSAJE LLEGÓ EL DÍA -->
    <div class="llegada" id="llegada">
      <span class="big">¡Llegó el día! 🎂✨</span>
      <span class="sub">Hoy es tu momento, disfrutalo a pleno 💜</span>
    </div>

    <!-- BOTÓN E IMAGEN torta.png SIN FONDO ABAJO -->
    <div class="entrar-wrap">
      <a class="entrar-ya" href="../CUMPLE_DE_IRISS/index.html">Abrir mi regalo ahora 🎁</a>

      <div class="torta-img-wrap">
        <img class="torta-img" src="torta.png" alt="Torta de cumpleaños 21" onerror="this.style.display='none';">
      </div>
    </div>

    <!-- FOTO 3 (ABAJO IZQUIERDA) -->
    <div class="avatar-wrapper avatar-bottom-left">
      <span class="gold-crown-gem" aria-hidden="true">✦</span>
      <svg class="gold-frame-svg" viewBox="0 0 100 100" aria-hidden="true">
        <use href="#gold-frame-decor"></use>
      </svg>
      <div class="avatar-circle">
        <img src="hope.png" alt="Foto 3" onerror="this.onerror=null; this.parentNode.innerHTML='💖';">
      </div>
    </div>

    <!-- FOTO 4 (ABAJO DERECHA) -->
    <div class="avatar-wrapper avatar-bottom-right">
      <span class="gold-crown-gem" aria-hidden="true">✦</span>
      <svg class="gold-frame-svg" viewBox="0 0 100 100" aria-hidden="true">
        <use href="#gold-frame-decor"></use>
      </svg>
      <div class="avatar-circle">
        <img src="image.png" alt="Foto 4" onerror="this.onerror=null; this.parentNode.innerHTML='🌷';">
      </div>
    </div>

  </div>

  <script>
    function getDates() {
      const now = new Date();
      const target = new Date(2026, 10, 23, 0, 0, 0, 0);
      const start = new Date(2026, 0, 1, 0, 0, 0, 0);
      return { now, start, target };
    }

    const elD = document.getElementById("d");
    const elH = document.getElementById("h");
    const elM = document.getElementById("m");
    const elS = document.getElementById("s");
    const infinityFill = document.getElementById("infinity-fill");
    const progressText = document.getElementById("progress-text");
    const countdownEl = document.getElementById("countdown");
    const llegadaEl = document.getElementById("llegada");

    const infinityLength = infinityFill.getTotalLength();
    infinityFill.style.strokeDasharray = infinityLength;
    infinityFill.style.strokeDashoffset = infinityLength;

    function setInfinityProgress(pct) {
      const offset = infinityLength - (infinityLength * pct) / 100;
      infinityFill.style.strokeDashoffset = offset;
    }

    let llegado = false;

    function tick() {
      const { now, start, target } = getDates();
      let diff = target - now;

      if (diff <= 0) {
        setInfinityProgress(100);
        progressText.textContent = "100%";

        if (!llegado) {
          llegado = true;
          countdownEl.style.display = "none";
          llegadaEl.classList.add("show");
        }
        return;
      }

      const d = Math.floor(diff / (1000 * 60 * 60 * 24));
      diff -= d * 24 * 60 * 60 * 1000;
      const h = Math.floor(diff / (1000 * 60 * 60));
      diff -= h * 60 * 60 * 1000;
      const m = Math.floor(diff / (1000 * 60));
      diff -= m * 60 * 1000;
      const s = Math.floor(diff / 1000);

      elD.textContent = d;
      elH.textContent = h.toString().padStart(2, "0");
      elM.textContent = m.toString().padStart(2, "0");
      elS.textContent = s.toString().padStart(2, "0");

      const totalTime = target - start;
      const elapsedTime = now - start;

      let percentage = Math.min(
        Math.max((elapsedTime / totalTime) * 100, 5),
        99.9
      );

      setInfinityProgress(percentage);
      progressText.textContent = percentage.toFixed(1) + "%";
    }

    setInterval(tick, 1000);
    tick();
  </script>
</body>
</html>
