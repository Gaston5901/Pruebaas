<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#050817" />
  <title>Nuestra banda sonora</title>
  <meta name="description" content="Elegí una canción y dejá que la noche se pinte de ella." />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <canvas id="fx" aria-hidden="true"></canvas>

  <div class="app" id="app">
    <section class="library" id="library">
      <header class="lib-head">
        <p class="eyebrow">Para Laura</p>
        <h1>Nuestra banda sonora</h1>
        <p class="sub">Elegí una canción y dejá que la noche se pinte de ella.</p>
      </header>

      <div class="songs" id="songs"></div>

      <p class="hint">Tocá una tarjeta para empezar</p>
    </section>

    <section class="player" id="player" hidden>
      <div class="player-top">
        <button class="icon-btn" id="back" type="button" aria-label="Volver">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <p class="now">Ahora suena</p>
        <button class="icon-btn" id="mute" type="button" aria-label="Silenciar">
          <svg class="i-vol" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16.5 8.5a5 5 0 010 7M19 6a8.5 8.5 0 010 12" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
          <svg class="i-mut" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path d="M16 9l6 6M22 9l-6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
      </div>

      <div class="stage">
        <div class="disc" id="disc">
          <div class="disc-core">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
          </div>
        </div>
        <canvas id="viz" class="viz" aria-hidden="true"></canvas>
      </div>

      <div class="meta">
        <h2 id="songTitle">—</h2>
        <p id="songArtist">—</p>
      </div>

      <div class="lyrics-wrap" id="lyricsWrap">
        <div class="lyrics" id="lyrics"></div>
      </div>

      <div class="controls">
        <input type="range" id="progress" min="0" max="1000" value="0" step="1" aria-label="Progreso de la canción" />
        <div class="times">
          <span id="cur">0:00</span>
          <span id="dur">0:00</span>
        </div>
        <div class="btns">
          <button class="skip" id="prev" type="button" aria-label="Canción anterior">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5v14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M18 6l-9 6 9 6z"/></svg>
          </button>
          <button class="play" id="play" type="button" aria-label="Reproducir">
            <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.14v13.72L19 12z"/></svg>
            <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><rect x="6" y="5" width="4" height="14" rx="1.4"/><rect x="14" y="5" width="4" height="14" rx="1.4"/></svg>
          </button>
          <button class="skip" id="next" type="button" aria-label="Canción siguiente">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18 5v14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path d="M6 6l9 6-9 6z"/></svg>
          </button>
        </div>
      </div>
    </section>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <audio id="audio" preload="metadata"></audio>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
