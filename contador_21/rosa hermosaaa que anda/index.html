    <div class="rosa-container" id="rosa-container">
        <div class="glass">
            <div class="glass-glow-base"></div>
            <div class="flower">
                <div class="petal p1"></div>
                <div class="petal p2"></div>
                <div class="petal p3"></div>
                <div class="petal p4"></div>
                <div class="petal p5"></div>
                <div class="petal p6"></div>
                <div class="petal p7"></div>
                <div class="petal p8"></div>
                <div class="stem">
                    <div class="leaf l1"></div>
                    <div class="leaf l2"></div>
                </div>
            </div>

            <!-- Texto romántico DENTRO de la cúpula de cristal -->
            <div class="glass-quote">
                Nuestro amor durará hasta que el último pétalo de esta flor caiga pachuchitaa... 💛
            </div>

            <!-- Pétalos caídos en el suelo del domo -->
            <div class="fallen-petal fp1"></div>
            <div class="fallen-petal fp2"></div>
            <div class="fallen-petal fp3"></div>
            
            <!-- Pétalo que cae animado -->
            <div class="falling-petal"></div>
        </div>
