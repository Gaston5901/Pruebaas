<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Museo Flore · AlexDev</title>
    <meta name="theme-color" content="#2a0d3f">

    <style>
        body, html {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; user-select: none; background-color: #0a0514;
            -webkit-tap-highlight-color: transparent;
            overscroll-behavior: none; touch-action: manipulation;
        }

        * {
            cursor: url('flor.png'), auto !important;
        }

        .pantalla {
            position: absolute; inset: 0;
            background-size: cover; background-position: center;
            opacity: 0; visibility: hidden; pointer-events: none;
            transition: opacity .65s ease;
        }
        .pantalla.activa {
            opacity: 1; visibility: visible; pointer-events: auto;
            animation: zoomIn .7s ease;
        }

        .pantalla::after {
            content: ""; position: absolute; inset: 0; pointer-events: none;
            background: radial-gradient(ellipse at center, rgba(0,0,0,0) 55%, rgba(10,5,20,.35));
        }

        #pag1 { background-image: url('fondo1.gif'); }
        #pag2 { background-image: url('fondo2.gif'); }
        #pag3 { background-image: url('fondo3.gif'); }
        #pag4 { background-image: url('fondo4.gif'); }
        #pag5 { background-image: url('fondo5.gif'); }
        #pag6 { background-image: url('fondo6.gif'); }

        .boton-movible {
            position: absolute; cursor: grab; touch-action: none;
            background-size: contain; background-repeat: no-repeat; background-position: center;
            background-color: transparent; border: none; padding: 0; margin: 0;
            transform: translate(-50%, -50%);
            transition: filter .25s ease;
        }
        .boton-movible:active { cursor: grabbing; }

        @media (hover: hover) {
            .boton-movible:hover { filter: brightness(1.14); }
        }

        #btn-seguir { background-image: url('seguir.png'); aspect-ratio: 7 / 4; animation: glowBtn 2.4s ease-in-out infinite; }
        #btn1 { background-image: url('btn1.png'); aspect-ratio: 7 / 3; }
        #btn2 { background-image: url('btn2.png'); aspect-ratio: 7 / 3; }
        #btn3 { background-image: url('btn3.png'); aspect-ratio: 7 / 3; }
        #btn4 { background-image: url('btn4.png'); aspect-ratio: 7 / 3; }
        .btn-atras-img { background-image: url('atras.png'); aspect-ratio: 29 / 17; }

        #pag2.activa .boton-movible { animation: popIn .55s ease both; }
        #pag2.activa #btn1 { animation-delay: .08s; }
        #pag2.activa #btn2 { animation-delay: .18s; }
        #pag2.activa #btn3 { animation-delay: .28s; }
        #pag2.activa #btn4 { animation-delay: .38s; }

        @keyframes zoomIn { from { opacity: 0; transform: scale(1.06); } to { opacity: 1; transform: scale(1); } }
        @keyframes popIn { from { opacity: 0; transform: translate(-50%, -50%) scale(.55); } to { opacity: 1; transform: translate(-50%, -50%) scale(1); } }
        @keyframes glowBtn { 0%,100% { filter: brightness(1) drop-shadow(0 0 8px rgba(255,205,0,.35)); } 50% { filter: brightness(1.12) drop-shadow(0 0 26px rgba(255,205,0,.75)); } }

        #btn-seguir { top: 52%; left: 40%; width: min(350px, 34vw); }
        #btn1 { top: 41%; left: 25%; width: min(330px, 32vw); }
        #btn2 { top: 49%; left: 40%; width: min(330px, 32vw); }
        #btn3 { top: 38%; left: 55%; width: min(330px, 32vw); }
        #btn4 { top: 54%; left: 67%; width: min(330px, 32vw); }
        .btn-atras-img { top: 85%; left: 50%; width: min(300px, 30vw); }

        @media (max-width: 1100px) {
            #btn-seguir { top: 53%; left: 50%; width: 62vw; }
            #btn1 { top: 35%; left: 26%; width: 40vw; }
            #btn2 { top: 55%; left: 26%; width: 40vw; }
            #btn3 { top: 35%; left: 76%; width: 40vw; }
            #btn4 { top: 55%; left: 76%; width: 40vw; }
            .btn-atras-img { top: 86%; left: 50%; width: 44vw; }
        }

        @media (max-width: 700px) {
            #btn-seguir { top: 52%; left: 50%; width: 64vw; }
            #btn1 { top: 32%; left: 26%; width: 44vw; }
            #btn2 { top: 54%; left: 26%; width: 44vw; }
            #btn3 { top: 32%; left: 76%; width: 44vw; }
            #btn4 { top: 54%; left: 76%; width: 44vw; }
            .btn-atras-img { top: 85%; left: 50%; width: 48vw; }
        }

        @media (max-width: 900px) and (orientation: landscape) and (max-height: 520px) {
            #btn-seguir { top: 54%; left: 50%; width: 36vh; }
            #btn1 { top: 30%; left: 25%; width: 26vh; }
            #btn2 { top: 70%; left: 25%; width: 26vh; }
            #btn3 { top: 30%; left: 75%; width: 26vh; }
            #btn4 { top: 70%; left: 75%; width: 26vh; }
            .btn-atras-img { top: 86%; left: 50%; width: 30vh; }
        }

        @media (prefers-reduced-motion: reduce) {
            .pantalla.activa, #pag2.activa .boton-movible, #btn-seguir { animation: none; }
            .pantalla { transition: opacity .2s linear; }
        }
    </style>
</head>
<body>

    <div id="pag1" class="pantalla activa">
        <div id="btn-seguir" class="boton-movible"></div>
    </div>

    <div id="pag2" class="pantalla">
        <div id="btn1" class="boton-movible"></div>
        <div id="btn2" class="boton-movible"></div>
        <div id="btn3" class="boton-movible"></div>
        <div id="btn4" class="boton-movible"></div>
    </div>

    <div id="pag3" class="pantalla">
        <div id="atras3" class="boton-movible btn-atras-img"></div>
    </div>
    <div id="pag4" class="pantalla">
        <div id="atras4" class="boton-movible btn-atras-img"></div>
    </div>
    <div id="pag5" class="pantalla">
        <div id="atras5" class="boton-movible btn-atras-img"></div>
    </div>
    <div id="pag6" class="pantalla">
        <div id="atras6" class="boton-movible btn-atras-img"></div>
    </div>

    <script>
        document.addEventListener('contextmenu', function(e) { e.preventDefault(); });

        function cambiarPagina(idDestino) {
            document.querySelectorAll('.pantalla').forEach(p => p.classList.remove('activa'));
            document.getElementById(idDestino).classList.add('activa');
        }

        function hacerMovibleYClickeable(elemento, accionClic) {
            let pos1 = 0, pos2 = 0, pos3 = 0, pos4 = 0;
            let movido = false;

            elemento.onmousedown = iniciarArrastre;
            elemento.ontouchstart = iniciarArrastreTouch;

            function iniciarArrastre(e) {
                e.preventDefault();
                movido = false;
                pos3 = e.clientX; pos4 = e.clientY;
                document.onmouseup = finalizarArrastre;
                document.onmousemove = arrastrarElemento;
            }

            function iniciarArrastreTouch(e) {
                movido = false;
                let touch = e.touches[0];
                pos3 = touch.clientX; pos4 = touch.clientY;
                document.ontouchend = finalizarArrastre;
                document.ontouchmove = arrastrarElementoTouch;
            }

            function arrastrarElemento(e) {
                e.preventDefault();
                movido = true;
                pos1 = pos3 - e.clientX; pos2 = pos4 - e.clientY;
                pos3 = e.clientX; pos4 = e.clientY;
                actualizarPosicion();
            }

            function arrastrarElementoTouch(e) {
                movido = true;
                let touch = e.touches[0];
                pos1 = pos3 - touch.clientX; pos2 = pos4 - touch.clientY;
                pos3 = touch.clientX; pos4 = touch.clientY;
                actualizarPosicion();
            }

            function actualizarPosicion() {
                elemento.style.top = (elemento.offsetTop - pos2) + "px";
                elemento.style.left = (elemento.offsetLeft - pos1) + "px";
            }

            function finalizarArrastre() {
                document.onmouseup = null;
                document.onmousemove = null;
                document.ontouchend = null;
                document.ontouchmove = null;

                if (!movido) {
                    accionClic();
                }
            }
        }

        hacerMovibleYClickeable(document.getElementById('btn-seguir'), () => cambiarPagina('pag2'));

        hacerMovibleYClickeable(document.getElementById('btn1'), () => cambiarPagina('pag3'));
        hacerMovibleYClickeable(document.getElementById('btn2'), () => cambiarPagina('pag4'));
        hacerMovibleYClickeable(document.getElementById('btn3'), () => cambiarPagina('pag5'));
        hacerMovibleYClickeable(document.getElementById('btn4'), () => cambiarPagina('pag6'));

        hacerMovibleYClickeable(document.getElementById('atras3'), () => cambiarPagina('pag2'));
        hacerMovibleYClickeable(document.getElementById('atras4'), () => cambiarPagina('pag2'));
        hacerMovibleYClickeable(document.getElementById('atras5'), () => cambiarPagina('pag2'));
        hacerMovibleYClickeable(document.getElementById('atras6'), () => cambiarPagina('pag2'));
    </script>
</body>
