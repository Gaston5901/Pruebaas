  <body>
  
    <div class="valentine-header">
      <div class="valentine-text-container">

        <span class="text-msg">Te amo cada día más 🌹</span>
        <span class="text-msg">Siempre juntos tú y yo ✨</span>

    <div class="scene">

        <img class="card" src="./assets/59.png" style="--i: 6" alt="img"/>
        <img class="card" src="./assets/63.png" style="--i: 7" alt="img"/>
        <img class="card" src="./assets/57.png" style="--i: 8" alt="img"/>
        <img class="card" src="./assets/60.png" style="--i: 9" alt="img"/>
        <img class="card" src="./assets/56.png" style="--i: 10" alt="img"/>
        <img class="card" src="./assets/54.png" style="--i: 11" alt="img"/>
      </div>
    </div>

    <div class="valentine-footer">
      <img src="./assets/foto.png" alt="Corazón">
