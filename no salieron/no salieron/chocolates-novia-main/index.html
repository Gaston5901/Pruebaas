  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

  <style>
   * {
     cursor: url('flor.png'), auto !important;
   }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: radial-gradient(circle at center, #fff0f5 0%, #ffcce0 40%, #ff99c2 100%);
      overflow: hidden;
      margin: 0;
    }

    .main-title {
      font-family: "Great Vibes", cursive;
      font-size: 75px;
      color: #d81b60;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.15);
      margin: 0;
      text-align: center;
    }

    .chocolate-box {
      position: relative;
      height: 480px;
      width: 480px;
      cursor: pointer;
      margin-top: 10px;
      perspective: 1000px;
    }

    .chocolate-box:before, .chocolate-box:after {
      content:"";
      position: absolute;
    }

    .chocolate-box:before {
      width: 256px;
      height: 256px;
      background-color: #4b301b;
      transform: translate(-50%,-50%);
      top: 50%;
      left: 50%;
      box-shadow: 16px 16px #392312;
    }

    .chocolate-box:after {
      width: 109px;
      height: 109px;
      background-color: #2b0900;
      top:130px;
      left: 128px;
      box-shadow: 112px 0 #2b0900, 112px 112px #2b0900, 0px 112px #2b0900;
    }

    .chocs {
      position: absolute;
      z-index:1;
    }

    .top-left, .top-right, .bottom-left, .bottom-right {
      position: absolute;
      width: 85px;
      height: 85px;
      background-size: contain;
      background-position: center;
      background-repeat: no-repeat;
      filter: drop-shadow(4px 4px 6px rgba(0,0,0,0.5));
      transition: .2s;
    }

    .top-left { top:147px; left:147px; background-image: url('1.png'); }
    .top-right { top:147px; left: 259px; background-image: url('2.png'); }
    .bottom-left { top:259px; left: 147px; background-image: url('3.png'); }
    .bottom-right { left:259px; top: 259px; background-image: url('4.png'); }

    .top-left:hover, .bottom-right:hover, .bottom-left:hover, .top-right:hover {
      transform: rotate(25deg) scale(1.1);
    }

    .top-left:active, .bottom-right:active, .bottom-left:active, .top-right:active {
      opacity:0.7;
    }

    .box-bottom {
      position: absolute;
      background-color: #392312;
      width: 24px;
      height: 24px;
      transform: rotate(45deg);
      left:355px;
      top:117px;
      z-index:-1;
      box-shadow: 0px 338px #392312;
    }

    .cover {
      position: absolute;
      background-color: #ff4d88;
      width:240px;
      height: 240px;
      border: 8px solid #c2185b;
      z-index:2;
      top:112px;
      left:112px;
      transform-origin: top;
      transition: 0.6s cubic-bezier(0.4, 0, 0.2, 1);
      overflow: hidden;
    }

    .chocolate-box.open .cover {
      transform: rotateX(170deg);
      box-shadow: 8px -8px 32px rgba(0,0,0,.5);
    }

    .chocolate-box.open .cover:before,
    .chocolate-box.open .cover:after {
      opacity: 0;
      transition: opacity 0.2s;
    }

    .cover:before {
      position: absolute;
      content:"Feliz Día de la Novia";
      color: #ffe6f0;
      font-family: "Dancing Script", cursive;
      padding-top: 27px;
      padding-bottom: 27px;
      padding-left: 20px;
      padding-right: 20px;
      font-size: 32px;
      line-height: 1.1;
      width: 140px;
      transform: translate(-50%,-50%);
      left:50%;
      top:50%;
      text-align: center;
      border: 3px double;
      transition: opacity 0.3s;
      pointer-events: none;
    }

    .cover:after {
      position: absolute;
      content:"";
      background-color: #ffe6f0;
      height:16px;
      width: 160px;
      transform: rotate(-45deg);
      left:-32px;
      box-shadow: -8px 264px #ffe6f0;
      pointer-events: none;
    }

    .choco-label {
      position: absolute;
      display: none;
      color: #4a2c1a;
      font-family: "Playfair Display", Georgia, serif;
      font-size: 18px;
      font-style: italic;
      font-weight: 500;
      transition: .2s;
      background: rgba(255, 255, 255, 0.95);
      padding: 8px 16px;
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.1);
      border: 2px solid #ff99c2;
      width: 200px;
      text-align: center;
      word-break: break-word;
      overflow-wrap: break-word;
      z-index: 5;
    }

    #label-top-right { top:155px; left: 360px; }
    #label-bottom-left { top:267px; left:-95px; }
    #label-bottom-right { left: 360px; top: 267px; }
    #label-top-left { left: -95px; top: 155px; }

    .love-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(4px);
      z-index: 100;
      justify-content: center;
      align-items: center;
    }

    .love-modal.active { display: flex; }

    .love-message {
      background-image: url('fondo.png');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      padding: 40px 50px;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 25px 60px rgba(0,0,0,0.4);
      animation: floatIn 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
      max-width: 400px;
      position: relative;
      border: 4px solid #ff99c2;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    @keyframes floatIn {
      0% { transform: scale(0.8) translateY(30px); opacity: 0; }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }

    .love-message h2 {
      color: #d81b60;
      font-family: "Great Vibes", cursive;
      font-size: 55px;
      margin: 0 0 20px 0;
      z-index: 2;
    }

    .modal-image {
      max-width: 100%;
      max-height: 220px;
      object-fit: cover;
      margin-bottom: 20px;
      border-radius: 12px;
      display: none;
      border: 3px solid #f9e3e3;
      box-shadow: 0 8px 15px rgba(0,0,0,0.1);
      z-index: 2;
    }

    .modal-image.has-image { display: block; }

    .love-message p {
      color: #5a4b4b;
      font-family: "Playfair Display", Georgia, serif;
      font-size: 25px;
      margin: 0;
      line-height: 1.6;
      padding: 0 10px;
      white-space: pre-wrap;
      word-wrap: break-word;
      z-index: 2;
    }

    .close-btn {
      margin-top: 25px;
      padding: 10px 35px;
      background: #ffb3d1;
      color: #d81b60;
      border: none;
      border-radius: 25px;
      font-size: 16px;
      cursor: pointer;
      font-family: "Playfair Display", Georgia, serif;
      font-weight: bold;
      letter-spacing: 1px;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(255, 179, 209, 0.5);
      z-index: 2;
    }

    .close-btn:hover {
      background: #ff99c2;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255, 153, 194, 0.7);
    }

    .decor-left, .decor-right {
      position: absolute;
      width: 40px;
      height: 40px;
      opacity: 0.6;
    }

    .decor-left {
      top: 15px;
      left: 15px;
      border-left: 2px solid #ff99c2;
      border-top: 2px solid #ff99c2;
    }

    .decor-right {
      bottom: 15px;
      right: 15px;
      border-right: 2px solid #ff99c2;
      border-bottom: 2px solid #ff99c2;
    }

    @media (max-width: 600px) {
      .main-title { font-size: 45px; margin-top: -15px; }
      .chocolate-box { transform: scale(0.75); margin-top: -20px; }
      .choco-label { font-size: 14px; padding: 6px 12px; max-width: 120px; }
      #label-top-right { left: 320px; }
      #label-bottom-left { left: -60px; }
      #label-bottom-right { left: 320px; }
      #label-top-left { left: -50px; }
      .love-message { padding: 30px 20px; margin: 20px; max-width: 300px; }
      .love-message h2 { font-size: 38px; }
      .love-message p { font-size: 16px; }
      .modal-image { max-width: 100%; max-height: 180px; }
    }
  </style>
</head>
<body>

  <h1 class="main-title">Feliz día de la novia</h1>

  <div class="chocolate-box">
    <div class="chocs">
      <div id="top-left" class="top-left"></div>
      <div id="top-right" class="top-right"></div>
      <div id="bottom-left" class="bottom-left"></div>
      <div id="bottom-right" class="bottom-right"></div>
    </div>
    <div class="box-bottom"></div>
    <div class="cover"></div> <!-- La tapa de la caja -->

    <div id="label-top-left" class="choco-label">Turin</div>
    <div id="label-top-right" class="choco-label">Lindt </div>
    <div id="label-bottom-left" class="choco-label">Hershey's Miniaturas</div>
    <div id="label-bottom-right" class="choco-label">Bon o bon</div>
  </div>

  <div id="loveModal" class="love-modal">
    <div class="love-message">
      <div class="decor-left"></div>
      <div class="decor-right"></div>
      
      <h2 id="modalTitle"></h2>
      <img id="modalImage" class="modal-image" src="" alt="Nuestro recuerdo">
      <p id="modalText"></p>
      
      <button class="close-btn" onclick="closeModal()">Cerrar</button>
    </div>
  </div>

  <script>
    // Variables de los chocolates
    const chocolatesData = [
      { 
        title: "Gracias por todo", 
        message: "Mi amor, gracias por tu cariño incondicional y por hacer cada uno de mis días más especiales.", 
        image: "5.jpeg" 
      },
      { 
        title: "Eres increíble", 
        message: "Amo tu forma de ser y tu hermoso corazón. Eres la mejor compañera de vida que pude encontrar.", 
        image: "6.png" 
      },
      { 
        title: "Te amo infinito", 
        message: "No hay palabras suficientes para describir cuánto te quiero. ¡Eres lo mejor que me ha pasado!", 
        image: "7.png" 
      },
      { 
        title: "Mi lugar favorito", 
        message: "Mi lugar favorito en el mundo siempre será entre tus brazos. Gracias por hacerme tan feliz.", 
        image: "8.jpeg" 
      }
    ];

    const positionMap = {
      'top-left': 0,
      'top-right': 1,
      'bottom-left': 2,
      'bottom-right': 3
    };

    function showLoveMessage(chocolateId) {
      const index = positionMap[chocolateId];
      const choco = chocolatesData[index];

      if (choco) {
        $('#modalTitle').text(choco.title);
        
        const message = choco.message
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/\n/g, '<br>');
        
        $('#modalText').html(message);

        if (choco.image && choco.image.trim() !== '') {
          $('#modalImage').attr('src', choco.image).addClass('has-image');
        } else {
          $('#modalImage').removeClass('has-image').attr('src', '');
        }

        $('#loveModal').addClass('active');
      }
    }

    function closeModal() {
      $('#loveModal').removeClass('active');
      $('.chocolate-box').removeClass('open');
    }

    $(document).ready(function() {
      
      $('.chocolate-box, .cover').on('click', function(e) {
        if ($(e.target).hasClass('top-left') || 
            $(e.target).hasClass('top-right') || 
            $(e.target).hasClass('bottom-left') || 
            $(e.target).hasClass('bottom-right')) {
          return;
        }
        
        if ($(this).hasClass('cover')) {
            $('.chocolate-box').toggleClass('open');
            e.stopPropagation(); 
            return;
        }

        $(this).toggleClass('open');
      });

      // Cerrar modal
      $('#loveModal').on('click', function(e) {
        if (e.target === this) closeModal();
      });

      // Etiquetas flotantes de chocolates
      function adjustLabelPosition(label) {
        const originalLeft = window.getComputedStyle(label).left;
        label.style.display = 'block';
        label.style.whiteSpace = 'normal';
        label.style.overflowWrap = 'break-word';
        label.style.maxWidth = '180px';

        let labelRect = label.getBoundingClientRect();
        let currentLeft = parseFloat(window.getComputedStyle(label).left);
        let newLeft = currentLeft;

        if (labelRect.left < 0) newLeft -= labelRect.left - 10;
        if (labelRect.right > window.innerWidth) newLeft -= (labelRect.right - window.innerWidth + 10);

        label.style.left = newLeft + 'px';
        return { originalLeft };
      }

      function restoreLabelPosition(label, originals) {
        label.style.left = originals.originalLeft;
        label.style.display = 'none';
      }

      const positions = ['top-left', 'top-right', 'bottom-left', 'bottom-right'];
      
      positions.forEach(pos => {
        $(`#${pos}`).on('mouseenter', function() {
          const label = $(`#label-${pos}`)[0];
          this.originals = adjustLabelPosition(label);
        }).on('mouseout', function() {
          const label = $(`#label-${pos}`)[0];
          restoreLabelPosition(label, this.originals);
        });

        $(`#${pos}`).on('click', function(e) {
          if ($('.chocolate-box').hasClass('open')) {
            showLoveMessage(pos);
            e.stopPropagation(); 
          }
        });
      });
    });
  </script>
</body>
