    <style>
        * {
            cursor: url('4.png'), auto !important;
        }

        body, html {
            margin: 0; padding: 0; height: 100%; font-family: "Indie Flower";
            background: linear-gradient(to bottom, #ffd1ff, #e0c3fc, #ffe6e6);
            overflow: hidden; position: relative;
        }

        body::before {
            content: ''; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            width: 150%; height: 150%;
            background: radial-gradient(circle, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0) 70%);
            pointer-events: none; z-index: 1;
        }

        h1 {
            color: #d63384; text-shadow: 2px 2px 4px rgba(255, 255, 255, 0.9);
            display: flex; justify-content: center; align-items: center; gap: 15px;
            width: 100%; position: absolute; top: 10%; margin: 0; z-index: 30; font-size: 3.5rem;
        }

        .title-icon {
            height: 1.2em; 
            width: auto;
            filter: drop-shadow(2px 2px 3px rgba(0,0,0,0.2));
        }

    

        @keyframes blinkCursor {
            0%, 100% { border-color: transparent; }
            50% { border-color: #d63384; }
        }

        .sky-container {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20; 
        }

        .balloon-set {
            position: absolute; display: flex; flex-direction: column; align-items: center; width: 120px; 
            transform: translateY(120vh); 
            animation-timing-function: linear; 
            animation-fill-mode: forwards;
        }

        .balloon-img {
            width: 120px; height: auto; display: block; position: relative; z-index: 10; 
            transform-origin: bottom center; animation: wobble ease-in-out infinite alternate;
        }
        .string {
            width: 2px; height: 80px; background-color: #c70039; margin-top: -35px; position: relative; z-index: 5; opacity: 0.8;
            transform-origin: top center; animation: wobble ease-in-out infinite alternate;
        }
        .letter-img {
            width: 50px; height: auto; margin-top: -5px; filter: drop-shadow(2px 2px 3px rgba(0,0,0,0.2)); z-index: 10;
            transform-origin: top center; animation: wobble ease-in-out infinite alternate;
        }

        
        .set-1 { left: 50%; margin-left: -90px; top: 20%; 
                 animation-name: riseReal-1; animation-duration: 5.5s; }
        
        .set-2 { left: 50%; margin-left: 0px;   top: 20%; 
                 animation-name: riseReal-2; animation-duration: 8s; animation-delay: 0.8s; }
        
        .set-3 { left: 50%; margin-left: -135px; top: 50%; 
                 animation-name: riseReal-3; animation-duration: 6.5s; animation-delay: 0.3s; }
        
        .set-4 { left: 50%; margin-left: -65px;  top: 52%; 
                 animation-name: riseReal-4; animation-duration: 9s; animation-delay: 0.1s; z-index: 25; }
        
        .set-5 { left: 50%; margin-left: 5px;    top: 50%; 
                 animation-name: riseReal-5; animation-duration: 7.2s; animation-delay: 0.6s; }

        #letter-m{ margin-bottom: 55px !important; }

        .set-1 .balloon-img, .set-1 .string, .set-1 .letter-img { animation-duration: 2.8s; }
        .set-2 .balloon-img, .set-2 .string, .set-2 .letter-img { animation-duration: 3.5s; }
        .set-3 .balloon-img, .set-3 .string, .set-3 .letter-img { animation-duration: 3.0s; }
        .set-4 .letter-img {
            animation-name: wobble, subirSoloLetra;
            animation-duration: 3.8s, 9s;
            animation-iteration-count: infinite, 1;
            animation-fill-mode: none, forwards;
        }

        @keyframes subirSoloLetra {
            0% { margin-top: -5px; } 
            100% { margin-top: -20px; } 
        }
        .set-5 .balloon-img, .set-5 .string, .set-5 .letter-img { animation-duration: 3.2s; }


        @keyframes riseReal-1 {
            0%   { transform: translateY(120vh) translateX(0); opacity:1; }
            40%  { transform: translateY(50vh)  translateX(-20px); }
            100% { transform: translateY(0)     translateX(0); opacity:1; }
        }
        @keyframes riseReal-2 {
            0%   { transform: translateY(120vh) translateX(0); opacity:1;}
            30%  { transform: translateY(80vh)  translateX(40px); }
            70%  { transform: translateY(30vh)  translateX(20px); }
            100% { transform: translateY(0)     translateX(0); opacity:1;}
        }
        @keyframes riseReal-3 {
            0%   { transform: translateY(120vh) translateX(0); opacity:1;}
            25%  { transform: translateY(90vh) translateX(30px); }
            50%  { transform: translateY(60vh)  translateX(-30px); }
            75%  { transform: translateY(30vh)  translateX(15px); }
            100% { transform: translateY(0)     translateX(0); opacity:1;}
        }
        @keyframes riseReal-4 {
            0%   { transform: translateY(120vh) translateX(0); opacity:1;}
            50%  { transform: translateY(60vh)  translateX(-50px); }
            100% { transform: translateY(0)     translateX(0); opacity:1;}
        }
        @keyframes riseReal-5 {
            0%   { transform: translateY(120vh) translateX(0); opacity:1;}
            60%  { transform: translateY(40vh)  translateX(10px); }
            85%  { transform: translateY(15vh)  translateX(-30px); }
            100% { transform: translateY(0)     translateX(0); opacity:1;}
        }

        @keyframes wobble { 0% { transform: rotate(-5deg); } 100% { transform: rotate(5deg); } }


        .button-container {
            position: absolute; bottom: 10%; width: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; z-index: 40; opacity: 0; pointer-events: none;
            animation: fadeInButton 1s ease-in forwards; animation-delay: 7s; 
        }
        @keyframes fadeInButton { to { opacity: 1; pointer-events: auto; } }

        .love-button {
            display: flex; align-items: center; justify-content: center; gap: 10px;
            background-color: #ff3366; color: white; border: none; padding: 10px 30px; font-size: 1.5rem; border-radius: 50px; cursor: pointer; box-shadow: 0 6px 20px rgba(255, 51, 102, 0.6); transition: all 0.3s ease; font-weight: bold; margin-bottom: 15px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.2);
        }
        .love-button:hover { background-color: #e62e5c; transform: scale(1.1) translateY(-5px); box-shadow: 0 10px 25px rgba(255, 51, 102, 0.8); }

        .btn-icon {
            height: 1.2em;
            width: auto;
            border-radius: 5px; 
        }

        .music-waves { display: flex; align-items: flex-end; height: 30px; }
        .wave {
            width: 6px; height: 10px; background-color: #ff3366; margin: 0 3px; border-radius: 3px; opacity: 0.7;
            animation: wave-dance 1s infinite ease-in-out alternate;
        }
        .wave:nth-child(1) { animation-delay: 0.0s; } .wave:nth-child(2) { animation-delay: 0.2s; }
        .wave:nth-child(3) { animation-delay: 0.4s; } .wave:nth-child(4) { animation-delay: 0.1s; }
        .wave:nth-child(5) { animation-delay: 0.3s; }
        @keyframes wave-dance { 0% { height: 5px; transform: scaleY(1); } 100% { height: 25px; transform: scaleY(1.5); background-color: #d63384; } }

        .modal { display: none; position: fixed; z-index: 1000; left: 0; top: 0; width: 100%; height: 100%; background-color: rgba(0,0,0,0.85); animation: fadeIn 0.5s; }
        .modal-content { margin: 5% auto; display: block; max-width: 90%; max-height: 80vh; border-radius: 10px; animation: zoomIn 0.4s; transition: src 0.3s ease; }
        .close { position: absolute; top: 20px; right: 40px; color: #fff; font-size: 50px; font-weight: bold; cursor: pointer; z-index: 1001; margin-top: 50px !important; }
        @keyframes fadeIn {from {opacity: 0} to {opacity: 1}} @keyframes zoomIn {from {transform: scale(0.8)} to {transform: scale(1)}}

        .particle {
            position: absolute; pointer-events: none; z-index: 2; opacity: 1;
            top: -20px;
        }
        @keyframes fall-confetti {
            0% { transform: translateY(-5vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(105vh) rotate(720deg); opacity: 0.8; }
        }

    </style>
</head>
<body>

    <h1>
        <img src="gorro.gif" alt="Pastel" class="title-icon">
        <span id="title-text"></span>
        <img src="pastel.gif" alt="Pastel" class="title-icon">
    </h1>

    <div class="sky-container">
        <div class="balloon-set set-1">
            <img src="globo.png" alt="Globo" class="balloon-img">
            <div class="string"></div>
            <img src="t.png" alt="T" class="letter-img">
        </div>
        <div class="balloon-set set-2">
            <img src="globo.png" alt="Globo" class="balloon-img">
            <div class="string"></div>
            <img src="e.png" alt="E" class="letter-img">
        </div>
        <div class="balloon-set set-3">
            <img src="globo.png" alt="Globo" class="balloon-img">
            <div class="string"></div>
            <img src="a.png" alt="A" class="letter-img">
        </div>
        <div class="balloon-set set-4">
            <img src="globo.png" alt="Globo" class="balloon-img">
            <div class="string"></div>
            <img src="m.png" alt="M" class="letter-img">
        </div>
        <div class="balloon-set set-5">
            <img src="globo.png" alt="Globo" class="balloon-img">
            <div class="string"></div>
            <img src="o.png" alt="O" class="letter-img" id="letter-m">
        </div>
    </div>

    <div class="button-container">
        <button id="openBtn" class="love-button">
            <span>Regalo para ti</span>
            <img src="regalo.gif" alt="GIF" class="btn-icon">
        </button>

        <div class="music-waves">
            <span class="wave"></span><span class="wave"></span><span class="wave"></span><span class="wave"></span><span class="wave"></span>
        </div>
    </div>

    <div id="letterModal" class="modal">
        <span class="close">&times;</span>
        <img class="modal-content" id="imgCarta" src="carta1.png" alt="Carta">
    </div>

    <script>
        const textToType = "Buenas Señoritaa";
        const titleElement = document.getElementById("title-text");
        let charIndex = 0;

        function typeWriter() {
            if (charIndex < textToType.length) {
                titleElement.innerHTML += textToType.charAt(charIndex);
                charIndex++;
                setTimeout(typeWriter, 120);
            } else {
                
            }
        }
        
        setTimeout(typeWriter, 500); 

        const modal = document.getElementById("letterModal");
        const btn = document.getElementById("openBtn");
        const span = document.getElementsByClassName("close")[0];
        const imgCarta = document.getElementById("imgCarta"); 

        btn.onclick = function() { modal.style.display = "block"; }
        span.onclick = function() { modal.style.display = "none"; }
        window.onclick = function(event) { if (event.target == modal) { modal.style.display = "none"; } }

        const cartas = ["carta1.png", "carta2.png"];
        let indiceCarta = 0;

        function cambiarImagenCarta() {
            indiceCarta = (indiceCarta + 1) % cartas.length;
            imgCarta.src = cartas[indiceCarta];
        }

        setInterval(cambiarImagenCarta, 4500);

        function spawnParticle() {
            const body = document.body;
            let particle = document.createElement("div");
            particle.classList.add("particle");
            
            let isCircle = Math.random() > 0.5;
            let width = Math.random() * 10 + 6; 
            let height = isCircle ? width : Math.random() * 15 + 8;
            
            particle.style.width = `${width}px`; 
            particle.style.height = `${height}px`;
            if (isCircle) particle.style.borderRadius = "50%";

            particle.style.left = `${Math.random() * 100}vw`; 
            
            const colors = ['#ff4081', '#00e5ff', '#ffeb3b', '#69f0ae', '#ea80fc', '#ff9e80'];
            particle.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
            
            let duration = Math.random() * 4 + 4; 
            particle.style.animation = `fall-confetti ${duration}s linear forwards`;

            body.appendChild(particle);
            setTimeout(() => { particle.remove(); }, duration * 1000);
        }

        for (let i = 0; i < 40; i++) { 
            setTimeout(spawnParticle, Math.random() * 3000); 
        }
        
        setInterval(() => { spawnParticle(); }, 150);
    </script>
