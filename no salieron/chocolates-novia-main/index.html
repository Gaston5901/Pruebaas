<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Para mi señorita Iris</title>  
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Playfair+Display:ital,wght@0,400;0,600;1,400&family=Dancing+Script:wght@600&display=swap" rel="stylesheet">
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      /* Fondo atmósfera Morado Romántico */
      background: radial-gradient(circle at center, #2d1240 0%, #170924 60%, #0a0312 100%);
      overflow: hidden;
      margin: 0;
      font-family: "Playfair Display", Georgia, serif;
      color: #f3e8f8;
      user-select: none;
    }

    .main-title {
      font-family: "Great Vibes", cursive;
      font-size: clamp(38px, 7vw, 68px);
      color: #ebd5f7;
      text-shadow: 0 0 20px rgba(214, 160, 248, 0.4), 0 2px 5px rgba(0,0,0,0.6);
      margin: 0 0 10px 0;
      text-align: center;
      padding: 0 15px;
      pointer-events: none;
    }

    /* CONTENEDOR DE LA CAJA EN 3D */
    .chocolate-box {
      position: relative;
      height: 380px;
      width: 380px;
      cursor: pointer;
      perspective: 1200px;
      margin-top: 10px;
    }

    /* Base/Interior acolchado de la caja */
    .chocolate-box:before {
      content: "";
      position: absolute;
      width: 270px;
      height: 270px;
      background: linear-gradient(145deg, #1f0a2e 0%, #12041c 100%);
      transform: translate(-50%,-50%);
      top: 50%;
      left: 50%;
      border-radius: 24px;
      border: 3px solid #7e22ce;
      box-shadow: 
        0 20px 45px rgba(0, 0, 0, 0.8),
        inset 0 0 25px rgba(0, 0, 0, 0.9),
        0 0 15px rgba(168, 85, 247, 0.25);
    }

    .chocs {
      position: absolute;
      z-index: 1;
      width: 100%;
      height: 100%;
    }

    /* COMPARTIMENTOS/MOLDES DE LA CAJA */
    .item-slot {
      position: absolute;
      width: 90px;
      height: 90px;
      background: radial-gradient(circle, rgba(42, 16, 62, 0.9) 0%, rgba(20, 7, 31, 0.95) 100%);
      border: 1px solid rgba(192, 132, 252, 0.35);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: inset 0 4px 10px rgba(0,0,0,0.8), 0 4px 10px rgba(0,0,0,0.3);
      transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275), 
                  border-color 0.25s ease, 
                  box-shadow 0.25s ease;
      cursor: pointer;
      padding: 8px;
    }

    .item-slot img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 5px 8px rgba(0,0,0,0.6));
      pointer-events: none;
      transition: transform 0.25s ease;
    }

    .top-left { top: 92px; left: 92px; }
    .top-right { top: 92px; left: 198px; }
    .bottom-left { top: 198px; left: 92px; }
    .bottom-right { top: 198px; left: 198px; }

    /* Efecto al tocar/pasar mouse */
    .item-slot:active, .item-slot.touch-active {
      transform: scale(1.1) rotate(3deg);
      border-color: #f0abfc;
      box-shadow: inset 0 2px 6px rgba(0,0,0,0.5), 0 0 20px rgba(240, 171, 252, 0.5);
    }

    .item-slot:hover img {
      transform: scale(1.12);
    }

    /* TAPA DE LA CAJA REALISTA */
    .cover {
      position: absolute;
      background: linear-gradient(135deg, #581c87 0%, #3b0764 50%, #240046 100%);
      width: 270px;
      height: 270px;
      border: 3px solid #a855f7;
      border-radius: 24px;
      z-index: 2;
      top: 55px;
      left: 55px;
      transform-origin: top;
      transition: transform 0.7s cubic-bezier(0.4, 0, 0.2, 1);
      box-shadow: 0 18px 45px rgba(0,0,0,0.75), inset 0 0 20px rgba(255, 255, 255, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      transform-style: preserve-3d;
    }

    /* Moño decorativo en la tapa */
    .cover::before {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      width: 36px;
      background: linear-gradient(90deg, #d8b4fe 0%, #a855f7 50%, #7e22ce 100%);
      box-shadow: 0 0 10px rgba(0,0,0,0.3);
    }

    .chocolate-box.open .cover {
      transform: rotateX(160deg);
      box-shadow: 0 -15px 40px rgba(0,0,0,0.6);
    }

    /* CARA EXTERIOR DE LA TAPA */
    .cover-content {
      position: relative;
      z-index: 2;
      border: 2px double rgba(243, 232, 248, 0.7);
      border-radius: 16px;
      padding: 16px 12px;
      text-align: center;
      width: 84%;
      height: 84%;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(23, 9, 36, 0.85);
      backdrop-filter: blur(4px);
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      backface-visibility: hidden;
    }

    .cover-content span {
      color: #f3e8f8;
      font-family: "Dancing Script", cursive;
      font-size: 30px;
      line-height: 1.25;
      text-shadow: 0 2px 8px rgba(0,0,0,0.6);
    }

    /* CARA INTERIOR DE LA TAPA (Visible al abrir) */
    .cover-inside {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border-radius: 20px;
      background: linear-gradient(135deg, #3b0764 0%, #1f0438 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
      transform: rotateY(180deg) rotateZ(180deg);
      backface-visibility: hidden;
      border: 2px solid rgba(216, 180, 254, 0.4);
    }

    .cover-inside span {
      color: #f5d0fe;
      font-family: "Dancing Script", cursive;
      font-size: 24px;
      line-height: 1.3;
      text-shadow: 0 0 10px rgba(240, 171, 252, 0.4);
    }

    /* ETIQUETAS FLOTANTES */
    .choco-label {
      position: absolute;
      display: none;
      color: #f3e8f8;
      font-family: "Playfair Display", Georgia, serif;
      font-size: 13px;
      font-style: italic;
      background: rgba(22, 9, 33, 0.95);
      padding: 6px 14px;
      border-radius: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
      border: 1px solid #c084fc;
      white-space: nowrap;
      z-index: 5;
      pointer-events: none;
    }

    #label-top-left { top: 60px; left: 80px; }
    #label-top-right { top: 60px; left: 195px; }
    #label-bottom-left { top: 295px; left: 80px; }
    #label-bottom-right { top: 295px; left: 195px; }

    /* MODAL DE MENSAJE */
    .love-modal {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(8, 3, 12, 0.85);
      backdrop-filter: blur(8px);
      z-index: 100;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .love-modal.active { display: flex; }

    .love-message {
      background: linear-gradient(145deg, #2a0e3f 0%, #13051e 100%);
      padding: 32px 26px;
      border-radius: 24px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,0,0,0.85), 0 0 30px rgba(168, 85, 247, 0.25);
      animation: floatIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
      max-width: 380px;
      width: 100%;
      position: relative;
      border: 1px solid rgba(216, 180, 254, 0.3);
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    @keyframes floatIn {
      0% { transform: scale(0.85) translateY(20px); opacity: 0; }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }

    .love-message h2 {
      color: #ebd5f7;
      font-family: "Great Vibes", cursive;
      font-size: 46px;
      margin: 0 0 12px 0;
      text-shadow: 0 0 12px rgba(214, 160, 248, 0.4);
    }

    .modal-image {
      max-width: 100%;
      max-height: 190px;
      object-fit: cover;
      margin-bottom: 16px;
      border-radius: 14px;
      display: none;
      border: 1.5px solid #a855f7;
      box-shadow: 0 8px 20px rgba(0,0,0,0.4);
    }

    .modal-image.has-image { display: block; }

    .love-message p {
      color: #e9d5ff;
      font-size: 17px;
      margin: 0;
      line-height: 1.55;
      white-space: pre-wrap;
    }

    .close-btn {
      margin-top: 20px;
      padding: 10px 30px;
      background: linear-gradient(135deg, #8b40c6 0%, #581c87 100%);
      color: #ffffff;
      border: none;
      border-radius: 20px;
      font-size: 15px;
      cursor: pointer;
      font-family: "Playfair Display", Georgia, serif;
      font-weight: 600;
      letter-spacing: 0.5px;
      transition: all 0.25s ease;
      box-shadow: 0 4px 15px rgba(139, 64, 198, 0.4);
    }

    .close-btn:active {
      transform: scale(0.96);
    }

    @media (max-width: 480px) {
      .chocolate-box {
        transform: scale(0.88);
      }
      .love-message h2 { font-size: 38px; }
      .love-message p { font-size: 15px; }
    }
  </style>
</head>
<body>

  <h1 class="main-title">Un detalle para vos</h1>

  <div class="chocolate-box" id="boxContainer">
    <div class="chocs">
      <!-- 1. Papas Fritas -->
      <div id="top-left" class="item-slot top-left" data-pos="top-left">
        <img src="papas.png" onerror="this.src='papas.png'" alt="Papas Fritas">
      </div>

      <!-- 2. Mandarina -->
      <div id="top-right" class="item-slot top-right" data-pos="top-right">
        <img src="mandarina.png" onerror="this.src='naranja.png'" alt="Mandarina">
      </div>

      <!-- 3. Jugo de Manzana -->
      <div id="bottom-left" class="item-slot bottom-left" data-pos="bottom-left">
        <img src="jugo.png" onerror="this.src='manzana.png'" alt="Jugo de Manzana">
      </div>

      <!-- 4. Choclo -->
      <div id="bottom-right" class="item-slot bottom-right" data-pos="bottom-right">
        <img src="choclo.png" onerror="this.src='https://static.vecteezy.com/system/resources/thumbnails/048/050/944/small/corn-on-the-cob-on-a-transparent-background-png.png'" alt="Choclo">
      </div>
    </div>

    <!-- Tapa -->
    <div class="cover">
      <div class="cover-content">
        <span>Señorita Iris</span>
      </div>
      <div class="cover-inside">
        <span>Tocá cada uno para descubrir algo 🌹</span>
      </div>
    </div>

    <!-- Etiquetas flotantes -->
    <div id="label-top-left" class="choco-label">Papas Fritas</div>
    <div id="label-top-right" class="choco-label">Mandarina</div>
    <div id="label-bottom-left" class="choco-label">Jugo de Manzana</div>
    <div id="label-bottom-right" class="choco-label">Choclo</div>
  </div>

  <!-- Modal -->
  <div id="loveModal" class="love-modal">
    <div class="love-message">
      <h2 id="modalTitle"></h2>
      <img id="modalImage" class="modal-image" src="" alt="Recuerdo">
      <p id="modalText"></p>
      
      <button class="close-btn" onclick="closeModal()">Cerrar</button>
    </div>
  </div>

  <script>
const detailsData = [
  { 
    title: "Papas Fritas", 
    message: "Quería prepararte un detalle tan lindo como todo lo que transmitís. Sos una persona profundamente especial para mí y me hace feliz tenerte presente en mi vida.", 
    image: "5.jpeg" 
  },
  { 
    title: "Mandarina", 
    message: "Tenés un brillo único y una vibra hermosa que no se encuentra en cualquier lado. Me encanta tu manera de ver las cosas, lo auténtica que sos y lo bien que le hace tu presencia a cualquiera. Sos increíble.", 
    image: "6.png" 
  },
  { 
    title: "Jugo de Manzana", 
    message: "A veces no hacen falta grandes palabras para decir lo importante que sos. Te quiero un muchisimo señoritaa.", 
    image: "7.png" 
  },
  { 
    title: "Choclo", 
    message: "Aunque estos días estemos un poco alejados, mi cariño por vos no cambia en nada: te extraño y te valoro un montón. Quería prepararte este pequeño espacio para recordarte lo especial que sos y sacarte una sonrisa. Te merecés todo lo lindo del mundo, saranghae.", 
    image: "8.jpeg" 
  }
];

    const positionMap = {
      'top-left': 0,
      'top-right': 1,
      'bottom-left': 2,
      'bottom-right': 3
    };

    function showLoveMessage(itemId) {
      const index = positionMap[itemId];
      const item = detailsData[index];

      if (item) {
        $('#modalTitle').text(item.title);
        
        const message = item.message
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/\n/g, '<br>');
        
        $('#modalText').html(message);

        if (item.image && item.image.trim() !== '') {
          $('#modalImage').attr('src', item.image).addClass('has-image');
        } else {
          $('#modalImage').removeClass('has-image').attr('src', '');
        }

        $('#loveModal').addClass('active');
      }
    }

    // AQUÍ ESTÁ EL CAMBIO: Solo oculta el modal, NO cierra la caja
    function closeModal() {
      $('#loveModal').removeClass('active');
    }

    $(document).ready(function() {
      // Abre/cierra la caja solo al hacer clic o toque en la caja/tapa (fuera de las cosas de adentro)
      $('#boxContainer').on('click touchstart', function(e) {
        if ($(e.target).closest('.item-slot').length > 0) return;
        if (e.type === 'touchstart') e.preventDefault();

        $(this).toggleClass('open');
      });

      // Evento directo sobre cada elemento
      $('.item-slot').on('click touchstart', function(e) {
        if (e.type === 'touchstart') e.preventDefault();

        const pos = $(this).data('pos');
        const $slot = $(this);

        // Feedback táctil suave
        $slot.addClass('touch-active');
        setTimeout(() => $slot.removeClass('touch-active'), 250);

        if ($('#boxContainer').hasClass('open')) {
          showLoveMessage(pos);
        } else {
          $('#boxContainer').addClass('open');
          setTimeout(() => showLoveMessage(pos), 350);
        }
      });

      // Etiquetas flotantes en Hover (PC)
      $('.item-slot').on('mouseenter', function() {
        const pos = $(this).data('pos');
        $(`#label-${pos}`).stop(true, true).fadeIn(150);
      }).on('mouseleave', function() {
        const pos = $(this).data('pos');
        $(`#label-${pos}`).stop(true, true).fadeOut(150);
      });

      // Cerrar modal al tocar fuera
      $('#loveModal').on('click touchstart', function(e) {
        if (e.target === this) closeModal();
      });
    });
  </script>
</body>
</html>
