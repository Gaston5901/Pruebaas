  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
    }

     * {
  cursor: url('musica.png'), auto !important;
  
}

    body {
      margin: 0;
      padding: 0;
      height: 100dvh;
      width: 100vw;
      overflow: hidden;
      font-family: 'Montserrat', sans-serif;
      background: radial-gradient(circle at 50% 42%, #4a1239 0%, #21071e 55%, #09010a 100%);
      color: #fff5f9;
    }

    .font-script {
      font-family: 'Great Vibes', cursive;
    }

    .font-serif-romantic {
      font-family: 'Cormorant Garamond', serif;
    }

    
    .vanity-surface {
      background: radial-gradient(ellipse at 50% 35%, rgba(255, 165, 220, 0.28) 0%, rgba(130, 25, 90, 0.2) 48%, rgba(0, 0, 0, 0) 76%);
    }

    
    .music-box-stage {
      perspective: 1600px;
      position: relative;
    }

    
    .lid-open-group {
      transform-origin: 250px 316px;
      transition: transform 1.35s cubic-bezier(0.25, 1, 0.35, 1), opacity 0.85s ease;
    }

    .lid-closed-dome {
      transform-origin: 250px 316px;
      transition: transform 1.25s cubic-bezier(0.25, 1, 0.35, 1), opacity 0.75s ease;
    }

    
    .box-is-closed .lid-open-group {
      transform: rotateX(-88deg) scaleY(0.12) translateY(38px);
      opacity: 0;
      pointer-events: none;
    }

    .box-is-closed .lid-closed-dome {
      transform: rotateX(0deg) scaleY(1) translateY(0px);
      opacity: 1;
    }

    
    .box-is-open .lid-open-group {
      transform: rotateX(0deg) scaleY(1) translateY(0px);
      opacity: 1;
    }

    .box-is-open .lid-closed-dome {
      transform: rotateX(82deg) scaleY(0.08) translateY(-58px);
      opacity: 0;
      pointer-events: none;
    }

    
    .ballerina-3d-viewport {
      transition: opacity 0.9s ease, transform 1.2s cubic-bezier(0.22, 1, 0.36, 1);
      transform-origin: 45% 60%;
    }

    .box-is-closed .ballerina-3d-viewport {
      opacity: 0;
      transform: translateY(45px) scale(0.4);
      pointer-events: none;
    }

    .box-is-open .ballerina-3d-viewport {
      opacity: 1;
      transform: translateY(0px) scale(1);
    }

    
    .interior-magic-glow {
      transition: opacity 0.9s ease, filter 0.9s ease;
      opacity: 0.3;
    }

    .is-playing .interior-magic-glow {
      opacity: 1;
      filter: drop-shadow(0 0 28px rgba(255, 95, 215, 0.95));
    }

    @keyframes stageLightRotate {
      0% { stroke-dashoffset: 0; }
      100% { stroke-dashoffset: -260; }
    }

    .is-playing .animated-ring-dash {
      animation: stageLightRotate 2.4s linear infinite;
    }

    
    .side-winding-key {
      cursor: grab;
      touch-action: none;
      filter: drop-shadow(0 8px 14px rgba(0, 0, 0, 0.65));
      transition: filter 0.25s ease;
    }
    .side-winding-key:hover {
      filter: drop-shadow(0 0 18px rgba(255, 215, 100, 0.9));
    }
    .side-winding-key:active {
      cursor: grabbing;
    }

    
    .box-interactive-body {
      cursor: pointer;
    }

    
    @keyframes handHintBounce {
      0%, 100% { transform: translateY(-5px) rotate(-6deg); opacity: 0.92; }
      50% { transform: translateY(7px) rotate(8deg); opacity: 1; }
    }
    .wind-hint-badge {
      animation: handHintBounce 2s ease-in-out infinite;
    }

    
    @keyframes letterGentlePulse {
      0%, 100% { transform: rotate(-10deg) translateY(0px) scale(1); }
      50% { transform: rotate(-7deg) translateY(-5px) scale(1.06); }
    }
    .table-envelope {
      transform: rotate(-10deg);
      transition: transform 0.35s ease, filter 0.35s ease;
    }
    .table-envelope:hover {
      transform: rotate(-3deg) translateY(-7px) scale(1.1) !important;
      filter: drop-shadow(0 14px 26px rgba(255, 105, 180, 0.75));
    }
    .is-playing-envelope {
      animation: letterGentlePulse 2.5s ease-in-out infinite;
      filter: drop-shadow(0 0 20px rgba(255, 130, 200, 0.85));
    }

    
    .love-letter-paper {
      background: linear-gradient(165deg, #fff9fb 0%, #fff0f6 52%, #fce2ed 100%);
      box-shadow:
        0 25px 60px rgba(0, 0, 0, 0.8),
        0 0 40px rgba(255, 120, 190, 0.4),
        inset 0 0 0 2px #f3c6d8,
        inset 0 0 0 7px #fff8fb,
        inset 0 0 0 9px #e5b869;
    }

    .wax-seal {
      background: radial-gradient(circle at 35% 30%, #ff7eb6 0%, #d42c73 60%, #8f1147 100%);
      box-shadow:
        0 6px 16px rgba(143, 17, 71, 0.55),
        inset 0 2px 4px rgba(255, 210, 230, 0.65),
        inset 0 -3px 6px rgba(70, 5, 32, 0.7);
      border: 2px solid #f7d08a;
    }

    
    @keyframes shimmerBar {
      0% { background-position: 0% 50%; }
      100% { background-position: 200% 50%; }
    }
    .wind-bar-fill {
      background: linear-gradient(90deg, #f59e0b, #ec4899, #fde047, #ec4899, #f59e0b);
      background-size: 200% 100%;
      animation: shimmerBar 3s linear infinite;
      transition: width 0.12s ease-out;
    }

    @keyframes lowWindShake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }
    .shake-warning {
      animation: lowWindShake 0.45s ease-in-out;
    }

    .custom-scroll::-webkit-scrollbar {
      width: 6px;
    }
    .custom-scroll::-webkit-scrollbar-track {
      background: rgba(243, 198, 216, 0.25);
      border-radius: 8px;
    }
    .custom-scroll::-webkit-scrollbar-thumb {
      background: rgba(217, 91, 150, 0.5);
      border-radius: 8px;
    }
  </style>
</head>

    const MODEL_SCALE = 1.38;
    const CAM_FOCAL = 580;
    const CAM_DIST = 440;
    const CAM_TILT_X = 0.14;
    const STAGE_CENTER_X = 270; 
    const STAGE_BASE_Y = 322;

    function project3DPoint(x, y, z, rotY) {
      const sx = x * MODEL_SCALE;
      const sy = y * MODEL_SCALE;
      const sz = z * MODEL_SCALE;

      const cosY = Math.cos(rotY);
      const sinY = Math.sin(rotY);
      const rx = sx * cosY + sz * sinY;
      const rz = -sx * sinY + sz * cosY;
      const ry = sy;

      const cosX = Math.cos(CAM_TILT_X);
      const sinX = Math.sin(CAM_TILT_X);
      const cy = ry * cosX - rz * sinX;
      const cz = ry * sinX + rz * cosX;

      const scale = CAM_FOCAL / (CAM_DIST - cz);
      return {
        sx: STAGE_CENTER_X + rx * scale,
        sy: STAGE_BASE_Y + cy * scale,
        depth: cz,
        scale: scale * MODEL_SCALE
      };
    }

    function createLimbSegments3D(points3D, radii, colorMain, colorShadow, rotY, renderQueue) {
      for (let i = 0; i < points3D.length - 1; i++) {
        const p1 = project3DPoint(points3D[i][0], points3D[i][1], points3D[i][2], rotY);
        const p2 = project3DPoint(points3D[i + 1][0], points3D[i + 1][1], points3D[i + 1][2], rotY);
        const r1 = radii[i] * p1.scale;
        const r2 = radii[i + 1] * p2.scale;
        const avgDepth = (p1.depth + p2.depth) * 0.5;

        renderQueue.push({
          depth: avgDepth,
          draw: (ctx) => {
            const dx = p2.sx - p1.sx;
            const dy = p2.sy - p1.sy;
            const len = Math.hypot(dx, dy) || 1;
            const nx = -dy / len;
            const ny = dx / len;

            ctx.save();
            ctx.beginPath();
            ctx.moveTo(p1.sx + nx * r1, p1.sy + ny * r1);
            ctx.lineTo(p2.sx + nx * r2, p2.sy + ny * r2);
            ctx.arc(p2.sx, p2.sy, r2, Math.atan2(ny, nx), Math.atan2(-ny, -nx));
            ctx.lineTo(p1.sx - nx * r1, p1.sy - ny * r1);
            ctx.arc(p1.sx, p1.sy, r1, Math.atan2(-ny, -nx), Math.atan2(ny, nx));
            ctx.closePath();

            const grad = ctx.createLinearGradient(
              p1.sx - nx * r1, p1.sy - ny * r1,
              p1.sx + nx * r1, p1.sy + ny * r1
            );
            grad.addColorStop(0, colorShadow);
            grad.addColorStop(0.45, colorMain);
            grad.addColorStop(0.75, '#ffffff');
            grad.addColorStop(1, colorShadow);

            ctx.fillStyle = grad;
            ctx.fill();
            ctx.restore();
          }
        });
      }
    }

    
    function renderStageFloorRingsOnly(ctx, phase, intensity) {
      if (intensity <= 0.02) return;
      ctx.save();
      ctx.globalAlpha = intensity * 0.85;

      const floorRings = [
        { rx: 64, ry: 16, width: 2.6, color: 'rgba(255, 230, 150, 0.85)' },
        { rx: 94, ry: 23, width: 2.2, color: 'rgba(255, 140, 235, 0.75)' },
        { rx: 122, ry: 30, width: 1.8, color: 'rgba(255, 255, 255, 0.65)' }
      ];

      floorRings.forEach((ring, idx) => {
        const localPhase = phase * (idx % 2 === 0 ? 1.2 : -1.4) + idx;
        ctx.beginPath();
        ctx.ellipse(
          STAGE_CENTER_X,
          STAGE_BASE_Y + 2,
          ring.rx,
          ring.ry,
          0,
          localPhase,
          localPhase + Math.PI * 1.15
        );
        ctx.strokeStyle = ring.color;
        ctx.shadowBlur = 10;
        ctx.shadowColor = '#ff55d4';
        ctx.lineWidth = ring.width;
        ctx.stroke();
      });

      ctx.restore();
    }

    
    function renderCustomUploadedBallerina(ctx, rotY) {
      if (!customBallerinaImg) return;

      
      ctx.save();
      ctx.beginPath();
      ctx.ellipse(STAGE_CENTER_X, STAGE_BASE_Y, 58, 15, 0, 0, Math.PI * 2);
      const pedGrad = ctx.createRadialGradient(STAGE_CENTER_X, STAGE_BASE_Y, 6, STAGE_CENTER_X, STAGE_BASE_Y, 58);
      pedGrad.addColorStop(0, '#ffffff');
      pedGrad.addColorStop(0.55, '#ffb8eb');
      pedGrad.addColorStop(1, '#b56e12');
      ctx.fillStyle = pedGrad;
      ctx.fill();
      ctx.lineWidth = 2.2;
      ctx.strokeStyle = '#fff5c0';
      ctx.stroke();
      ctx.restore();

      const cosA = Math.cos(rotY);
      const signX = cosA >= 0 ? 1 : -1;
      const scaleX = signX * Math.max(0.14, Math.abs(cosA));

      const maxW = 240;
      const maxH = 285;
      const imgAspect = customBallerinaImg.width / (customBallerinaImg.height || 1);
      let drawW = maxW;
      let drawH = maxW / imgAspect;
      if (drawH > maxH) {
        drawH = maxH;
        drawW = maxH * imgAspect;
      }

      ctx.save();
      ctx.translate(STAGE_CENTER_X, STAGE_BASE_Y + 4);
      ctx.scale(scaleX, 1);
      ctx.shadowColor = 'rgba(255, 160, 230, 0.75)';
      ctx.shadowBlur = 16;
      ctx.drawImage(customBallerinaImg, -drawW / 2, -drawH, drawW, drawH);
      ctx.restore();
    }

          g.addColorStop(0.6, '#29150f');
          g.addColorStop(1, '#120805');
          c.fillStyle = g;
          c.beginPath();
          c.arc(hairBack.sx, hairBack.sy, r, 0, Math.PI * 2);
          c.fill();
          c.restore();
        }
      });

      const bunPt = project3DPoint(0, -197, -8.5, rotY);
      renderQueue.push({
        depth: bunPt.depth + 0.8,
        draw: (c) => {
          c.save();
          const r = 7.0 * bunPt.scale;
          c.fillStyle = '#1f100c';
          c.beginPath();
          c.arc(bunPt.sx, bunPt.sy, r, 0, Math.PI * 2);
          c.fill();
          c.strokeStyle = '#ff94ce';
          c.lineWidth = 2.0 * bunPt.scale;
          c.stroke();
          c.restore();
        }
      });

      
      for (let t = -3; t <= 3; t++) {
        const ta = t * 0.24;
        const tx = Math.sin(ta) * 9.0;
        const tz = Math.cos(ta) * 7.0 - 1;
        const ty = -194 - (3 - Math.abs(t)) * 1.9;
        const tPt = project3DPoint(tx, ty, tz, rotY);

        renderQueue.push({
          depth: tPt.depth + 1.5,
          draw: (c) => {
            c.save();
            c.fillStyle = t === 0 ? '#ff2e93' : (Math.abs(t) === 1 ? '#ffe885' : '#ffffff');
            c.beginPath();
            c.arc(tPt.sx, tPt.sy, (t === 0 ? 2.8 : 1.9) * tPt.scale, 0, Math.PI * 2);
            c.fill();
            c.restore();
          }
        });
      }

      const leftEye = project3DPoint(-3.6, -184, 10.2, rotY);
      const rightEye = project3DPoint(3.6, -184, 10.2, rotY);
      const leftCheek = project3DPoint(-5.2, -181, 9.2, rotY);
      const rightCheek = project3DPoint(5.2, -181, 9.2, rotY);
      const lipsPt = project3DPoint(0, -178, 10.4, rotY);

      [leftEye, rightEye].forEach((eyePt) => {
        renderQueue.push({
          depth: eyePt.depth + 1.2,
          draw: (c) => {
            c.save();
            c.strokeStyle = '#2b1510';
            c.lineWidth = 1.4 * eyePt.scale;
            c.beginPath();
            c.arc(eyePt.sx, eyePt.sy, 1.9 * eyePt.scale, 0.15 * Math.PI, 0.85 * Math.PI);
            c.stroke();
            c.restore();
          }
        });
      });

      [leftCheek, rightCheek].forEach((chkPt) => {
        renderQueue.push({
          depth: chkPt.depth + 1.1,
          draw: (c) => {
            c.save();
            c.globalAlpha = 0.48;
            c.fillStyle = '#ff78ad';
            c.beginPath();
            c.arc(chkPt.sx, chkPt.sy, 2.5 * chkPt.scale, 0, Math.PI * 2);
            c.fill();
            c.restore();
          }
        });
      });

      renderQueue.push({
        depth: lipsPt.depth + 1.3,
        draw: (c) => {
          c.save();
          c.fillStyle = '#db3d70';
          c.beginPath();
          c.ellipse(lipsPt.sx, lipsPt.sy, 2.1 * lipsPt.scale, 1.2 * lipsPt.scale, 0, 0, Math.PI * 2);
          c.fill();
          c.restore();
        }
      });

      renderQueue.sort((a, b) => a.depth - b.depth);
      for (let i = 0; i < renderQueue.length; i++) {

      }

    let audioCtx = null;
    let reverbNode = null;
    let masterGain = null;

    function initAudioEngine() {
      if (audioCtx) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        return;
      }
      const AudioContextClass = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContextClass();

      masterGain = audioCtx.createGain();
      masterGain.gain.value = 0.85;

      reverbNode = createCrystalReverb(audioCtx, 2.1, 3.2);
      const wetGain = audioCtx.createGain();
      wetGain.gain.value = 0.36;
      const dryGain = audioCtx.createGain();
      dryGain.gain.value = 0.78;

      masterGain.connect(dryGain);
      masterGain.connect(reverbNode);
      reverbNode.connect(wetGain);
      dryGain.connect(audioCtx.destination);
      wetGain.connect(audioCtx.destination);
    }

    function createCrystalReverb(ctx, duration, decay) {
      const length = ctx.sampleRate * duration;
      const impulse = ctx.createBuffer(2, length, ctx.sampleRate);
      const left = impulse.getChannelData(0);
      const right = impulse.getChannelData(1);
      for (let i = 0; i < length; i++) {
        const env = Math.pow(1 - i / length, decay);
        left[i] = (Math.random() * 2 - 1) * env;
        right[i] = (Math.random() * 2 - 1) * env;
      }
      const convolver = ctx.createConvolver();
      convolver.buffer = impulse;
      return convolver;
    }

    function playWindingClickSound() {
      initAudioEngine();
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'triangle';
      osc.frequency.setValueAtTime(1080 + Math.random() * 220, now);
      osc.frequency.exponentialRampToValueAtTime(340, now + 0.026);

      gain.gain.setValueAtTime(0.22, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.028);

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + 0.03);
    }

    function playSoftCloseLatchSound() {
      initAudioEngine();
      const now = audioCtx.currentTime;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(420, now);
      osc.frequency.exponentialRampToValueAtTime(160, now + 0.08);
      gain.gain.setValueAtTime(0.18, now);
      gain.gain.exponentialRampToValueAtTime(0.001, now + 0.09);
      osc.connect(gain);
      gain.connect(audioCtx.destination);

    function playMusicBoxTine(noteName, volume = 0.25) {
      if (!audioCtx || useCustomAudioFile) return;
      const freq = NOTE_FREQS[noteName];
      if (!freq) return;
      const now = audioCtx.currentTime;

      const oscFund = audioCtx.createOscillator();
      const gainFund = audioCtx.createGain();
      oscFund.type = 'sine';
      oscFund.frequency.setValueAtTime(freq, now);
      gainFund.gain.setValueAtTime(0.0001, now);
      gainFund.gain.linearRampToValueAtTime(volume, now + 0.006);
      gainFund.gain.exponentialRampToValueAtTime(volume * 0.35, now + 0.25);
      gainFund.gain.exponentialRampToValueAtTime(0.0001, now + 2.0);
      oscFund.connect(gainFund);
      gainFund.connect(masterGain);

      const oscChime = audioCtx.createOscillator();
      const gainChime = audioCtx.createGain();
      oscChime.type = 'sine';
      oscChime.frequency.setValueAtTime(freq * 4.0, now);
      gainChime.gain.setValueAtTime(0.0001, now);
      gainChime.gain.linearRampToValueAtTime(volume * 0.3, now + 0.002);
      gainChime.gain.exponentialRampToValueAtTime(0.0001, now + 0.075);
      oscChime.connect(gainChime);
      gainChime.connect(masterGain);

      oscFund.start(now);
      oscChime.start(now);
      oscFund.stop(now + 2.05);
      oscChime.stop(now + 0.085);
    }

        originY = boxRect.top + boxRect.height * (0.02 + Math.random() * 0.09);
        vx = (Math.random() - 0.5) * 1.6;
        vy = -1.1 - Math.random() * 1.6;
      }

      const isHeart = forceHeart ? (Math.random() < 0.68) : (Math.random() < 0.54);
      const noteSymbols = ['♪', '♫', '♬', '♩'];
      const heartSymbols = ['♥', '❤', '💖'];
      const colors = ['#ff6ec7', '#ff2e93', '#ffb8ec', '#ffe89e', '#ff85b3', '#ffffff'];

      romanticEmitters.push({
        x: originX,
        y: originY,
        vx: vx,
        vy: vy,
        swayAmp: 0.45 + Math.random() * 0.9,
        swayFreq: 0.03 + Math.random() * 0.035,
        phase: Math.random() * Math.PI * 2,
        alpha: 1.0,
        scale: 0.55,
        targetScale: 0.95 + Math.random() * 0.55,
        size: isHeart ? (18 + Math.random() * 13) : (20 + Math.random() * 13),
        isVectorHeart: isHeart && Math.random() < 0.65,
        symbol: isHeart
          ? heartSymbols[Math.floor(Math.random() * heartSymbols.length)]
          : noteSymbols[Math.floor(Math.random() * noteSymbols.length)],
        color: colors[Math.floor(Math.random() * colors.length)],
        rotation: (Math.random() - 0.5) * 0.4,
        rotSpeed: (Math.random() - 0.5) * 0.014
      });
    }

    function drawVectorHeart(ctx, x, y, size, color, alpha, rotation) {
      ctx.save();
      ctx.translate(x, y);
      ctx.rotate(rotation);
      ctx.scale(size / 24, size / 24);
      ctx.globalAlpha = alpha;
      ctx.fillStyle = color;
      ctx.shadowBlur = 14;
      ctx.shadowColor = color;
      ctx.beginPath();
      ctx.moveTo(0, 6);
      ctx.bezierCurveTo(-12, -4, -14, -16, -6, -16);
      ctx.bezierCurveTo(-1, -16, 0, -10, 0, -10);
      ctx.bezierCurveTo(0, -10, 1, -16, 6, -16);
      ctx.bezierCurveTo(14, -16, 12, -4, 0, 6);
      ctx.closePath();
      ctx.fill();
      ctx.restore();
    }

    function masterAnimationLoop() {
      
      if (isBoxPlaying && isBoxOpen && windCharge > 0) {
        const speedFactor = windCharge < 18 ? Math.max(0.28, windCharge / 18) : 1.0;
        spinSpeed += (0.032 * speedFactor - spinSpeed) * 0.08;

        if (!isDraggingKey && !isDraggingBar) {
          windCharge = Math.max(0, windCharge - 0.036);
          keyAngle3D -= 0.026 * speedFactor;
          updateKey3DVisuals(keyAngle3D);
          updateWindProgressBarUI();
        }

        if (useCustomAudioFile && customAudioReady) {
          customAudioEl.playbackRate = 0.84 + 0.16 * speedFactor;
        }

        
        if (Math.random() < 0.34) {
          spawnBoxRomanticParticle();
        }

        if (windCharge <= 0) {
          closeBoxImmediately('Se terminó la cuerda • Gira la llave dorada para darle más cuerda ✨');
        }
      } else {
        spinSpeed *= 0.9;
      }

      ballerinaAngleY = (ballerinaAngleY + spinSpeed) % (Math.PI * 2);
      magicRingPhase += 0.045;

      
      bCtx.setTransform(1, 0, 0, 1, 0, 0);
      bCtx.clearRect(0, 0, bCanvas.width, bCanvas.height);
      bCtx.setTransform(2, 0, 0, 2, 0, 0); 

      if (isBoxOpen) {
        const glowIntensity = Math.min(1, spinSpeed / 0.022);

        
        renderStageFloorRingsOnly(bCtx, magicRingPhase, Math.max(0.4, glowIntensity));

        
        if (useCustomBallerinaImg && customBallerinaImg) {
          renderCustomUploadedBallerina(bCtx, ballerinaAngleY);
        } else {
          renderBallerinaAndSwanModel(bCtx, ballerinaAngleY);
        }
      }

      
      pCtx.clearRect(0, 0, pCanvas.width, pCanvas.height);
      const pSpeed = isBoxPlaying ? 1.75 : 0.75;

      for (let i = ambientParticles.length - 1; i >= 0; i--) {
        const p = ambientParticles[i];
        p.x += p.vx * pSpeed;
        p.y += p.vy * pSpeed;

        if (p.temporary) {
          p.alpha -= 0.024;
          if (p.alpha <= 0) {
            ambientParticles.splice(i, 1);
            continue;
          }
        } else {
          if (p.y < -15) p.y = pCanvas.height + 15;
          if (p.x < -15) p.x = pCanvas.width + 15;
          if (p.x > pCanvas.width + 15) p.x = -15;
        }

        pCtx.save();
        if (p.isPetal) {
          p.angle += p.spin;
          pCtx.translate(p.x, p.y);
          pCtx.rotate(p.angle);
          pCtx.fillStyle = `rgba(255, 165, 205, ${p.alpha * 0.65})`;
          pCtx.beginPath();
          pCtx.ellipse(0, 0, p.r * 2.4, p.r * 1.3, 0, 0, Math.PI * 2);
          pCtx.fill();
        } else {
          pCtx.fillStyle = `hsla(${p.hue}, 100%, 82%, ${p.alpha})`;
          pCtx.shadowBlur = 10;
          pCtx.shadowColor = `hsla(${p.hue}, 100%, 70%, 0.9)`;
          pCtx.beginPath();
          pCtx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
          pCtx.fill();
        }
        pCtx.restore();
      }

      
      for (let i = romanticEmitters.length - 1; i >= 0; i--) {
        const item = romanticEmitters[i];
        item.phase += item.swayFreq;
        item.x += item.vx + Math.sin(item.phase) * item.swayAmp;
        item.y += item.vy;
        item.rotation += item.rotSpeed;
        item.scale += (item.targetScale - item.scale) * 0.1;
        item.alpha -= 0.0065;

        if (item.alpha <= 0 || item.y < -40) {
          romanticEmitters.splice(i, 1);
          continue;
        }

        if (item.isVectorHeart) {
          drawVectorHeart(pCtx, item.x, item.y, item.size * item.scale, item.color, item.alpha, item.rotation);
        } else {
          pCtx.save();
          pCtx.translate(item.x, item.y);
          pCtx.rotate(item.rotation);
          pCtx.font = `bold ${Math.round(item.size * item.scale)}px serif`;
          pCtx.fillStyle = item.color;
          pCtx.globalAlpha = item.alpha;
          pCtx.shadowBlur = 14;
          pCtx.shadowColor = '#ff47b8';
          pCtx.fillText(item.symbol, 0, 0);
          pCtx.restore();
        }
      }

      requestAnimationFrame(masterAnimationLoop);
    }

    
    const DEFAULT_LOVE_LETTER = {
      recipientName: 'Mi Amor',
      salutation: 'Para la dueña de mi corazón,',
      body: `Cada vez que escucho esta melodía pienso en ti y en la paz tan bonita que trajiste a mi vida desde el primer instante.\n\nQuise regalarte esta caja de música porque tú eres exactamente eso para mí: magia, dulzura y la canción más hermosa que mi corazón podría escuchar.\n\nGracias por tu sonrisa, por tu ternura y por hacer que cada día a tu lado se sienta como un sueño del que nunca quiero despertar. Te amo hoy, mañana y siempre.`,
      signature: 'Con todo mi amor, tu novio ♥'
    };

    const STORAGE_KEY = 'romantic_music_box_letter_v1';

    function loadLetterData() {
      try {
        const saved = localStorage.getItem(STORAGE_KEY);
        if (saved) return { ...DEFAULT_LOVE_LETTER, ...JSON.parse(saved) };
      } catch (err) {}
      return { ...DEFAULT_LOVE_LETTER };
    }

    function saveLetterData(data) {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
      } catch (err) {}
      renderLetterContent(data);
    }

    function renderLetterContent(data) {
      document.getElementById('headerRecipientName').textContent = data.recipientName || 'Mi Amor';
      document.getElementById('letterSalutation').textContent = data.salutation || 'Para mi amor,';
      document.getElementById('letterSignature').textContent = data.signature || 'Te amo ♥';

      const bodyContainer = document.getElementById('letterBodyContainer');
      bodyContainer.innerHTML = '';
      const paragraphs = (data.body || '').split('\n').filter(p => p.trim() !== '');
      paragraphs.forEach(pText => {
        const p = document.createElement('p');
        p.textContent = pText;
        bodyContainer.appendChild(p);
      });
    }

    const loveLetterModal = document.getElementById('loveLetterModal');
    const loveLetterCard = document.getElementById('loveLetterCard');
    const closeLetterBtn = document.getElementById('closeLetterBtn');
    const windFromLetterBtn = document.getElementById('windFromLetterBtn');

    function openLoveLetter() {
      if (windCharge < MIN_WIND_REQUIRED) {
        windCharge = 80;
        updateWindProgressBarUI();
        openBoxAndPlay();
      }
      loveLetterModal.classList.remove('hidden');
      loveLetterModal.classList.add('flex');
      requestAnimationFrame(() => {
        loveLetterCard.classList.remove('scale-95', 'opacity-0');
        loveLetterCard.classList.add('scale-100', 'opacity-100');
      });
    }

    function closeLoveLetter() {
      loveLetterCard.classList.remove('scale-100', 'opacity-100');
      loveLetterCard.classList.add('scale-95', 'opacity-0');
      setTimeout(() => {
        loveLetterModal.classList.remove('flex');
        loveLetterModal.classList.add('hidden');
      }, 300);
    }

    openLoveLetterBtn.addEventListener('click', openLoveLetter);
    closeLetterBtn.addEventListener('click', closeLoveLetter);
    loveLetterModal.addEventListener('click', (e) => {
      if (e.target === loveLetterModal) closeLoveLetter();
    });

    windFromLetterBtn.addEventListener('click', () => {
      playWindingClickSound();
      windCharge = 100;
      updateWindProgressBarUI();
      openBoxAndPlay();
      closeLoveLetter();
    });

    
    const editorModal = document.getElementById('editorModal');
    const openEditorBtn = document.getElementById('openEditorBtn');
    const closeEditorBtn = document.getElementById('closeEditorBtn');
    const saveLetterBtn = document.getElementById('saveLetterBtn');
    const resetDefaultLetterBtn = document.getElementById('resetDefaultLetterBtn');

    const inputRecipientName = document.getElementById('inputRecipientName');
    const inputSalutation = document.getElementById('inputSalutation');
    const inputLetterBody = document.getElementById('inputLetterBody');
    const inputSignature = document.getElementById('inputSignature');

    openEditorBtn.addEventListener('click', () => {
      const current = loadLetterData();
      inputRecipientName.value = current.recipientName;
      inputSalutation.value = current.salutation;
      inputLetterBody.value = current.body;
      inputSignature.value = current.signature;
      editorModal.classList.remove('hidden');
      editorModal.classList.add('flex');
    });

    closeEditorBtn.addEventListener('click', () => {
      editorModal.classList.remove('flex');
      editorModal.classList.add('hidden');
    });

    saveLetterBtn.addEventListener('click', () => {
      const updated = {
        recipientName: inputRecipientName.value.trim() || DEFAULT_LOVE_LETTER.recipientName,
        salutation: inputSalutation.value.trim() || DEFAULT_LOVE_LETTER.salutation,
        body: inputLetterBody.value.trim() || DEFAULT_LOVE_LETTER.body,
        signature: inputSignature.value.trim() || DEFAULT_LOVE_LETTER.signature
      };
      saveLetterData(updated);
      editorModal.classList.remove('flex');
      editorModal.classList.add('hidden');
    });

    resetDefaultLetterBtn.addEventListener('click', () => {
      inputRecipientName.value = DEFAULT_LOVE_LETTER.recipientName;
      inputSalutation.value = DEFAULT_LOVE_LETTER.salutation;
      inputLetterBody.value = DEFAULT_LOVE_LETTER.body;
      inputSignature.value = DEFAULT_LOVE_LETTER.signature;
    });

    const cornerMenuContainer = document.getElementById('cornerMenuContainer');
    const cornerMenuToggle = document.getElementById('cornerMenuToggle');
    const cornerActionsMenu = document.getElementById('cornerActionsMenu');

    function setCornerMenuOpen(isOpen) {
      cornerActionsMenu.classList.toggle('hidden', !isOpen);
      cornerMenuToggle.setAttribute('aria-expanded', String(isOpen));
      cornerMenuToggle.setAttribute('aria-label', isOpen ? 'Cerrar menú' : 'Abrir menú');
    }

    cornerMenuToggle.addEventListener('click', () => {
      setCornerMenuOpen(cornerMenuToggle.getAttribute('aria-expanded') !== 'true');
    });

    cornerActionsMenu.addEventListener('click', (e) => {
      if (e.target.closest('button')) setCornerMenuOpen(false);
    });

    document.addEventListener('click', (e) => {
      if (!cornerMenuContainer.contains(e.target)) setCornerMenuOpen(false);
    });

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') setCornerMenuOpen(false);
    });

    window.addEventListener('DOMContentLoaded', () => {
      generateOrnamentalPearls();
      renderLetterContent(loadLetterData());
      createAmbientParticles();
      masterAnimationLoop();
    });
  </script>
