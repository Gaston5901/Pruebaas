<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sorpresa 2 · Momentos</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Cormorant+Garamond:ital,wght@0,600;1,600;1,700&family=Outfit:wght@400;600;700;800&family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style_sorpresa2.css">
</head>

<body>
  <div class="warm-bg"></div>

  <div class="surprise-intro-overlay" id="surpriseOverlay">
    <div class="tapa" id="tapa">
      <div class="tapa-borde">
        <a href="../lobby/lobby.html" class="tapa-back" id="tapaBack" aria-label="Volver al lobby"><span class="tapa-back-flecha">←</span></a>
        <span class="tapa-creado">Creado 01/10/26</span>
        <div class="tapa-marco">
          <div class="tapa-amor">tii amooouuu</div>
          <div class="tapa-imagen-wrap">
            <img class="tapa-imagen" src="image.png" alt="Nosotros">
          </div>
          <h1 class="tapa-titulo">NUESTROS<br>MOMENTOS</h1>
          <p class="tapa-sub">Pachuchitaa ♥</p>
          <span class="tapa-level">❤ Amor · Nivel <span class="tapa-inf">∞</span></span>
        </div>
        <p class="tapa-pista">▸ tocar para abrir ◂</p>
      </div>
    </div>
  </div>

  <div class="pagina" id="pagina">
    <header class="visor-fijo">
      <div class="visor-barra">
        <a href="../lobby/lobby.html" class="btn-back">Cerrar</a>
        <h2 class="visor-titulo">Momentos</h2>
      </div>

      <div class="visor-foto">
        <img id="fotoActual" alt="Momento 1">
        <div class="visor-loader activo" id="visorLoader">
          <div class="visor-spinner"></div>
          <span>Cargando imagen...</span>
        </div>
      </div>

      <div class="visor-controles">
        <button class="flecha flecha-anterior" id="btnAnterior" aria-label="Cambiar momento">
          <span aria-hidden="true">❮</span>
        </button>
        <span class="contador" id="contador">1/20</span>
        <button class="flecha flecha-siguiente" id="btnSiguiente" aria-label="Cambiar momento">
          <span aria-hidden="true">❯</span>
        </button>
      </div>
    </header>

    <main class="momentos-lista">
      <article class="momento-item activo">
        <span class="momento-num" id="momentoNum">01 / 20</span>
        <h3 class="momento-titulo" id="momentoTitulo">El comienzo</h3>
        <p class="momento-texto" id="momentoTexto"></p>
      </article>
    </main>
  </div>

  <script src="sorpresa2.js"></script>
</body>
</html>
