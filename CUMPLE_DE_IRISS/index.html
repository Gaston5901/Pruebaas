<html lang="es">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <link rel="stylesheet" href="style.css">
  
  <style>

<body>
  <a class="volver-inicio" href="../index.html" aria-label="Volver al inicio">←</a>

  <div class="background" id="bg"></div>

  <div class="gift-container" id="giftBtn">
    <svg class="gift-icon" viewBox="0 0 24 24" fill="none" stroke="#f72585" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 12v10H4V12"/>
      <path d="M2 7h20v5H2z"/>
      <path d="M12 22V7"/>
      <path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/>
      <path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/>
    </svg>
    <div class="gift-text">Toca</div>
  </div>

  <div class="video-container" id="videoContainer">
    <div class="video-frame">
      <video id="bgVideo" class="video-layer video-bg" playsinline preload="auto" muted aria-hidden="true">
        <source src="21 añosss.mp4" type="video/mp4">
      </video>
      <video id="myVideo" class="video-layer video-fg" playsinline preload="auto">
        <source src="21 añosss.mp4" type="video/mp4">
      </video>
    </div>
  </div>

  <div class="surprise-overlay" id="surpriseOverlay">
    <a href="" class="btn-surprise" id="surpriseBtn">

ld)'%20stroke-width='8'/%3E%3Cpath%20d='M447%2099%20C460%2058%20483%2037%20515%2019%20L554%2052%20C519%2069%20502%2083%20492%20116%20Z'%20fill='url(%23red)'%20stroke='url(%23gold)'%20stroke-width='8'/%3E%3Cpath%20d='M147%20103%20C161%20172%20163%20189%20152%20212%20L194%20182%20C207%20165%20205%20148%20189%20103%20Z'%20fill='url(%23red)'%20stroke='url(%23gold)'%20stroke-width='8'/%3E%3Cpath%20d='M455%20100%20C443%20169%20440%20188%20452%20210%20L408%20179%20C396%20161%20398%20146%20411%20101%20Z'%20fill='url(%23red)'%20stroke='url(%23gold)'%20stroke-width='8'/%3E%3Cpath%20d='M87%2060%20C128%2046%20151%2067%20163%2099%20C141%2091%20118%2091%2096%2098%20C84%2080%2078%2069%2087%2060Z'%20fill='%23b80000'%20opacity='.8'/%3E%3Cpath%20d='M512%2060%20C472%2047%20449%2067%20436%2099%20C460%2090%20482%2091%20504%2098%20C516%2080%20521%2068%20512%2060Z'%20fill='%23b80000'%20opacity='.8'/%3E%3C/g%3E%3C/svg%3E"
        alt="Moño rojo"
        draggable="false"
      >
      <span class="btn-cut-line"></span>
      <span class="touch-badge">Tocar</span>
    </a>
  </div>

  <script>
    const bg = document.getElementById('bg');
    for (let i = 0; i < 30; i++) {
      const sparkle = document.createElement('div');
      sparkle.className = 'sparkle';
      sparkle.style.top = Math.random() * 100 + '%';
      sparkle.style.left = Math.random() * 100 + '%';
      sparkle.style.setProperty('--duration', (3 + Math.random() * 4) + 's');
      sparkle.style.setProperty('--delay', (Math.random() * 2) + 's');
      bg.appendChild(sparkle);
    }

    const giftBtn = document.getElementById('giftBtn');
    const videoContainer = document.getElementById('videoContainer');
    const bgVideo = document.getElementById('bgVideo');
    const myVideo = document.getElementById('myVideo');
    const surpriseOverlay = document.getElementById('surpriseOverlay');
    const surpriseBtn = document.getElementById('surpriseBtn');

    giftBtn.addEventListener('click', () => {
      giftBtn.style.opacity = '0';
      setTimeout(() => giftBtn.style.display = 'none', 500);

      videoContainer.classList.add('active');
      bgVideo.currentTime = 0;
      myVideo.currentTime = 0;
      bgVideo.muted = true;
      myVideo.muted = false;

      bgVideo.play().catch(() => {});

      myVideo.play().catch(() => {
        myVideo.muted = true;
        myVideo.play().catch(() => {});
      });
    });

    myVideo.addEventListener('ended', () => {
      surpriseOverlay.classList.add('active');
      bgVideo.pause();
    });

    surpriseBtn.addEventListener('click', (event) => {
      event.preventDefault();
      surpriseBtn.classList.add('cut');
      setTimeout(() => {
        window.location.href = surpriseBtn.getAttribute('href');
      }, 650);
    });
  </script>
</body>
</html>
