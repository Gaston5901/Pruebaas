<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tú y Yo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #0a0014;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            perspective: 1000px;
        }

        #escena {
            position: fixed;
            inset: 0;
            transform-style: preserve-3d;
            will-change: transform;
        }

        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        #superposicion {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
            z-index: 2;
        }

        #frase {
            font-family: Georgia, serif;
            color: rgba(255, 255, 255, 0);
            font-size: clamp(18px, 3vw, 32px);
            text-align: center;
            letter-spacing: 6px;
            transition: color 0.1s;
            text-shadow: 0 0 30px #b86bff, 0 0 60px #ff6bcb;
            line-height: 2;
        }

        #tarjetaNombres {
            position: fixed;
            top: 16px;
            right: 16px;
            display: flex;
            align-items: center;
            gap: 6px;
            background: linear-gradient(135deg, rgba(40, 8, 48, 0.6), rgba(10, 0, 20, 0.6));
            border: 1px solid rgba(200, 120, 255, 0.35);
            border-radius: 18px;
            padding: 8px 12px;
            z-index: 4;
            backdrop-filter: blur(8px);
            box-shadow: 0 0 18px rgba(184, 107, 255, 0.18);
        }

        #botonAlternarNombres {
            background: transparent;
            border: none;
            color: rgba(220, 150, 255, 0.85);
            font-size: 14px;
            cursor: pointer;
            padding: 0 2px;
            line-height: 1;
        }

        #botonAlternarNombres:hover {
            color: #b86bff;
        }

        #cajaNombres {
            display: flex;
            align-items: center;
            gap: 6px;
            max-width: 220px;
            overflow: hidden;
            transition: opacity 0.3s, max-width 0.3s, transform 0.3s;
        }

        #cajaNombres.oculto {
            opacity: 0;
            max-width: 0;
            pointer-events: none;
            transform: translateX(8px);
        }

        #cajaNombres input {
            background: transparent;
            border: none;
            border-bottom: 1px solid rgba(255, 255, 255, 0.3);
            color: #fff;
            font-family: Georgia, serif;
            font-size: 12px;
            letter-spacing: 0.5px;
            width: 76px;
            text-align: center;
            outline: none;
            padding: 3px 0;
        }

        #cajaNombres input::placeholder {
            color: rgba(255, 255, 255, 0.35);
        }

        #cajaNombres .amp {
            color: rgba(255, 130, 200, 0.7);
            font-family: Georgia, serif;
            font-size: 13px;
        }

        #repetir {
            position: fixed;
            bottom: 18px;
            left: 50%;
            transform: translateX(-50%);
            font-family: Arial, sans-serif;
            font-size: 11px;
            color: rgba(200, 130, 255, 0.5);
            letter-spacing: 2px;
            z-index: 3;
            cursor: pointer;
            border: 1px solid rgba(200, 130, 255, 0.3);
            padding: 6px 18px;
            border-radius: 20px;
            opacity: 0;
            transition: opacity 1s;
            background: rgba(10, 0, 20, 0.5);
        }

        #repetir:hover {
            color: #b86bff;
            border-color: #b86bff;
        }
    </style>
</head>

<body>
    <div id="escena">
        <canvas id="c"></canvas>
        <div id="superposicion">
            <div id="frase"></div>
        </div>
    </div>
    <div id="tarjetaNombres">
        <button id="botonAlternarNombres" title="Ocultar/mostrar caja de nombres">✎</button>
        <div id="cajaNombres">
            <input id="nombre1" type="text" placeholder="Tu Nombre" maxlength="14" />
            <span class="amp">&amp;</span>
            <input id="nombre2" type="text" placeholder="Su Nombre" maxlength="14" />
        </div>
    </div>
    <button id="repetir" onclick="iniciar()">↺ Repetir</button>
    <script>
        const c = document.getElementById('c');
        const ctx = c.getContext('2d');
        const fraseEl = document.getElementById('frase');
        const repetirEl = document.getElementById('repetir');
        const nombre1El = document.getElementById('nombre1');
        const nombre2El = document.getElementById('nombre2');
        const botonAlternar = document.getElementById('botonAlternarNombres');
        const cajaNombres = document.getElementById('cajaNombres');
        const escena = document.getElementById('escena');

        botonAlternar.addEventListener('click', () => cajaNombres.classList.toggle('oculto'));

        let W, H, t = 0, fase = 0, temporizadorFase = 0;
        let particulas = [], petalos = [], estrellas = [], puntosECG = [], ecgX = 0;
        let alfaTexto = 0, todosLlegaron = false, temporizadorFin = 0;

        function redimensionar() {
            W = c.width = window.innerWidth;
            H = c.height = window.innerHeight;
        }
        redimensionar();
        window.addEventListener('resize', redimensionar);

        function aleatorio(a, b) { return Math.random() * (b - a) + a; }

        function corazonX(t, s) { return s * 16 * Math.pow(Math.sin(t), 3) / 17; }
        function corazonY(t, s) { return -s * (13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t)) / 17; }

        function construirEstrellas() {
            estrellas = [];
            for (let i = 0; i < 300; i++) {
                const z = aleatorio(0.3, 1.3);
                estrellas.push({
                    x: aleatorio(0, W), y: aleatorio(0, H), z,
                    r: aleatorio(0.2, 1.5) * z, a: aleatorio(0.1, 0.8) * z,
                    pa: aleatorio(0, Math.PI * 2), ps: aleatorio(0.01, 0.03),
                    color: `hsl(${aleatorio(260, 330)},${aleatorio(60, 100)}%,${aleatorio(70, 95)}%)`
                });
            }
        }

        function construirParticulas() {
            const tamaño = Math.min(W, H) * 0.32;
            const puntosCorazon = [];
            for (let i = 0; i < 600; i++) {
                const a = (i / 600) * Math.PI * 2;
                puntosCorazon.push({ rx: corazonX(a, tamaño), ry: corazonY(a, tamaño) - 20 });
            }
            particulas = puntosCorazon.map(p => {
                const a = aleatorio(0, Math.PI * 2);
                const dist = aleatorio(50, Math.max(W, H) * 0.8);
                return {
                    x: W / 2 + Math.cos(a) * dist,
                    y: H / 2 + Math.sin(a) * dist,
                    rx: p.rx, ry: p.ry,
                    z: aleatorio(0.6, 1.5),
                    r: aleatorio(1.5, 3.5),
                    color: `hsl(${aleatorio(260, 340)},${aleatorio(70, 100)}%,${aleatorio(60, 85)}%)`,
                    velocidad: aleatorio(0.012, 0.028),
                    progreso: aleatorio(-0.5, 0),
                    estela: [], alfa: 0
                };
            });
        }

        function dibujarEstrellas() {
            estrellas.forEach(s => {
                s.pa += s.ps;
                const a = s.a * (0.5 + 0.5 * Math.sin(s.pa));
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                ctx.fillStyle = s.color.replace('hsl', 'hsla').replace(')', `,${a})`);
                ctx.fill();
            });
        }

        function dibujarECG() {
            ecgX += 3.5;
            const cx = W / 2, cy = H / 2, w = W * 0.7, inicioX = cx - w / 2;
            const relX = ecgX - inicioX;
            let y = cy;

            if (relX > w * 0.3 && relX < w * 0.32) y = cy - 5;
            else if (relX > w * 0.32 && relX < w * 0.34) y = cy + 8;
            else if (relX > w * 0.34 && relX < w * 0.42) {
                const p = (relX - w * 0.34) / (w * 0.08);
                if (p < 0.2) y = cy - H * 0.22 * p / 0.2;
                else if (p < 0.4) y = cy - H * 0.22 + (H * 0.22 + H * 0.12) * (p - 0.2) / 0.2;
                else if (p < 0.55) y = cy + H * 0.12 - (H * 0.12) * (p - 0.4) / 0.15;
                else y = cy;
            } else if (relX > w * 0.44 && relX < w * 0.46) y = cy - 8;
            else if (relX > w * 0.46 && relX < w * 0.48) y = cy + 5;

            puntosECG.push({ x: ecgX, y });
            if (puntosECG.length > 220) puntosECG.shift();

            ctx.beginPath();
            ctx.strokeStyle = '#b86bff';
            ctx.lineWidth = 2.5;
            ctx.shadowColor = '#b86bff';
            ctx.shadowBlur = 12;
            puntosECG.forEach((p, i) => {
                ctx.globalAlpha = i / puntosECG.length;
                i === 0 ? ctx.moveTo(p.x, p.y) : ctx.lineTo(p.x, p.y);
            });
            ctx.stroke();
            ctx.globalAlpha = 1;
            ctx.shadowBlur = 0;

            ctx.beginPath();
            ctx.arc(ecgX, y, 4, 0, Math.PI * 2);
            ctx.fillStyle = '#ffe0ff';
            ctx.shadowColor = '#ff6bcb';
            ctx.shadowBlur = 15;
            ctx.fill();
            ctx.shadowBlur = 0;

            if (relX > w * 0.34 && relX < w * 0.42) {
                ctx.beginPath();
                ctx.arc(ecgX, y, 12, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(184,107,255,0.15)';
                ctx.fill();
            }

            if (ecgX > cx + w / 2) {
                fase = 1;
                puntosECG = [];
            }
        }

        function dibujarParticulas() {
            particulas.forEach(p => {
                p.progreso = Math.min(p.progreso + p.velocidad, 1);
                if (p.progreso < 0) { p.alfa = 0; return; }
                const tx = W / 2 + p.rx;
                const ty = H / 2 + p.ry;
                p.x = p.x + (tx - p.x) * 0.06;
                p.y = p.y + (ty - p.y) * 0.06;
                p.alfa = Math.min(p.alfa + 0.04, 1);
                p.estela.push({ x: p.x, y: p.y });
                if (p.estela.length > 6) p.estela.shift();

                const rad = p.r * p.z;

                p.estela.forEach((tr, i) => {
                    ctx.beginPath();
                    ctx.arc(tr.x, tr.y, rad * 0.6, 0, Math.PI * 2);
                    ctx.fillStyle = p.color;
                    ctx.globalAlpha = (i / p.estela.length) * 0.3 * p.alfa;
                    ctx.fill();
                });

                ctx.globalAlpha = p.alfa;
                ctx.beginPath();
                ctx.arc(p.x, p.y, rad, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.shadowColor = p.color;
                ctx.shadowBlur = 8 * p.z;
                ctx.fill();
                ctx.shadowBlur = 0;
                ctx.globalAlpha = 1;
            });
        }

        function generarPetalos() {
            if (Math.random() < 0.12) {
                const z = aleatorio(0.5, 1.4);
                petalos.push({
                    x: aleatorio(0, W), y: -20,
                    vx: aleatorio(-1, 1) * z, vy: aleatorio(1, 2.5) * z,
                    rot: aleatorio(0, Math.PI * 2), rotS: aleatorio(-0.04, 0.04),
                    tamaño: aleatorio(8, 18) * z,
                    color: `hsl(${aleatorio(280, 340)},${aleatorio(70, 100)}%,${aleatorio(65, 85)}%)`,
                    alfa: aleatorio(0.5, 1) * Math.min(z, 1), balanceo: aleatorio(0, Math.PI * 2), balanceoS: aleatorio(0.02, 0.05)
                });
            }
            petalos = petalos.filter(p => p.y < H + 30);
            petalos.forEach(p => {
                p.y += p.vy; p.balanceo += p.balanceoS;
                p.x += p.vx + Math.sin(p.balanceo) * 1.2;
                p.rot += p.rotS;
                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.rot);
                ctx.globalAlpha = p.alfa;
                ctx.beginPath();
                ctx.ellipse(0, 0, p.tamaño / 2, p.tamaño, 0, 0, Math.PI * 2);
                ctx.fillStyle = p.color;
                ctx.fill();
                ctx.restore();
                ctx.globalAlpha = 1;
            });
        }

        function dibujarBrillo() {
            const g = ctx.createRadialGradient(W / 2, H / 2 - 20, 0, W / 2, H / 2 - 20, Math.min(W, H) * 0.35);
            g.addColorStop(0, 'rgba(184,107,255,0.18)');
            g.addColorStop(0.5, 'rgba(255,107,203,0.08)');
            g.addColorStop(1, 'rgba(10,0,20,0)');
            ctx.fillStyle = g;
            ctx.fillRect(0, 0, W, H);
        }

        function mostrarTexto(html, alfa) {
            fraseEl.innerHTML = html;
            fraseEl.style.color = `rgba(255,235,255,${alfa})`;
            fraseEl.style.textShadow = `0 0 ${30 * alfa}px #b86bff, 0 0 ${60 * alfa}px #ff6bcb`;
        }

        function bucle() {
            requestAnimationFrame(bucle);
            t++; temporizadorFase++;

            const inclinacionX = Math.sin(t * 0.0035) * 3;
            const inclinacionY = Math.cos(t * 0.0027) * 4;
            escena.style.transform = `rotateX(${inclinacionX}deg) rotateY(${inclinacionY}deg) scale(1.05)`;

            ctx.fillStyle = 'rgba(10,0,20,0.15)';
            ctx.fillRect(0, 0, W, H);
            dibujarEstrellas();

            if (fase === 0) {
                ctx.fillStyle = 'rgba(230,200,255,0.15)';
                ctx.font = '13px Arial';
                ctx.textAlign = 'center';
                ctx.fillText('♥  EL AMOR ESTÁ EN EL CÓDIGO  ♥', W / 2, H / 2 - H * 0.2);
                dibujarECG();
            }

            if (fase === 1) {
                dibujarParticulas();
                dibujarBrillo();
                const llegaron = particulas.filter(p => p.progreso >= 1).length;
                const proporcion = llegaron / particulas.length;

                if (proporcion > 0.6) {
                    alfaTexto = Math.min(alfaTexto + 0.015, 1);
                    const n1 = (nombre1El.value.trim() || 'TÚ').toUpperCase();
                    const n2 = (nombre2El.value.trim() || 'YO').toUpperCase();
                    mostrarTexto(
                        `${n1} & ${n2}<br><span style="font-size:0.5em;letter-spacing:8px;color:rgba(230,180,255,${alfaTexto})">ESCRITO EN LAS ESTRELLAS</span>`,
                        alfaTexto
                    );
                }

                if (proporcion >= 0.95 && !todosLlegaron) todosLlegaron = true;
                if (todosLlegaron) { temporizadorFin++; generarPetalos(); }
                if (todosLlegaron && temporizadorFin > 180) repetirEl.style.opacity = '1';
            }
        }

        function iniciar() {
            t = 0; fase = 0; temporizadorFase = 0; ecgX = 0; puntosECG = [];
            particulas = []; petalos = []; alfaTexto = 0;
            todosLlegaron = false; temporizadorFin = 0;
            fraseEl.style.color = 'rgba(255,255,255,0)';
            fraseEl.innerHTML = '';
            repetirEl.style.opacity = '0';
            construirEstrellas();
            construirParticulas();
        }

        iniciar();
        bucle();
    </script>
</body>

</html>
