<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sorpresa 8 - Te Quiero</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Cormorant+Garamond:ital,wght@0,600;1,600;1,700&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style_sorpresa8.css">
</head>

<body>

  <!-- MODAL DE PRESENTACIÓN INICIAL -->
  <div class="surprise-intro-overlay" id="surpriseOverlay">
    <div class="surprise-intro-card">
      <span class="surprise-tag">Sorpresa N°8 💗</span>
      <h1 class="surprise-title">
        Tengo algo<br>
        <span class="highlight-title">para vos</span>
      </h1>
      <p class="surprise-desc">
        Tocá y mirá quiénes te mandan un saludo por tu cumple 💗
      </p>
      <button class="btn-enter-surprise" id="btnOpenSorpresa">Abrir 💗</button>
    </div>
  </div>

  <!-- FONDO CÁLIDO DE AMBIENTE -->
  <div class="warm-bg"></div>

  <!-- NAVEGACIÓN -->
  <div class="top-bar">
    <a href="../lobby/lobby.html" class="btn-back" aria-label="Volver al lobby">←</a>
  </div>

  <main class="contenido" id="contenido">
    <section class="saludos" id="saludos" aria-hidden="true">
      <div class="saludos-cinta">💗 Para vos, Iris 💗</div>
      <div class="saludos-marco" id="saludosMarco">
        <video id="saludosVideo" playsinline webkit-playsinline disablepictureinpicture disableremoteplayback controlsList="nodownload noplaybackrate noremoteplayback" preload="auto">
          <source src="happy.mp4" type="video/mp4">
        </video>
        <div class="saludos-brillo"></div>
        <div class="fin-saludos" id="finSaludos">
          <span class="fin-corazon">💗</span>
          <p>Feliz cumple, Iris. Siempre brillá así.</p>
          <button class="btn-repetir" id="btnRepetir">Ver de nuevo 💗</button>
        </div>
      </div>
    </section>
  </main>

  <script src="sorpresa8.js"></script>

</body>
</html>
