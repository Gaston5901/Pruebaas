<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Guadiss ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Dancing+Script:wght@700&family=Great+Vibes&family=Indie+Flower&family=Quicksand:wght@400;700&display=swap" rel="stylesheet">
    <style>
        /* --- ESTILOS GENERALES Y FONDO --- */
        *, ::before, ::after { box-sizing: border-box; }
        
        body {
            font-family: "Quicksand", sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background: #0b0410;
            color: #fff;
        }

        .back-button {
            position: fixed;
            top: clamp(12px, 3vh, 24px);
            left: clamp(12px, 3vw, 28px);
            z-index: 9999;
            display: grid;
            place-items: center;
            width: clamp(40px, 5vw, 48px);
            height: clamp(40px, 5vw, 48px);
            border: 1.5px solid #d7a75f;
            border-radius: 50%;
            background: linear-gradient(145deg, #4a2a1b, #25120c);
            color: #ffdba3;
            font-size: clamp(1.8rem, 4vw, 2.3rem);
            line-height: 1;
            text-shadow: 0 1px 0 rgba(0, 0, 0, 0.5);
            cursor: pointer;
            box-shadow: inset 0 1px 0 rgba(255, 220, 160, 0.18), 0 6px 14px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(255, 219, 163, 0.12);
            transition: transform 0.2s ease, box-shadow 0.2s ease, background 0.2s ease;
        }

        .back-button:hover {
            background: linear-gradient(145deg, #5a3422, #2c150e);
            transform: translateX(-3px) scale(1.04);
            box-shadow: inset 0 1px 0 rgba(255, 220, 160, 0.28), 0 8px 18px rgba(0, 0, 0, 0.5), 0 0 16px rgba(255, 190, 110, 0.2);
        }

        .back-button:focus-visible {
            outline: 3px solid rgba(255, 219, 163, 0.55);
            outline-offset: 3px;
        }

        .bg-gif-fijo {
            position: fixed;
            inset: 0;
            z-index: -1;
            background:
                radial-gradient(circle at 20% 20%, rgba(173, 20, 87, 0.28), transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(88, 28, 135, 0.25), transparent 45%),
                linear-gradient(160deg, #160713 0%, #08030d 60%, #1a071c 100%);
        }

        .regalo-tocable {
            border: 0;
            background: transparent;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 14px;
            color: #fff;
            font-family: 'Great Vibes', cursive;
            font-size: clamp(1.8rem, 5.5vw, 2.6rem);
            letter-spacing: 0.5px;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.65), 0 0 18px rgba(255, 182, 219, 0.45);
        }

        .regalo-tocable img {
            width: min(260px, 55vw);
            filter: drop-shadow(0 12px 24px rgba(0, 0, 0, 0.4));
            animation: giftPulse 2.2s ease-in-out infinite;
            transition: transform 0.2s ease;
        }

        .regalo-tocable:active img { transform: scale(0.94); }

        @keyframes giftPulse {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-8px) scale(1.03); }
        }

        /* --- SOBRE (ENVELOPE) --- */
        .envelope {
            --width: 300px;
            --height: 175px;
            position: relative;
            width: var(--width);
            height: var(--height);
            perspective: 1000px;
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        @media (min-width: 720px) {
            .envelope { --width: 500px; --height: 290px; }
        }

        .envelope-inner {
            position: relative;
            width: 100%;
            height: 100%;
            transition: transform 0.8s ease-in-out;
            transform-style: preserve-3d;
        }

        .envelope.open .envelope-inner { transform: rotateY(180deg); }

        .envelope-front, .envelope-back {
            position: absolute;
            inset: 0;
            backface-visibility: hidden;
            border-radius: 8px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.15);
        }

        .envelope-front {
            background: #f8bbd0;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .envelope-front img.stamp {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 60px;
            height: 70px;
            border-radius: 4px;
            border: 2px dashed #ad1457;
        }

        .envelope-back {
            background: #f48fb1;
            transform: rotateY(180deg);
        }

        .envelope-back::after {
            content: "";
            position: absolute;
            inset: 0;
            background: conic-gradient(transparent 60deg, #f06292 60deg 120deg, #fce4ec 120deg 240deg, #f06292 240deg 300deg, transparent 300deg);
            z-index: 2;
        }

        .top-fold {
            position: absolute;
            inset: 0;
            background: #f48fb1;
            clip-path: polygon(0% 0%, 50% 55%, 100% 0%);
            z-index: 10;
            transform-origin: top;
            transition: transform 0.4s ease 0.4s;
        }

        .envelope.open .top-fold { transform: rotateX(180deg); z-index: 0; }

        .letter-preview {
            position: absolute;
            bottom: 10px;
            left: 50%;
            width: 90%;
            height: 80%;
            background: white;
            transform: translateX(-50%);
            z-index: 1;
            padding: 20px;
            text-align: center;
            transition: transform 0.4s ease 0.6s;
        }

        .envelope.open .letter-preview { transform: translate(-50%, -40%); }

        /* --- MODAL MEJORADO --- */
        .modal-carta {
            position: fixed;
            inset: 0;
            z-index: 2000;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(8px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.5s ease;
            padding: 20px;
        }

        .modal-carta.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-carta-content {
            background-image: url("https://i.pinimg.com/736x/ce/ea/8c/ceea8cc707d9cbe845db2e8ab6653889.jpg");
            background-size: cover;
            background-position: center;
            width: 100%;
            max-width: 520px;
            max-height: calc(100vh - 80px);
            border-radius: 22px;
            position: relative;
            box-shadow: 0 25px 50px rgba(0,0,0,0.18);
            overflow: hidden; /* el scroll lo gestionará el body interno */
            padding: 10px; /* espacio para que el borde interno no se pegue al contenedor */
            box-sizing: border-box;
        }

        .modal-carta-content::-webkit-scrollbar { display: none; }

        /* Contenido interno que crece con el scroll: aquí va el borde rosado */
        .modal-carta-body {
            background: transparent;
            border-radius: 18px;
            padding: 26px 20px;
            max-height: calc(100vh - 120px);
            overflow-y: auto;
            box-sizing: border-box;
            border: 0; /* sin borde por defecto, usamos box-shadow para el marco */
            box-shadow: inset 0 0 0 4px rgba(244,143,177,0.95);
        }

        .modal-carta-body::-webkit-scrollbar { display: none; }

        /* GIF del modal (Nuevo) */
        .modal-footer-gif {
            width: 100%;
            max-width: 250px;
            display: block;
            margin: 20px auto 0;
            border-radius: 15px;
            opacity: 1;
        }

        .gift-hint {
            margin-top: 8px;
            margin-bottom: 8px;
            font-family: 'Dancing Script', cursive;
            font-size: 1.7rem;
            font-weight: 700;
            color: #ad1457;
            text-shadow: 0 1px 6px rgba(255, 255, 255, 0.75);
        }

        .modal-carta-close {
            position: absolute;
            top: 20px;
            right: 20px;
            background: #f48fb1;
            color: white;
            border: none;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            z-index: 10;
            transition: transform 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .modal-carta-close:hover { transform: scale(1.1) rotate(90deg); }

        .letra-flotante-badge {
            display: inline-block;
            background: #ad1457;
            color: white;
            padding: 5px 20px;
            border-radius: 20px;
            font-family: 'Dancing Script', cursive;
            font-size: 1.5rem;
            margin-bottom: 20px;
            animation: float 2s infinite alternate ease-in-out;
        }

        @keyframes float {
            from { transform: translateY(0); }
            to { transform: translateY(-10px); }
        }

        /* Ajustes responsivos para el modal en móviles */
        @media (max-width: 420px) {
            .modal-carta { padding: 12px; }
            .modal-carta-content {
                padding: 18px 14px;
                border: 4px solid #fff;
                max-width: 96vw;
                max-height: calc(100vh - 40px);
                border-radius: 16px;
            }
            .modal-carta-content::before { box-shadow: inset 0 0 0 3px rgba(244,143,177,0.95); }
            .modal-footer-gif { max-width: 200px; }
        }

        .texto-carta {
            font-size: 1.2rem;
            line-height: 1.6;
                color: #6b1aa9;
            text-align: center;
            margin-bottom: 20px;
                font-weight: 600;
        }

            .texto-carta .resaltado {
                font-weight: 800;
                color: #4a0b74;
                background: rgba(244,143,177,0.06);
                padding: 6px 8px;
                border-radius: 8px;
                display: inline-block;
            }

        .img-polaroid {
            width: 180px;
            height: 180px;
            background: transparent;
            padding: 0;
            box-shadow: none;
            margin: 20px auto;
            transform: rotate(-3deg);
            transition: all 0.5s ease;
            opacity: 0;
            display: block;
            cursor: default;
        }

        .img-polaroid.visible {
            opacity: 1;
            transform: rotate(2deg) scale(1.1);
        }

        .img-polaroid img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 2px;
        }

        .modal-footer-gif.shake {
            animation: gentle-shake 1.8s ease-in-out infinite;
            cursor: pointer;
        }

        @keyframes gentle-shake {
            0% { transform: rotate(2deg) scale(1.1) translateX(0); }
            20% { transform: rotate(1deg) scale(1.1) translateX(-2px); }
            40% { transform: rotate(3deg) scale(1.1) translateX(2px); }
            60% { transform: rotate(1deg) scale(1.1) translateX(-2px); }
            80% { transform: rotate(3deg) scale(1.1) translateX(2px); }
            100% { transform: rotate(2deg) scale(1.1) translateX(0); }
        }

        /* --- MODAL EXTRA DE IMAGEN --- */
        .modal-extra {
            position: fixed;
            inset: 0;
            z-index: 4000;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            padding: 20px;
        }

        .modal-extra.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-extra-content {
            position: relative;
            width: min(420px, 95vw);
            background: transparent;
            border-radius: 18px;
            padding: 18px 16px 16px;
            text-align: center;
            box-shadow: none;
        }

        .modal-extra-title {
            margin: 0 0 12px;
            font-family: 'Great Vibes', cursive;
            font-size: clamp(1.9rem, 5.5vw, 2.5rem);
            color: #9c245d;
            font-weight: 400;
            letter-spacing: 0.5px;
            text-shadow: 0 1px 0 rgba(255, 255, 255, 0.95), 0 2px 8px rgba(255, 255, 255, 0.9);
            background: rgba(255, 255, 255, 0.75);
            border-radius: 999px;
            padding: 6px 14px;
            display: inline-block;
        }

        .modal-extra-img {
            width: 100%;
            max-height: 65vh;
            object-fit: contain;
            border-radius: 12px;
            display: block;
            animation: modal-image-float 2.4s ease-in-out infinite;
            transform-origin: center;
        }

        @keyframes modal-image-float {
            0% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-6px) scale(1.02); }
            100% { transform: translateY(0) scale(1); }
        }

        @media (prefers-reduced-motion: reduce) {
            .modal-extra-img {
                animation: none;
            }
        }

        .modal-extra-close {
            position: absolute;
            top: 10px;
            right: 10px;
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 50%;
            background: #f48fb1;
            color: #fff;
            font-size: 18px;
            cursor: pointer;
        }

        /* --- MODAL IMAGEN AMPLIADA --- */
        .modal-imagen-flotante {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.85);
            z-index: 3000;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: zoom-out;
        }
        
        .modal-imagen-flotante img {
            max-width: 90%;
            max-height: 80%;
            border: 10px solid white;
            border-radius: 5px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.9); }
            to { opacity: 1; transform: scale(1); }
        }

        .loading-overlay {
            position: fixed; inset: 0; z-index: 100000;
            display: grid; place-items: center;
            background:
                radial-gradient(ellipse at 50% -10%, rgba(255, 184, 96, 0.16) 0%, transparent 55%),
                radial-gradient(circle at 10% 85%, rgba(120, 58, 26, 0.35) 0%, transparent 40%),
                repeating-linear-gradient(90deg, rgba(0, 0, 0, 0.14) 0 2px, transparent 2px 11px),
                repeating-linear-gradient(0deg, rgba(255, 230, 190, 0.025) 0 1px, transparent 1px 15px),
                linear-gradient(125deg, #3a1e14 0%, #1c0d09 58%, #2c150e 100%);
            opacity: 1; visibility: visible;
            transition: opacity 0.45s ease, visibility 0.45s ease;
        }

        .loading-overlay.hidden {
            opacity: 0; visibility: hidden; pointer-events: none;
        }

        .spinner-wrap {
            position: relative;
            display: flex; flex-direction: column; align-items: center; gap: 20px;
            padding: 28px 38px;
            border-radius: 18px;
            border: 1px solid #6b4429;
            background:
                repeating-linear-gradient(90deg, rgba(0, 0, 0, 0.1) 0 2px, transparent 2px 10px),
                linear-gradient(160deg, #4a2a1b, #25120c);
            box-shadow: inset 0 1px 0 rgba(255, 220, 160, 0.14), 0 16px 36px rgba(0, 0, 0, 0.5);
            outline: 1px dashed rgba(255, 219, 163, 0.16);
            outline-offset: -8px;
        }

        .spinner-wrap::before,
        .spinner-wrap::after {
            content: '✦'; position: absolute; font-size: 1.3rem;
            animation: brilloSpinner 1.4s ease-in-out infinite alternate;
        }

        .spinner-wrap::before { left: 8px; top: 8px; color: #f0c987; }
        .spinner-wrap::after { right: 10px; bottom: 38px; color: #c99657; animation-delay: 0.55s; }

        .spinner-badge {
            position: absolute; top: 10px; right: 14px;
            color: #c9a471; font-family: 'Cinzel', Georgia, serif;
            font-size: 0.8rem; font-weight: 700;
            letter-spacing: 1px; text-transform: uppercase;
            -webkit-text-stroke: 0.3px rgba(0, 0, 0, 0.35);
            text-shadow: 0 -1px 1px rgba(0, 0, 0, 0.95), 0 1px 0 rgba(255, 225, 175, 0.25), 1px 0 1px rgba(0, 0, 0, 0.4);
        }
        .spinner-badge-num {
            font-size: 1.2em; color: #ffdba3; letter-spacing: 1px;
            text-shadow: 0 -1px 1px rgba(0, 0, 0, 0.95), 0 1px 0 rgba(255, 235, 180, 0.45), 0 0 6px rgba(255, 190, 110, 0.35);
        }

        .spinner-ring {
            position: relative;
            width: 68px; height: 68px; border-radius: 50%;
            border: 4px solid rgba(255, 219, 163, 0.25);
            border-top-color: #f0c987;
            border-right-color: #c99657;
            box-shadow: 0 0 28px rgba(255, 190, 110, 0.35), inset 0 0 14px rgba(201, 150, 87, 0.3);
            animation: girarSpinner 1s linear infinite;
        }

        .spinner-ring::after {
            content: '♥'; position: absolute; inset: 0;
            display: grid; place-items: center;
            color: #ffdba3; font-size: 1.5rem; line-height: 1;
            text-shadow: 0 1px 6px rgba(0, 0, 0, 0.5);
            animation: girarContrario 1s linear infinite;
        }

        .loading-text {
            margin: 0; color: #ffdba3; font-size: 1.05rem; font-weight: bold;
            font-family: 'Indie Flower', cursive;
            text-align: center; text-shadow: 0 1px 0 rgba(0, 0, 0, 0.55);
            display: inline-block; width: 13.5rem; max-width: 100%; white-space: nowrap;
        }

        @keyframes girarSpinner { to { transform: rotate(360deg); } }
        @keyframes girarContrario { to { transform: rotate(-360deg); } }
        @keyframes brilloSpinner {
            from { opacity: 0.25; transform: scale(0.7) rotate(0deg); }
            to { opacity: 1; transform: scale(1.2) rotate(25deg); }
        }

        body:not(.is-ready) .regalo-tocable img,
        body:not(.is-ready) .modal-extra-img {
            animation-play-state: paused !important;
        }
    </style>
</head>
<body>

    <div class="loading-overlay" id="loadingOverlay" aria-live="polite">
        <div class="spinner-wrap">
            <span class="spinner-badge">𝔇𝔢𝔱𝔞𝔩𝔩𝔢 <span class="spinner-badge-num">3</span></span>
            <div class="spinner-ring"></div>
            <p class="loading-text" id="loadingText">Cargando tu sorpresa...</p>
        </div>
    </div>

    <div class="bg-gif-fijo"></div>
    <button class="back-button" id="backButton" type="button" aria-label="Volver al lobby" title="Volver al lobby">&#8592;</button>

    <button class="regalo-tocable" id="regalo" type="button" aria-label="Abrir regalo">
        <img src="regalo.gif" alt="Regalo sorpresa">
        <span>Tocá el regalo...</span>
    </button>

    <!-- Modal extra -->
    <div class="modal-extra" id="modalExtra">
        <div class="modal-extra-content">
            <button class="modal-extra-close" id="closeModalExtra" aria-label="Cerrar">&times;</button>
            <h3 class="modal-extra-title">Soy yo tu regalo Waa</h3>
            <img class="modal-extra-img" src="https://i.pinimg.com/736x/e1/78/ed/e178ed3d4101a7f87d89db1b9338f440.jpg" alt="detalle de cumpleaños">
        </div>
    </div>

    <script>
        document.addEventListener('contextmenu', e => e.preventDefault());

        const regalo = document.getElementById('regalo');
        const modalExtra = document.getElementById('modalExtra');
        const closeModalExtraBtn = document.getElementById('closeModalExtra');

        document.getElementById('backButton').addEventListener('click', () => {
            window.location.href = 'loby.html';
        });

        function openModalExtra() {
            modalExtra.classList.add('active');
        }

        function closeModalExtra() {
            modalExtra.classList.remove('active');
        }

        regalo.addEventListener('click', openModalExtra);

        closeModalExtraBtn.addEventListener('click', closeModalExtra);
        modalExtra.addEventListener('click', (e) => {
            if (e.target === modalExtra) closeModalExtra();
        });

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && modalExtra.classList.contains('active')) {
                closeModalExtra();
            }
        });

        const criticalImages = [
            'regalo.gif',
            'https://i.pinimg.com/736x/e1/78/ed/e178ed3d4101a7f87d89db1b9338f440.jpg',
            'https://i.pinimg.com/736x/ce/ea/8c/ceea8cc707d9cbe845db2e8ab6653889.jpg'
        ];

        function preloadImages(urls) {
            return Promise.all(urls.map(src => new Promise(resolve => {
                const img = new Image();
                img.onload = img.onerror = resolve;
                img.src = src;
            })));
        }

        const loadingText = document.getElementById('loadingText');
        const puntosCarga = ['...', '.', '..', '...'];
        let indicePuntos = 0;
        const intervaloPuntos = setInterval(() => {
            indicePuntos = (indicePuntos + 1) % puntosCarga.length;
            loadingText.textContent = 'Cargando tu sorpresa' + puntosCarga[indicePuntos];
        }, 450);

        let experienciaIniciada = false;

        function startExperience() {
            if (experienciaIniciada) return;
            experienciaIniciada = true;
            clearInterval(intervaloPuntos);
            document.body.classList.add('is-ready');
            document.getElementById('loadingOverlay').classList.add('hidden');
        }

        const cargaMinima = new Promise(resolve => setTimeout(resolve, 5000));
        Promise.all([preloadImages(criticalImages), cargaMinima]).then(startExperience);
        setTimeout(startExperience, 8000);
    </script>
</body>
</html>
