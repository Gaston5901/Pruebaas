<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sorpresa 7</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,700&family=Outfit:wght@400;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style_detalles.css">
</head>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Outfit', sans-serif;
  }

  body {
    min-height: 100vh;
    min-height: 100svh;
    background: #22110b;
    color: #f6dfc2;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 28px 14px 50px;
    overflow-x: hidden;
  }

  .warm-bg {
    position: fixed;
    inset: 0;
    z-index: 0;
    pointer-events: none;
    background:
      radial-gradient(ellipse at 50% -10%, rgba(255, 184, 96, 0.16) 0%, transparent 55%),
      radial-gradient(circle at 10% 85%, rgba(120, 58, 26, 0.35) 0%, transparent 40%),
      repeating-linear-gradient(90deg, rgba(0, 0, 0, 0.14) 0 2px, transparent 2px 11px),
      repeating-linear-gradient(0deg, rgba(255, 230, 190, 0.025) 0 1px, transparent 1px 15px),
      linear-gradient(125deg, #3a1e14 0%, #1c0d09 58%, #2c150e 100%);
  }

  .warm-bg::before {
    content: "";
    position: absolute;
    top: -130px;
    left: 50%;
    transform: translateX(-50%);
    width: 460px;
    height: 340px;
    background: radial-gradient(ellipse, rgba(255, 190, 110, 0.14), transparent 70%);
  }

  .top-bar {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 640px;
    margin-bottom: 30px;
    display: flex;
  }

  .btn-back {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 44px;
    height: 44px;
    padding: 0;
    border-radius: 12px;
    border: 1.5px solid #c99657;
    background: linear-gradient(145deg, #4a2a1b, #25120c);
    color: #ffdba3;
    text-decoration: none;
    font-size: 1.3rem;
    font-weight: 800;
    line-height: 1;
    box-shadow: inset 0 1px 0 rgba(255, 220, 160, 0.16), 0 8px 18px rgba(0, 0, 0, 0.48);
    transition: transform 0.2s ease, box-shadow 0.2s ease;
  }

  .btn-back:hover,
  .btn-back:focus-visible {
    transform: translateY(-2px);
    box-shadow: inset 0 1px 0 rgba(255, 220, 160, 0.24), 0 11px 22px rgba(0, 0, 0, 0.55), 0 0 16px rgba(255, 190, 110, 0.18);
  }

  .btn-back:focus-visible,
  .detail-card:focus-visible {
    outline: 3px solid rgba(255, 219, 163, 0.5);
    outline-offset: 4px;
  }

  .details-container {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 640px;
  }

  .details-header {
    text-align: center;
    margin-bottom: 32px;
  }

  .details-badge {
    display: inline-block;
    padding: 6px 18px;
    border-radius: 6px;
    background: linear-gradient(180deg, #f0c987, #b9823f);
    border: 1px solid #ffe0a8;
    color: #3a1e12;
    font-size: 0.72rem;
    font-weight: 800;
    letter-spacing: 2px;
    text-transform: uppercase;
    box-shadow: 0 6px 14px rgba(0, 0, 0, 0.4), inset 0 1px 0 rgba(255, 255, 255, 0.45);
  }

  .details-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(2.5rem, 9vw, 3.7rem);
    font-weight: 700;
    font-style: italic;
    color: #ffdba3;
    line-height: 0.98;
    margin-top: 14px;
    text-shadow: 0 3px 0 rgba(0, 0, 0, 0.4), 0 0 22px rgba(255, 184, 96, 0.28);
  }

  .details-subtitle {
    font-size: 0.93rem;
    color: #d9b79a;
    margin: 12px auto 0;
    max-width: 330px;
    line-height: 1.45;
  }

  .details-grid {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 18px;
  }

  .detail-card {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 14px;
    min-height: 216px;
    padding: 26px 20px 22px;
    border-radius: 16px;
    border: 1px solid #6b4429;
    background:
      repeating-linear-gradient(90deg, rgba(0, 0, 0, 0.1) 0 2px, transparent 2px 10px),
      linear-gradient(160deg, #4a2a1b, #25120c);
    box-shadow: inset 0 1px 0 rgba(255, 220, 160, 0.14), 0 16px 36px rgba(0, 0, 0, 0.5);
    text-decoration: none;
    color: inherit;
    outline: 1px dashed rgba(255, 219, 163, 0.16);
    outline-offset: -8px;
    animation: cardIn 0.45s ease backwards;
    transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease;
  }

  .detail-card::before,
  .detail-card::after {
    content: "";
    position: absolute;
    top: 11px;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #d8a866, #6b4423 70%);
    box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.35);
    pointer-events: none;
  }

  .detail-card::before { left: 11px; }
  .detail-card::after { right: 11px; }

  .detail-card:nth-child(1) { animation-delay: 0.05s; }
  .detail-card:nth-child(2) { animation-delay: 0.12s; }
  .detail-card:nth-child(3) { animation-delay: 0.19s; }

  .detail-card:hover,
  .detail-card:focus-visible {
    transform: translateY(-6px);
    border-color: #c99657;
    box-shadow: inset 0 1px 0 rgba(255, 220, 160, 0.22), 0 22px 42px rgba(0, 0, 0, 0.58), 0 0 20px rgba(255, 184, 96, 0.16);
  }

  .detail-card:active {
    transform: scale(0.98);
  }

  .card-icon {
    flex: 0 0 56px;
    width: 56px;
    height: 56px;
    border-radius: 50%;
    background: linear-gradient(145deg, #f0c987, #9c6a33);
    border: 1px solid #ffe0a8;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.6rem;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.45), 0 6px 14px rgba(0, 0, 0, 0.4);
  }

  .card-info {
    flex: 1;
  }

  .card-info h3 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.6rem;
    color: #ffdba3;
    margin-bottom: 5px;
  }

  .card-info p {
    font-size: 0.84rem;
    color: #d9b79a;
    line-height: 1.45;
  }

  .arrow {
    position: absolute;
    right: 18px;
    bottom: 18px;
    flex: 0 0 auto;
    width: 32px;
    height: 32px;
    border-radius: 50%;
    background: linear-gradient(145deg, #f0c987, #b9823f);
    color: #3a1e12;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    font-weight: 800;
    transition: transform 0.2s ease, filter 0.2s ease;
  }

  .detail-card:hover .arrow {
    transform: translateX(3px);
    filter: brightness(1.08);
  }

  @keyframes cardIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }

  @media (max-width: 760px) {
    body {
      padding: 20px 12px 40px;
    }

    .top-bar {
      margin-bottom: 24px;
    }

    .btn-back {
      width: 40px;
      height: 40px;
      font-size: 1.2rem;
      border-radius: 10px;
    }

    .details-header {
      margin-bottom: 26px;
    }

    .details-title {
      font-size: clamp(2.2rem, 11vw, 2.9rem);
    }

    .details-subtitle {
      font-size: 0.86rem;
    }

    .details-grid {
      grid-template-columns: 1fr;
      gap: 12px;
    }

    .detail-card {
      flex-direction: row;
      align-items: center;
      min-height: 0;
      padding: 16px 56px 16px 16px;
      gap: 12px;
      border-radius: 14px;
      outline-offset: -6px;
    }

    .detail-card::before,
    .detail-card::after {
      top: 8px;
      width: 6px;
      height: 6px;
    }

    .detail-card::before { left: 8px; }
    .detail-card::after { right: 8px; }

    .card-icon {
      flex-basis: 46px;
      width: 46px;
      height: 46px;
      font-size: 1.35rem;
    }

    .card-info h3 {
      font-size: 1.25rem;
    }

    .card-info p {
      font-size: 0.78rem;
    }

    .arrow {
      right: 13px;
      width: 30px;
      height: 30px;
      font-size: 0.95rem;
    }
  }

  @media (max-width: 380px) {
    .details-title {
      font-size: 2rem;
    }

    .details-badge {
      font-size: 0.66rem;
      letter-spacing: 1.6px;
    }

    .card-info p {
      font-size: 0.74rem;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    * {
      animation: none !important;
      transition: none !important;
    }
  }
</style>

<body>

  <div class="warm-bg"></div>

  <div class="top-bar">
    <a href="../lobby/lobby.html" class="btn-back" aria-label="Volver al lobby">←</a>
  </div>

  <main class="details-container">
    <header class="details-header">
      <span class="details-badge">Sorpresa N°7 💜</span>
      <h1 class="details-title">Colección de Detalles</h1>
      <p class="details-subtitle">Elegí el rincón que quieras explorar 💖</p>
    </header>

    <div class="details-grid">
      <a href="final.html" class="detail-card">
        <div class="card-icon">💌</div>
        <div class="card-info">
          <h3>Detalle 01</h3>
          <p>Tocá para descubrir este mensaje especial</p>
        </div>
        <span class="arrow">→</span>
      </a>

      <a href="papel_amor/index.html" class="detail-card">
        <div class="card-icon">🌸</div>
        <div class="card-info">
          <h3>Detalle 02</h3>
          <p>Un rincón interactivo lleno de sorpresas</p>
        </div>
        <span class="arrow">→</span>
      </a>

      <a href="FelizCumpleIris.html" class="detail-card">
        <div class="card-icon">✨</div>
        <div class="card-info">
          <h3>Detalle 03</h3>
          <p>Tocá el regalo y mirá quién aparece 🐱</p>
        </div>
        <span class="arrow">→</span>
      </a>
    </div>
  </main>

</body>
</html>
