<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sorpresa 9 - El Gran Final</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Cormorant+Garamond:ital,wght@0,600;1,600;1,700&family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style_sorpresa9.css">
</head>

<body>

  <!-- MODAL DE PRESENTACIÓN INICIAL -->
  <div class="surprise-intro-overlay" id="surpriseOverlay">
    <div class="surprise-intro-card">
      <span class="surprise-tag">Sorpresa N°9 🎆</span>
      <h1 class="surprise-title">
        Llegamos al<br>
        <span class="highlight-title">gran final</span>
      </h1>
      <p class="surprise-desc">
        Esta es la última parada. Guardé lo mejor para el cierre, así que preparate.
      </p>
      <button class="btn-enter-surprise" id="btnOpenSorpresa">El final 🎆</button>
    </div>
  </div>

  <!-- FONDO CÁLIDO DE AMBIENTE -->
  <div class="warm-bg"></div>

  <!-- NAVEGACIÓN -->
  <div class="top-bar">
    <a href="../lobby/lobby.html" class="btn-back">←</a>
  </div>

  <main class="contenido">
    <section class="capitulo" id="capituloUno">
      <div class="capitulo-tag">Capítulo 1 de 5</div>
      <div class="capitulo-dots">
        <span class="actual"></span><span></span><span></span><span></span><span></span>
      </div>

      <p class="texto-guia" id="textoGuia"><span class="cursor" id="cursorTexto"></span></p>

      <button class="btn-seguir" id="btnSeguir" type="button">Vamos al próximo paso →</button>

      <div class="cierre-capitulo" id="cierreCapitulo">
        <span>🕯️</span>
        <p>Capítulo 2: tus 21 deseos</p>
      </div>
    </section>
  </main>

  <script src="sorpresa9.js"></script>

</body>
</html>
