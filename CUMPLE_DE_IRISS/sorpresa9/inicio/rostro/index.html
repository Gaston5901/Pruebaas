<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pachuchaa</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="loading-overlay" id="loadingOverlay" aria-live="polite">
    <div class="spinner-wrap">
      <div class="spinner-figure">
        <div class="spinner-ring"></div>
        <svg class="spinner-centro" viewBox="0 0 100 100" aria-hidden="true">
          <path d="M50 18 L58 40 L82 40 L62 54 L70 78 L50 64 L30 78 L38 54 L18 40 L42 40 Z" />
          <circle cx="24" cy="22" r="2" />
          <circle cx="78" cy="20" r="1.6" />
        </svg>
      </div>
      <p class="loading-text" id="loadingText">Cargando...</p>
    </div>
  </div>

  <button id="volver" class="volver" aria-label="Volver">←</button>
  <main class="wrap">
    <header class="top">
      <h1>Rostro</h1>
      <p class="sub">Tu foto se va dibujando sola, trazo a trazo.</p>
    </header>

    <section id="stage" class="stage">
      <canvas id="scene" width="760" height="760"></canvas>
      <div class="hint" id="hint">Elegí una foto para empezar</div>
    </section>

    <canvas id="image-canvas" class="image-canvas"></canvas>
    <canvas id="infinity-canvas" class="infinity-canvas"></canvas>
    <canvas id="firma-canvas" class="firma-canvas"></canvas>

    <section class="panel">
      <label class="btn">
        <input id="file" type="file" accept="image/*" />
        Elegir foto
      </label>

      <label class="ctrl">
        Color
        <input id="color" type="color" value="#7df9ff" />
      </label>

      <label class="ctrl">
        Velocidad
        <input id="speed" type="range" min="1" max="10" value="6" />
        <span id="speedLabel">6</span>
      </label>

      <button id="restart" class="btn ghost">Volver a dibujar</button>
      <button id="continuar" class="btn continuar">Continuar →</button>
      <span class="status" id="status"></span>
      <div class="progress"><i id="bar"></i></div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
