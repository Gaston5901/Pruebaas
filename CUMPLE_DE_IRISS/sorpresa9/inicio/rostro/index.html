<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rostro — dibujo lento</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <button id="volver" class="volver" aria-label="Volver">←</button>
  <main class="wrap">
    <header class="top">
      <h1>Rostro</h1>
      <p class="sub">Tu foto se va dibujando sola, trazo a trazo.</p>
    </header>

    <section id="stage" class="stage">
      <canvas id="scene" width="760" height="760"></canvas>
      <div class="hint" id="hint">Elegí una foto para empezar</div>
    </section>

    <canvas id="despues-canvas" class="despues-canvas"></canvas>

    <section class="panel">
      <label class="btn">
        <input id="file" type="file" accept="image/*" />
        Elegir foto
      </label>

      <label class="ctrl">
        Color
        <input id="color" type="color" value="#7df9ff" />
      </label>

      <label class="ctrl">
        Velocidad
        <input id="speed" type="range" min="1" max="10" value="6" />
        <span id="speedLabel">6</span>
      </label>

      <button id="restart" class="btn ghost">Volver a dibujar</button>
      <button id="continuar" class="btn continuar">Continuar →</button>
      <span class="status" id="status"></span>
      <div class="progress"><i id="bar"></i></div>
    </section>

    <canvas id="continuara-canvas" class="continuara-canvas"></canvas>
  </main>

  <script src="script.js"></script>
</body>
</html>
