<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Irisss</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #07040e;
            --panel: rgba(24, 12, 34, 0.72);
            --gold: #d9b86a;
            --gold-light: #fff2cf;
            --rose: #d98aa8;
            --violet: #8d5bb8;
            --muted: #b9a9c8;
        }
        body {
            min-height: 100dvh;
            font-family: 'Outfit', sans-serif;
            color: #f8f2ff;
            background:
                radial-gradient(circle at 18% 12%, rgba(141, 91, 184, 0.28), transparent 38%),
                radial-gradient(circle at 82% 78%, rgba(217, 138, 168, 0.22), transparent 42%),
                linear-gradient(160deg, #0b0616, var(--bg) 55%, #120820);
            overflow-x: hidden;
            padding: 26px 16px 36px;
        }
        body::before,
        body::after { content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0; }
        body::before {
            background-image:
                radial-gradient(1.5px 1.5px at 12% 22%, #fff 40%, transparent 45%),
                radial-gradient(1.5px 1.5px at 78% 16%, #ffe9b8 40%, transparent 45%),
                radial-gradient(1px 1px at 42% 68%, #fff 40%, transparent 45%),
                radial-gradient(1.5px 1.5px at 88% 54%, #f4b9d2 40%, transparent 45%);
            background-size: 240px 240px;
            opacity: 0.5;
            animation: breathing 7s ease-in-out infinite alternate;
        }
        body::after { background: radial-gradient(ellipse at center, transparent 45%, rgba(0, 0, 0, 0.62) 100%); }
        @keyframes breathing { from { opacity: 0.32; } to { opacity: 0.68; } }
        @keyframes appear { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }

        .final-wrap {
            position: relative; z-index: 1;
            width: min(620px, 100%);
            min-height: calc(100dvh - 62px);
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            animation: appear 0.9s ease both;
        }
        .nav-arriba { display: flex; align-items: center; margin-bottom: 18px; }
        .volver {
            display: inline-flex; align-items: center; gap: 8px;
            color: var(--muted); text-decoration: none;
            font-size: 0.78rem; letter-spacing: 0.06em;
        }
        .volver:hover { color: var(--gold-light); }
        .eyebrow {
            text-align: center; color: var(--gold);
            font-family: 'Cinzel', serif; font-size: 0.66rem;
            letter-spacing: 0.3em; text-transform: uppercase;
        }
        h1 {
            text-align: center; font-family: 'Cinzel', serif; font-weight: 600;
            font-size: clamp(1.5rem, 6vw, 2.2rem); line-height: 1.15;
            margin: 10px 0 8px;
            background: linear-gradient(120deg, var(--gold-light), var(--rose), var(--gold));
            -webkit-background-clip: text; background-clip: text; color: transparent;
        }
        .intro {
            text-align: center; color: var(--muted);
            font-size: 0.85rem; line-height: 1.5;
            max-width: 470px; margin: 0 auto 16px;
        }
        .progress { display: flex; justify-content: center; gap: 7px; margin-bottom: 16px; }
        .progress span {
            width: 26px; height: 4px; border-radius: 999px;
            background: rgba(255, 255, 255, 0.14);
            transition: background 0.4s ease, box-shadow 0.4s ease;
        }
        .progress span.hecho {
            background: linear-gradient(90deg, var(--rose), var(--gold));
            box-shadow: 0 0 10px rgba(217, 184, 106, 0.5);
        }
        #contenido { flex: 1; display: flex; flex-direction: column; justify-content: center; }

        .estacion,
        .final-todo {
            text-align: center;
            padding: 26px 20px;
            border-radius: 22px;
            background: var(--panel);
            border: 1px solid rgba(217, 184, 106, 0.22);
            box-shadow: 0 18px 44px rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(12px);
            animation: appear 0.7s ease both;
        }
        .estacion-num {
            font-family: 'Cinzel', serif;
            font-size: clamp(3.2rem, 14vw, 5rem);
            line-height: 1;
            color: transparent;
            background: linear-gradient(135deg, var(--gold-light), var(--rose));
            -webkit-background-clip: text; background-clip: text;
            filter: drop-shadow(0 4px 18px rgba(217, 138, 168, 0.3));
        }
        .estacion-tag,
        .final-tag {
            color: var(--gold); font-family: 'Cinzel', serif;
            font-size: 0.62rem; letter-spacing: 0.24em; text-transform: uppercase;
            margin-top: 8px;
        }
        .estacion-titulo,
        .final-titulo {
            font-family: 'Cinzel', serif; font-weight: 600;
            font-size: clamp(1.3rem, 5vw, 1.9rem);
            color: var(--gold-light); margin: 10px 0 8px;
        }
        .estacion-frase,
        .final-frase {
            color: var(--muted); font-size: 0.9rem; line-height: 1.55;
            max-width: 380px; margin: 0 auto 20px;
        }
        .estacion-cta {
            appearance: none; font: inherit; cursor: pointer;
            padding: 13px 24px; border-radius: 999px;
            background: linear-gradient(135deg, var(--rose), var(--violet));
            border: 1px solid var(--gold); color: var(--gold-light);
            font-family: 'Cinzel', serif; font-size: 0.74rem; letter-spacing: 0.1em;
            box-shadow: 0 10px 24px rgba(0, 0, 0, 0.4);
            transition: transform 0.25s ease;
        }
        .estacion-cta:hover { transform: translateY(-2px); }
        .estacion-cta:active { transform: scale(0.97); }
        .final-todo .estacion-cta { margin-top: 4px; }
        .strip {
            display: flex; justify-content: center; flex-wrap: wrap;
            gap: 8px; margin-top: 18px;
        }
        .strip button {
            appearance: none; font: inherit; cursor: pointer;
            width: 38px; height: 38px; border-radius: 50%;
            border: 1px solid rgba(217, 184, 106, 0.35);
            background: rgba(217, 184, 106, 0.08);
            color: var(--gold-light);
            font-family: 'Cinzel', serif; font-size: 0.72rem;
            transition: transform 0.2s ease, background 0.2s ease;
        }
        .strip button:hover:not(:disabled) { transform: translateY(-2px); }
        .strip button.hecho { background: linear-gradient(135deg, var(--rose), var(--violet)); }
        .strip button.actual { border-color: var(--gold-light); box-shadow: 0 0 12px rgba(217, 184, 106, 0.35); }
        .strip button:disabled { opacity: 0.3; cursor: default; }
        @media (max-width: 420px) {
            body { padding: 20px 12px 30px; }
            .estacion, .final-todo { padding: 22px 16px; }
            .intro { font-size: 0.8rem; }
            .strip button { width: 34px; height: 34px; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.2s !important; }
        }
    </style>
</head>
<body>
    <div class="final-wrap">
        <div class="nav-arriba">
            <a class="volver" href="../../lobby/lobby.html">← Volver al lobby</a>
        </div>
        <div class="eyebrow">El gran final</div>
        <h1>Tu historia, por capítulos</h1>
        <p class="intro">Ya estamos llegando al final de este viaje, Iris. Vamos de a uno, sin apuro: cada capítulo se abre cuando terminás el anterior.</p>
        <div class="progress" id="progress"><span></span><span></span><span></span><span></span><span></span><span></span></div>
        <div id="contenido"></div>
    </div>

    <script>
        (function () {
            const KEY = 'sorpresa9_capitulos_completados_v2';
            const capitulos = [
                { id: 1, nombre: 'La carta', frase: 'La carta que guardé para este momento, cuando ya estábamos llegando al final.', destino: 'carta.html?capitulo=1' },
                { id: 2, nombre: 'Las promesas', frase: 'El contador, las tres promesas y todo lo que empezó un 26 de abril.', destino: 'index.html?desbloqueado=1' },
                { id: 3, nombre: 'Un osito para vos', frase: 'Algo tierno que guardé especialmente para este momento.', destino: 'oso/index.html?capitulo=3' },
                { id: 4, nombre: 'Tus 21 deseos', frase: 'Tocá cada vela y pedí un deseo, hasta llegar a tus 21 deseos.', destino: '../../lobby/index.html?capitulo=4' },
                { id: 5, nombre: 'Fuegos artificiales', frase: 'Elegí un asiento, poné el volumen y mirá el cielo que preparé para vos.', destino: '../../fuegos artificiales/index.html?capitulo=5' },
                { id: 6, nombre: 'Sorpresa', frase: 'Queda una última sorpresa esperándote, Iris. Cerrá los ojos y dejate llevar.', destino: 'rostro/index.html?capitulo=6', cta: 'Ver sorpresa →' }
            ];

            let completados = new Set();
            try {
                const guardados = JSON.parse(localStorage.getItem(KEY) || '[]');
                if (Array.isArray(guardados)) guardados.forEach((n) => completados.add(Number(n)));
            } catch (e) {
                completados = new Set();
            }

            const params = new URLSearchParams(window.location.search);
            const cap = Number(params.get('capitulo'));
            if (params.get('listo') === '1' && cap >= 1 && cap <= 6) completados.add(cap);

            function guardar() {
                try { localStorage.setItem(KEY, JSON.stringify([...completados].sort((a, b) => a - b))); } catch (e) {}
            }

            function esProgreso(id) {
                return completados.has(id);
            }

            function totalProgreso() {
                return capitulos.filter((c) => esProgreso(c.id)).length;
            }

            function desbloqueado(id) {
                if (totalProgreso() >= 6) return true;
                if (id === 1) return true;
                const capitulo = capitulos.find((c) => c.id === id);
                if (capitulo && capitulo.proximamente) return false;
                return esProgreso(id - 1) || completados.has(id);
            }

            function abrir(capitulo) {
                if (capitulo.destino) {
                    window.location.href = capitulo.destino;
                    return;
                }
                completados.add(capitulo.id);
                guardar();
                pintar();
            }

            function pintar() {
                const contenido = document.getElementById('contenido');
                contenido.innerHTML = '';
                const todosListos = totalProgreso() >= 6;
                const actual = capitulos.find((c) => !esProgreso(c.id)) || capitulos[5];

                const panel = document.createElement('section');
                panel.className = todosListos ? 'final-todo' : 'estacion';
                if (todosListos) {
                    panel.innerHTML = '<div class="final-tag">Gran final completo</div>' +
                        '<h2 class="final-titulo">Todo listo, Iris 💜</h2>' +
                        '<p class="final-frase">Recorrimos los seis capítulos. Elegí cualquiera de abajo para volver a vivirlo cuando quieras.</p>';
                } else {
                    panel.innerHTML = '<div class="estacion-num">' + String(actual.id).padStart(2, '0') + '</div>' +
                        '<div class="estacion-tag">Capítulo ' + actual.id + ' de 6</div>' +
                        '<h2 class="estacion-titulo">' + actual.nombre + '</h2>' +
                        '<p class="estacion-frase">' + actual.frase + '</p>' +
                        '<button class="estacion-cta" type="button">' + (actual.cta || (actual.destino ? 'Abrir capítulo →' : 'Marcar como visto ✓')) + '</button>';
                    const cta = panel.querySelector('.estacion-cta');
                    cta.addEventListener('click', () => abrir(actual));
                }
                contenido.appendChild(panel);

                const strip = document.createElement('div');
                strip.className = 'strip';
                capitulos.forEach((capitulo) => {
                    const btn = document.createElement('button');
                    btn.type = 'button';
                    btn.textContent = String(capitulo.id).padStart(2, '0');
                    if (esProgreso(capitulo.id)) btn.classList.add('hecho');
                    if (!todosListos && capitulo.id === actual.id) btn.classList.add('actual');
                    const habilitado = desbloqueado(capitulo.id) && !capitulo.proximamente;
                    btn.disabled = !habilitado;
                    btn.title = capitulo.proximamente ? 'Próximamente' : capitulo.nombre;
                    if (habilitado) btn.addEventListener('click', () => abrir(capitulo));
                    strip.appendChild(btn);
                });
                contenido.appendChild(strip);

                const dots = Array.prototype.slice.call(document.querySelectorAll('#progress span'));
                dots.forEach((dot, i) => dot.classList.toggle('hecho', esProgreso(i + 1)));
            }

            guardar();
            pintar();

            try {
                if (params.has('capitulo') || params.has('listo')) {
                    history.replaceState({}, '', window.location.pathname);
                }
            } catch (e) {}
        })();
    </script>
</body>
</html>
