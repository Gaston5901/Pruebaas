<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Irisss</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        :root {
            --bg: #1a0710;
            --panel: rgba(58, 14, 31, 0.8);
            --gold: #e8c77c;
            --gold-light: #fff0d2;
            --rose: #f0a7a0;
            --violet: #9c3f5a;
            --muted: #d9b9bd;
        }
        body {
            min-height: 100dvh;
            font-family: 'Outfit', sans-serif;
            color: #fff7e6;
            background:
                radial-gradient(circle at 18% 12%, rgba(156, 63, 90, 0.22), transparent 38%),
                radial-gradient(circle at 82% 78%, rgba(232, 199, 124, 0.14), transparent 42%),
                linear-gradient(160deg, #2a0a17, var(--bg) 55%, #12040b);
            overflow-x: hidden;
            padding: 20px 16px 36px;
        }
        body::before,
        body::after { content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0; }
        body::before {
            background-image:
                radial-gradient(1.5px 1.5px at 12% 22%, #fff0d2 40%, transparent 45%),
                radial-gradient(1.5px 1.5px at 78% 16%, #e8c77c 40%, transparent 45%),
                radial-gradient(1px 1px at 42% 68%, #fff0d2 40%, transparent 45%),
                radial-gradient(1.5px 1.5px at 88% 54%, #f0a7a0 40%, transparent 45%);
            background-size: 240px 240px;
            opacity: 0.5;
            animation: breathing 7s ease-in-out infinite alternate;
        }
        body::after { background: radial-gradient(ellipse at center, transparent 45%, rgba(12, 2, 7, 0.68) 100%); }
        @keyframes breathing { from { opacity: 0.32; } to { opacity: 0.68; } }
        @keyframes appear { from { opacity: 0; transform: translateY(18px); } to { opacity: 1; transform: none; } }

        .final-wrap {
            position: relative; z-index: 1;
            width: min(620px, 100%);
            min-height: calc(100dvh - 62px);
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            animation: appear 0.9s ease both;
        }
        .nav-arriba { display: flex; align-items: center; margin-bottom: 14px; }
        .volver {
            display: inline-grid; place-items: center;
            width: 46px; height: 46px; border-radius: 50%;
            background: rgba(58, 14, 31, 0.8);
            border: 1px solid var(--gold);
            color: var(--gold); text-decoration: none;
            font-size: 1.5rem; line-height: 1;
            box-shadow: 0 6px 18px rgba(0, 0, 0, 0.45), 0 0 14px rgba(232, 199, 124, 0.22), inset 0 0 0 3px rgba(26, 7, 16, 0.5);
            backdrop-filter: blur(14px);
            transition: transform 0.25s ease, box-shadow 0.25s ease, color 0.25s ease;
        }
        .volver:hover {
            color: var(--gold-light);
            transform: translateX(-3px);
            box-shadow: 0 8px 22px rgba(0, 0, 0, 0.5), 0 0 22px rgba(232, 199, 124, 0.45), inset 0 0 0 3px rgba(26, 7, 16, 0.5);
        }
        .volver:active { transform: scale(0.94); }
        .eyebrow {
            text-align: center; color: var(--gold);
            font-family: 'Cinzel', serif; font-size: clamp(0.82rem, 2.6vw, 1rem);
            font-weight: 700;
            letter-spacing: 0.28em; text-transform: uppercase;
            text-shadow: 0 0 18px rgba(232, 199, 124, 0.35);
        }
        .intro {
            text-align: center; color: var(--muted);
            font-size: 0.85rem; line-height: 1.5;
            max-width: 470px; margin: 0 auto 16px;
        }
        #contenido { flex: 1; display: flex; flex-direction: column; justify-content: center; }

        .estacion,
        .final-todo {
            position: relative;
            text-align: center;
            padding: 30px 22px 26px;
            border-radius: 30px 10px 30px 10px;
            background:
                radial-gradient(circle at 50% 0%, rgba(232, 199, 124, 0.1), transparent 60%),
                var(--panel);
            border: 1px solid rgba(232, 199, 124, 0.3);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.45), inset 0 0 0 5px rgba(26, 7, 16, 0.4), inset 0 0 0 6px rgba(232, 199, 124, 0.16);
            backdrop-filter: blur(14px);
            animation: appear 0.7s ease both;
            overflow: visible;
        }
        .estacion > *:not(.esquina),
        .final-todo > *:not(.esquina) { position: relative; z-index: 1; }
        .esquina {
            position: absolute;
            font-family: 'Cinzel', serif; font-size: 0.9rem; line-height: 1;
            color: rgba(232, 199, 124, 0.75);
            text-shadow: 0 0 10px rgba(232, 199, 124, 0.35);
            pointer-events: none; z-index: 2;
        }
        .esquina.tl { top: 7px; left: 11px; }
        .esquina.tr { top: 7px; right: 11px; }
        .esquina.bl { bottom: 7px; left: 11px; }
        .esquina.br { bottom: 7px; right: 11px; }
        .estacion-num {
            font-family: 'Cinzel', serif;
            font-size: clamp(3.2rem, 14vw, 5rem);
            line-height: 1;
            color: transparent;
            background: linear-gradient(135deg, #fff7e6, var(--gold));
            -webkit-background-clip: text; background-clip: text;
            filter: drop-shadow(0 4px 18px rgba(232, 199, 124, 0.35));
        }
        .estacion-tag,
        .final-tag {
            color: var(--gold); font-family: 'Cinzel', serif;
            font-size: 0.62rem; letter-spacing: 0.24em; text-transform: uppercase;
        }
        .estacion-tag { margin: 0 0 6px; font-size: 0.72rem; letter-spacing: 0.22em; font-weight: 600; }
        .final-tag { margin-top: 8px; }
        .estacion-titulo,
        .final-titulo {
            font-family: 'Cinzel', serif; font-weight: 600;
            font-size: clamp(1.3rem, 5vw, 1.9rem);
            color: var(--gold-light); margin: 10px 0 8px;
        }
        .estacion-frase,
        .final-frase {
            color: var(--muted); font-size: 0.9rem; line-height: 1.55;
            max-width: 380px; margin: 0 auto 20px;
        }
        .estacion-cta {
            appearance: none; font: inherit; cursor: pointer;
            position: relative; isolation: isolate; overflow: hidden;
            padding: 14px 26px; border-radius: 16px 5px 16px 5px;
            background: linear-gradient(135deg, #fff1c9 0%, #e8c77c 45%, #c9963f 100%);
            border: 1px solid rgba(255, 247, 222, 0.8); color: #2a0a17;
            font-family: 'Cinzel', serif; font-weight: 700; font-size: 0.76rem; letter-spacing: 0.14em;
            text-shadow: 0 1px 0 rgba(255, 255, 255, 0.35);
            box-shadow: 0 12px 26px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(156, 63, 90, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.6), inset 0 -2px 0 rgba(120, 70, 20, 0.25);
            transition: transform 0.25s ease, box-shadow 0.25s ease;
        }
        .estacion-cta::after {
            content: ''; position: absolute; z-index: -1;
            top: -50%; left: -60%; width: 38%; height: 200%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.5), transparent);
            transform: rotate(25deg);
            transition: left 0.6s ease;
        }
        .estacion-cta:hover {
            transform: translateY(-2px);
            box-shadow: 0 16px 32px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(156, 63, 90, 0.5), 0 0 18px rgba(232, 199, 124, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.7), inset 0 -2px 0 rgba(120, 70, 20, 0.3);
        }
        .estacion-cta:hover::after { left: 120%; }
        .estacion-cta:active { transform: scale(0.97); }
        .final-todo .estacion-cta { margin-top: 4px; }
        .strip-hint {
            width: 100%; text-align: center; color: var(--muted);
            font-size: 0.72rem; letter-spacing: 0.06em;
            margin: 16px 0 -4px;
        }
        .strip {
            display: flex; flex-direction: column; align-items: center;
            gap: 20px; margin-top: 16px;
        }
        .strip-row { display: flex; justify-content: center; gap: 40px; }
        .strip button {
            appearance: none; font: inherit; cursor: pointer;
            width: 60px; height: 60px; border: 0;
            clip-path: polygon(50% 0%, 61% 35%, 98% 35%, 68% 57%, 79% 91%, 50% 70%, 21% 91%, 32% 57%, 2% 35%, 39% 35%);
            background: linear-gradient(145deg, #f9e6ad 0%, #d9b86a 55%, #a8782f 100%);
            color: #2a1608;
            font-family: 'Cinzel', serif; font-size: 1.05rem; font-weight: 700;
            display: flex; align-items: center; justify-content: center;
            padding-top: 10px; line-height: 1;
            touch-action: manipulation;
            text-shadow: 0 1px 0 rgba(255, 248, 220, 0.5);
            transition: transform 0.2s ease, background 0.2s ease;
        }
        .strip button:hover:not(:disabled) { transform: translateY(-3px) scale(1.08); }
        .strip button:active:not(:disabled) { transform: scale(0.94); }
        .strip button.hecho { background: linear-gradient(145deg, #fff4d2 0%, #e8c77c 55%, #c2943f 100%); }
        .strip button.actual { background: linear-gradient(145deg, #fff9e6 0%, #f2d58c 55%, #d9ae55 100%); }
        .strip button:disabled { opacity: 0.4; cursor: default; }
        .strip button:focus-visible { outline: 2px solid var(--gold-light); outline-offset: 3px; }
        @media (max-width: 520px) {
            body { padding: 16px 12px 30px; }
            .nav-arriba { margin-bottom: 10px; }
            .volver { width: 44px; height: 44px; font-size: 1.4rem; }
            .intro { margin-bottom: 8px; }
            #contenido { justify-content: flex-start; padding-top: 4px; }
            .strip { gap: 16px; margin-top: 12px; }
            .strip-row { gap: 32px; }
            .strip-hint { margin-top: 12px; }
            .strip button { width: 54px; height: 54px; font-size: 0.94rem; padding-top: 9px; }
        }
        @media (max-width: 420px) {
            .estacion, .final-todo { padding: 22px 16px; }
            .intro { font-size: 0.8rem; }
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.2s !important; }
        }
    </style>
</head>
<body>
    <div class="final-wrap">
        <div class="nav-arriba">
            <a class="volver" href="../../lobby/lobby.html" title="Volver al lobby" aria-label="Volver al lobby">←</a>
        </div>
        <div class="eyebrow">El gran final</div>
        <p class="intro">Ya estamos llegando al final de este viaje Iriss. Vamos de a uno, sin apuro: cada capítulo se abre cuando terminás el anterior.</p>
        <div id="contenido"></div>
    </div>

    <script>
        (function () {
            const KEY = 'sorpresa9_capitulos_completados_v2';
            if (new URLSearchParams(window.location.search).get('reiniciar') === '1') {
                try { localStorage.removeItem(KEY); } catch (e) {}
            }
            const capitulos = [
                { id: 1, nombre: 'Palabras guardadas', frase: 'Algo que escribí para vos y que recién cobra sentido acá, al final.', destino: 'carta.html?capitulo=1' },
                { id: 2, nombre: 'El comienzo', frase: 'Lo que empezó aquel día todavía sigue latiendo en cada vuelta.', destino: 'index.html?desbloqueado=1' },
                { id: 3, nombre: 'Un detallito', frase: 'Algo chiquito, elegido con ganas, esperando su momento.', destino: 'oso/index.html?capitulo=3' },
                { id: 4, nombre: 'Los deseos', frase: 'Tocá, pedí y dejá que el momento haga lo suyo.', destino: '../../lobby/index.html?capitulo=4' },
                { id: 5, nombre: 'El cielo', frase: 'Buscá tu lugar, mirá arriba y disfrutalo sin apuro.', destino: '../../fuegos artificiales/index.html?capitulo=5' },
                { id: 6, nombre: 'Lo último', frase: 'Queda una última cosa para vos Iriss.', destino: 'rostro/index.html?capitulo=6', cta: 'Ver sorpresa →' }
            ];

            let completados = new Set();
            try {
                const guardados = JSON.parse(localStorage.getItem(KEY) || '[]');
                if (Array.isArray(guardados)) guardados.forEach((n) => completados.add(Number(n)));
            } catch (e) {
                completados = new Set();
            }

            const params = new URLSearchParams(window.location.search);
            const cap = Number(params.get('capitulo'));
            if (params.get('listo') === '1' && cap >= 1 && cap <= 6) completados.add(cap);

            function guardar() {
                try { localStorage.setItem(KEY, JSON.stringify([...completados].sort((a, b) => a - b))); } catch (e) {}
            }

            function esProgreso(id) {
                return completados.has(id);
            }

            function totalProgreso() {
                return capitulos.filter((c) => esProgreso(c.id)).length;
            }

            function desbloqueado(id) {
                if (totalProgreso() >= 6) return true;
                if (id === 1) return true;
                const capitulo = capitulos.find((c) => c.id === id);
                if (capitulo && capitulo.proximamente) return false;
                return esProgreso(id - 1) || completados.has(id);
            }

            function abrir(capitulo) {
                if (capitulo.destino) {
                    window.location.href = capitulo.destino;
                    return;
                }
                completados.add(capitulo.id);
                guardar();
                pintar();
            }

            function pintar() {
                const contenido = document.getElementById('contenido');
                contenido.innerHTML = '';
                const todosListos = totalProgreso() >= 6;
                const actual = capitulos.find((c) => !esProgreso(c.id)) || capitulos[5];

                const panel = document.createElement('section');
                const esquinas = '<span class="esquina tl">✦</span><span class="esquina tr">✦</span><span class="esquina bl">✦</span><span class="esquina br">✦</span>';
                panel.className = todosListos ? 'final-todo' : 'estacion';
                if (todosListos) {
                    panel.innerHTML = esquinas +
                        '<div class="final-tag">Última parada</div>' +
                        '<h2 class="final-titulo">Llegamos Irisss</h2>' +
                        '<p class="final-frase">9 sorpresas, capítulos y todo este viaje para tu día. Felizzz 21 añoss señoritaaa: te deseo lo mejor siempre y que lo disfrutes al maximo, acordate que no tenés límites y sos capaz de alcanzar cualquier cosa que te propongas, Pachuchaa🌹✨</p>';
                } else {
                    panel.innerHTML = esquinas +
                        '<div class="estacion-tag">Capítulo</div>' +
                        '<div class="estacion-num">' + actual.id + '</div>' +
                        '<h2 class="estacion-titulo">' + actual.nombre + '</h2>' +
                        '<p class="estacion-frase">' + actual.frase + '</p>' +
                        '<button class="estacion-cta" type="button">' + (actual.cta || (actual.destino ? 'Abrir capítulo →' : 'Marcar como visto ✓')) + '</button>';
                    const cta = panel.querySelector('.estacion-cta');
                    cta.addEventListener('click', () => abrir(actual));
                }
                contenido.appendChild(panel);

                const stripHint = document.createElement('p');
                stripHint.className = 'strip-hint';
                stripHint.textContent = 'Tocá una estrella para ver el capitulo de vuelta ♥';
                contenido.appendChild(stripHint);

                const strip = document.createElement('div');
                strip.className = 'strip';
                [[1, 2, 3], [4, 5], [6]].forEach((fila) => {
                    const row = document.createElement('div');
                    row.className = 'strip-row';
                    fila.forEach((id) => {
                        const capitulo = capitulos.find((c) => c.id === id);
                        if (!capitulo) return;
                        const btn = document.createElement('button');
                        btn.type = 'button';
                        btn.textContent = String(capitulo.id);
                        btn.setAttribute('aria-label', 'Capítulo ' + capitulo.id + ': ' + capitulo.nombre);
                        if (esProgreso(capitulo.id)) btn.classList.add('hecho');
                        if (!todosListos && capitulo.id === actual.id) btn.classList.add('actual');
                        const habilitado = desbloqueado(capitulo.id) && !capitulo.proximamente;
                        btn.disabled = !habilitado;
                        btn.title = capitulo.proximamente ? 'Próximamente' : capitulo.nombre;
                        if (habilitado) btn.addEventListener('click', () => abrir(capitulo));
                        row.appendChild(btn);
                    });
                    strip.appendChild(row);
                });
                contenido.appendChild(strip);
            }

            guardar();
            pintar();

            try {
                if (params.has('capitulo') || params.has('listo') || params.has('reiniciar')) {
                    history.replaceState({}, '', window.location.pathname);
                }
            } catch (e) {}
        })();
    </script>
</body>
</html>
