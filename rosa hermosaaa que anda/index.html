<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Para Guadiss</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <a class="back-button" href="../index.html" title="Volver"><span class="back-arrow">←</span></a>
    <div class="rosa-container" id="rosa-container">
        <div class="glass">
            <div class="glass-glow-base"></div>
            <div class="flower">
                <div class="petal p1"></div>
                <div class="petal p2"></div>
                <div class="petal p3"></div>
                <div class="petal p4"></div>
                <div class="petal p5"></div>
                <div class="petal p6"></div>
                <div class="petal p7"></div>
                <div class="petal p8"></div>
                <div class="petal inner i1"></div>
                <div class="petal inner i2"></div>
                <div class="petal inner i3"></div>
                <div class="bud"></div>
                <div class="stem">
                    <div class="leaf l1"></div>
                    <div class="leaf l2"></div>
                </div>
            </div>

            <!-- Pétalos caídos en el suelo del domo -->
            <div class="fallen-petal fp1"></div>
            <div class="fallen-petal fp2"></div>
            <div class="fallen-petal fp3"></div>
            
            <!-- Pétalo que cae animado -->
            <div class="falling-petal"></div>

            <!-- Contador dentro del vidrio -->
            <div class="counter">
                <div class="counter-label">Desde que empezamos a hablar,<br>mi pachuchitaa 💗</div>
                <div class="counter-blocks">
                    <div class="counter-block" id="c-anios-wrap">
                        <span class="value" id="c-anios">0</span>
                        <span class="label" id="c-anios-label">años</span>
                    </div>
                    <div class="counter-block">
                        <span class="value" id="c-dias">0</span>
                        <span class="label">días</span>
                    </div>
                    <div class="counter-block">
                        <span class="value" id="c-horas">0</span>
                        <span class="label">horas</span>
                    </div>
                    <div class="counter-block">
                        <span class="value" id="c-min">0</span>
                        <span class="label">min</span>
                    </div>
                    <div class="counter-block">
                        <span class="value" id="c-seg">0</span>
                        <span class="label">seg</span>
                    </div>
                </div>
                <div class="counter-footer">y esto es todo el tiempo que te llevo amando 💝</div>
            </div>

            <!-- Lucecitas flotando dentro del domo -->
            <div class="bokeh b1"></div>
            <div class="bokeh b2"></div>
            <div class="bokeh b3"></div>
            <div class="bokeh b4"></div>
            <div class="bokeh b5"></div>
            <div class="bokeh b6"></div>
            <div class="bokeh b7"></div>
            <div class="bokeh b8"></div>
        </div>

        <a class="go-to-envelope" href="../cartitas/index.html"><span class="btn-text">Abrir las cartitas</span> 💌</a>
    </div>

    <script src="script.js"></script>
</body>
</html>
